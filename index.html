">จำนวน</th><th class="num">ราคา/หน่วย</th><th class="num">รวม</th></tr></thead><tbody>${items.map((p,i)=>`<tr><td>${page*6+i+1}</td><td><div class="doc-item-name">${e(p.name)}</div>${p.description?`<div class="doc-item-desc">${e(p.description)}</div>`:''}</td><td class="num">${num(p.qty)} ${e(p.unit||'')}</td><td class="num">฿${money(p.unitPrice)}</td><td class="num">฿${money(productNet(p))}</td></tr>`).join('')}${Array.from({length:Math.max(0,6-items.length)},()=>`<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>`).join('')}</tbody></table>${isLast?`${isDelivery?renderDeliveryLast(o):renderFinancialLast(type,o,t)}`:''}<footer class="doc-footer"><span>${e(state.settings.instagram||'')} · ${e(state.settings.line||'')} · ${e(state.settings.phone||'')}</span><span class="doc-page-no">PAGE ${page+1} / ${totalPages}</span></footer></section>`}
function renderFinancialLast(type,o,t){return `<div class="doc-summary"><div class="doc-terms"><strong>เงื่อนไข / หมายเหตุ</strong><br>${e(o.note||state.settings.terms||'-').replace(/\n/g,'<br>')}${state.settings.bankNo?`<br><br><strong>ชำระเงิน</strong><br>${e(state.settings.bankName)} · ${e(state.settings.bankAccount)} · ${e(state.settings.bankNo)}`:''}</div><div class="doc-total-box"><div class="doc-total-row"><span>รวมสินค้า</span><b>฿${money(t.productSubtotal)}</b></div>${t.delivery?`<div class="doc-total-row"><span>ค่าจัดส่ง</span><b>฿${money(t.delivery)}</b></div>`:''}${t.discount?`<div class="doc-total-row"><span>ส่วนลด</span><b>- ฿${money(t.discount)}</b></div>`:''}${o.vatEnabled?`<div class="doc-total-row"><span>VAT ${num(o.vatRate)}%</span><b>฿${money(t.vat)}</b></div>`:''}<div class="doc-total-row grand"><span>ยอดสุทธิ</span><span>฿${money(t.total)}</span></div>${['receipt','tax'].includes(type)?`<div class="doc-total-row"><span>รับชำระแล้ว</span><b>฿${money(paid(o))}</b></div>`:''}</div></div><div class="doc-signatures"><div><div class="sig-line">ผู้เสนอราคา / ผู้รับเงิน</div></div><div><div class="sig-line">ผู้อนุมัติ / ลูกค้า</div></div></div>`}
function renderDeliveryLast(o){return `<div class="doc-summary"><div class="doc-terms"><strong>ข้อมูลจัดส่ง</strong><br>${(o.deliveries||[]).map((d,i)=>`<b>จุด ${i+1}</b> ${e(d.recipient||'-')} · ${e(d.phone||'-')} · ${fmtDate(d.date)} ${e(d.time||'')}<br>${e(d.address||'-').replace(/\n/g,'<br>')}`).join('<br>')}<br><br><strong>หมายเหตุ</strong><br>${e(o.note||'-').replace(/\n/g,'<br>')}</div><div></div></div><div class="doc-signatures"><div><div class="sig-line">ผู้ส่งมอบ</div></div><div><div class="sig-line">ผู้รับสินค้า</div></div></div>`}

/* ===== Core v1.2 overrides ===== */
let draftDirty=false;
function upgradeState(data){
  data=data&&typeof data==='object'?data:seed();
  data.seq=data.seq||{};['order','quote','invoice','receipt','delivery','tax'].forEach(k=>data.seq[k]=num(data.seq[k]||0));
  data.orders=Array.isArray(data.orders)?data.orders:[];data.customers=Array.isArray(data.customers)?data.customers:[];data.flowers=Array.isArray(data.flowers)?data.flowers:[];data.templates=Array.isArray(data.templates)?data.templates:[];
  data.orders.forEach(o=>{
    o.documents=Array.isArray(o.documents)?o.documents:[];
    o.quoteVersions=Array.isArray(o.quoteVersions)?o.quoteVersions:[];
    o.productionStatus=o.productionStatus||(['active','completed'].includes(o.status)?'in_production':'not_started');
    o.payments=Array.isArray(o.payments)?o.payments:[];
    o.payments.forEach(p=>{if(p.kind===undefined)p.kind=num(p.amount)<0?'reversal':'payment'});
    o.deliveries=Array.isArray(o.deliveries)?o.deliveries:[];
    o.deliveries.forEach(d=>{d.status=d.status|| (o.status==='completed'?'delivered':'scheduled');d.autoFromCustomer=!!d.autoFromCustomer});
    if(o.status==='quoted'&&!o.quoteVersions.length&&o.quoteNo){o.quoteVersions.push({id:uid(),number:o.quoteNo,version:1,issuedAt:o.updatedAt||o.createdAt||new Date().toISOString(),legacy:true})}
    refreshOrderStatus(o,false);
  });
  return data;
}
function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY);const data=raw?JSON.parse(raw):seed();const upgraded=upgradeState(data);localStorage.setItem(KEY,JSON.stringify(upgraded));return upgraded}catch{return upgradeState(seed())}}

function renderWorkflowCard(o){const q=(o.quoteVersions||[]).length>0,accepted=o.quoteStatus==='accepted',prod=o.productionStatus!=='not_started',ready=o.productionStatus==='ready',done=o.status==='completed';return `<div class="workflow-card"><div class="workflow-head"><div><div class="section-kicker">WORKFLOW</div><div class="section-title" style="margin-bottom:0">สถานะงานจริง</div></div>${statusBadge(o)}</div><div class="workflow-steps"><div class="workflow-step ${q?'done':'current'}"><b>1 · Quotation</b><small>${q?'ออกแล้ว '+(o.quoteVersions||[]).length+' เวอร์ชัน':'ยังไม่ออกใบเสนอราคา'}</small></div><div class="workflow-step ${accepted?'done':q?'current':''}"><b>2 · Confirmed</b><small>${accepted?'ลูกค้ายืนยันแล้ว':'รอยืนยันจากลูกค้า'}</small></div><div class="workflow-step ${ready?'done':prod?'current':''}"><b>3 · Production</b><small>${productionLabel(o.productionStatus)}</small></div><div class="workflow-step ${done?'done':(ready||prod)?'current':''}"><b>4 · Delivery & Close</b><small>${done?'ปิดงานแล้ว':allDelivered(o)?'ส่งครบ รอรับเงิน':'ติดตามการส่งและยอดคงเหลือ'}</small></div></div><div class="workflow-actions">${q&&!accepted?`<button class="btn btn-dark btn-sm" onclick="acceptQuotation()">ลูกค้ายืนยันใบเสนอราคา</button>`:''}${accepted&&o.productionStatus==='not_started'?`<button class="btn btn-primary btn-sm" onclick="setProductionStatus('in_production')">เริ่มจัดดอกไม้</button>`:''}${o.productionStatus==='in_production'?`<button class="btn btn-dark btn-sm" onclick="setProductionStatus('ready')">พร้อมส่ง</button>`:''}${o.status!=='cancelled'&&o.status!=='completed'?`<button class="btn btn-danger btn-sm" onclick="cancelOrder()">ยกเลิกออเดอร์</button>`:''}</div></div>`}

function classifyColor(hex){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),H=0,S=0,L=(max+min)/2,d=max-min;if(d){S=d/(1-Math.abs(2*L-1));switch(max){case r:H=60*(((g-b)/d)%6);break;case g:H=60*((b-r)/d+2);break;case b:H=60*((r-g)/d+4)}if(H<0)H+=360}let family;if(L>.93)family='ขาว/ครีม';else if(L<.18)family='ดำ';else if(S<.10)family='เทา';else if(H<12||H>=355)family='แดง';else if(H<45)family='ส้ม/พีช';else if(H<68)family='เหลือง';else if(H<155)family='เขียว';else if(H<200)family='มิ้นต์/ฟ้าอมเขียว';else if(H<250)family='ฟ้า/น้ำเงิน';else if(H<315)family='ม่วง';else family='ชมพู';let tone;if(L>.9)tone='อ่อนมาก';else if(L>.68&&S<.85)tone='พาสเทล';else if(S<.28)tone='หม่น';else if(L<.3)tone='เข้ม';else if(S>.72&&L<.68)tone='สด';else tone='กลาง';return {family,tone,hue:Math.round(H),sat:Math.round(S*100),light:Math.round(L*100)}}

function addEventCost(){draftOrder.eventCosts.push({id:uid(),label:'',amount:0});markDirty();render()}function cLabel(id,v){draftOrder.eventCosts.find(x=>x.id===id).label=v;markDirty()}function cAmount(id,v){draftOrder.eventCosts.find(x=>x.id===id).amount=num(v);markDirty()}function removeEventCost(id){draftOrder.eventCosts=draftOrder.eventCosts.filter(x=>x.id!==id);markDirty();render()}

function openPaymentModal(){if(!['confirmed','active','completed'].includes(draftOrder.status)){toast('ต้องยืนยันออเดอร์ก่อนบันทึกการชำระเงิน','danger');return}const outstanding=Math.max(0,orderTotal(draftOrder).total-paid(draftOrder));if(outstanding<=0){toast('ออเดอร์นี้รับชำระครบแล้ว','success');return}document.getElementById('modal').className='modal small';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><h3>บันทึกการชำระเงิน</h3><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="guard-note">ยอดคงเหลือปัจจุบัน ฿${money(outstanding)} — ระบบจะไม่ให้รับเกินยอด</div><div class="form-grid" style="margin-top:14px">${field('วันที่',`<input id="payDate" type="date" class="input" value="${today()}">`,2)}${field('จำนวนเงิน',`<input id="payAmount" type="number" min="0.01" max="${outstanding}" class="input" value="${outstanding.toFixed(2)}">`,2)}${field('ช่องทาง',`<select id="payMethod" class="select"><option>โอนเงิน</option><option>เงินสด</option><option>บัตร</option><option>อื่นๆ</option></select>`,2)}${field('เลขอ้างอิง / หมายเหตุ',`<input id="payRef" class="input">`,2)}</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-dark" onclick="savePayment()">บันทึก</button></div></div>`;openModal()}
function savePayment(){let a=num(document.getElementById('payAmount').value),outstanding=Math.max(0,orderTotal(draftOrder).total-paid(draftOrder));if(a<=0){toast('จำนวนเงินต้องมากกว่า 0','danger');return}if(a>outstanding+0.005){toast('ยอดรับเกินยอดคงเหลือ','danger');return}draftOrder.payments.push({id:uid(),kind:'payment',date:document.getElementById('payDate').value,amount:a,method:document.getElementById('payMethod').value,ref:document.getElementById('payRef').value,createdAt:new Date().toISOString()});refreshOrderStatus(draftOrder,false);markDirty();closeModal();saveOrderDraft()}
function reversePayment(id){const p=draftOrder.payments.find(x=>x.id===id);if(!p||num(p.amount)<=0||draftOrder.payments.some(x=>x.reversalFor===id))return;if(!confirm(`ย้อนรายการรับเงิน ฿${money(p.amount)} ? ระบบจะเก็บประวัติรายการเดิมไว้`))return;draftOrder.payments.push({id:uid(),kind:'reversal',date:today(),amount:-Math.abs(num(p.amount)),method:'ย้อนรายการ',ref:'Reverse '+(p.ref||p.id.slice(0,8)),reversalFor:p.id,createdAt:new Date().toISOString()});refreshOrderStatus(draftOrder,false);markDirty();saveOrderDraft()}
function docTypeLabel(t){return ({quotation:'ใบเสนอราคา',invoice:'ใบแจ้งหนี้',delivery:'ใบส่งของ',receipt:'ใบเสร็จรับเงิน',tax:'ใบกำกับภาษี'})[t]||t}
function snapshotSeller(){const s=state.settings;return {company:s.company,legalName:s.legalName,address:s.address,taxId:s.taxId,branch:s.branch,phone:s.phone,email:s.email,instagram:s.instagram,line:s.line,bankName:s.bankName,bankAccount:s.bankAccount,bankNo:s.bankNo,terms:s.terms}}
function snapshotCustomer(o){return structuredClone(state.customers.find(c=>c.id===o.customerId)||{name:'ลูกค้าทั่วไป'})}
function createDocumentSnapshot(type,extra={}){if(!saveOrderDraft())return null;const o=draftOrder;let number,version=null;if(type==='quotation'){if(!o.quoteBaseNo)o.quoteBaseNo=`${state.settings.quotePrefix}-${new Date().getFullYear()}-${String(++state.seq.quote).padStart(4,'0')}`;version=(o.quoteVersions||[]).length+1;number=`${o.quoteBaseNo}-V${version}`;o.quoteNo=number;o.quoteStatus='sent'}else{const conf={invoice:['invoice','invoicePrefix'],delivery:['delivery','deliveryPrefix'],receipt:['receipt','receiptPrefix'],tax:['tax','taxPrefix']}[type];if(!conf)return null;number=`${state.settings[conf[1]]}-${new Date().getFullYear()}-${String(++state.seq[conf[0]]).padStart(4,'0')}`}
  const doc={id:uid(),type,number,version,issuedDate:today(),issuedAt:new Date().toISOString(),seller:snapshotSeller(),customer:snapshotCustomer(o),order:structuredClone({...o,documents:[],quoteVersions:[]}),...extra};
  o.documents=o.documents||[];o.documents.push(doc);if(type==='quotation'){o.quoteVersions=o.quoteVersions||[];o.quoteVersions.push({id:doc.id,number,version,issuedAt:doc.issuedAt});refreshOrderStatus(o,false)};const idx=state.orders.findIndex(x=>x.id===o.id);if(idx>=0)state.orders[idx]=structuredClone(o);save();draftDirty=false;return doc}
function issueQuotation(){if(!editingOrderId){if(!saveOrderDraft())return}const doc=createDocumentSnapshot('quotation');if(doc){toast(`ออกใบเสนอราคา V${doc.version} แล้ว`,'success');openDocument('quotation',draftOrder.id,doc.id)}}
function issueDocument(type){refreshOrderStatus(draftOrder,false);if(type==='invoice'&&!['confirmed','active','completed'].includes(draftOrder.status)){toast('ใบแจ้งหนี้ออกได้หลังลูกค้ายืนยันออเดอร์','danger');return}if(type==='delivery'&&!['active','completed'].includes(draftOrder.status)){toast('ใบส่งของออกได้เมื่อเริ่มดำเนินงานแล้ว','danger');return}if(['receipt','tax'].includes(type)&&paid(draftOrder)<=0){toast(`${docTypeLabel(type)} ต้องมีรายการรับชำระเงินก่อน`,'danger');return}if(type==='receipt'){const received=(draftOrder.payments||[]).filter(p=>num(p.amount)>0&&!draftOrder.payments.some(x=>x.reversalFor===p.id));const receipted=new Set((draftOrder.documents||[]).filter(d=>d.type==='receipt'&&d.paymentId).map(d=>d.paymentId));const target=received.find(p=>!receipted.has(p.id));if(!target){toast('ไม่มีรายการรับชำระใหม่ที่ยังไม่ได้ออกใบเสร็จ','success');return}const doc=createDocumentSnapshot(type,{paymentId:target.id,receiptAmount:num(target.amount)});if(doc)openDocument(type,draftOrder.id,doc.id);return}const doc=createDocumentSnapshot(type);if(doc)openDocument(type,draftOrder.id,doc.id)}
function openDocumentsMenu(){const o=draftOrder,docs=o.documents||[];document.getElementById('modal').className='modal';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">DOCUMENT LEDGER</div><h3>เอกสารของ ${e(o.orderNo)}</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="grid-2"><button class="btn btn-primary" onclick="closeModal();issueQuotation()">ออกใบเสนอราคา Revision ใหม่</button><button class="btn btn-dark" onclick="closeModal();issueDocument('invoice')">ออกใบแจ้งหนี้</button><button class="btn btn-outline" onclick="closeModal();issueDocument('delivery')">ออกใบส่งของ</button><button class="btn btn-outline" onclick="closeModal();issueDocument('receipt')">ออกใบเสร็จจากยอดรับล่าสุด</button><button class="btn btn-outline" onclick="closeModal();issueDocument('tax')">ออกใบกำกับภาษี</button></div><div class="guard-note">เอกสารที่ออกแล้วเป็น Snapshot แก้ Order ภายหลังจะไม่เปลี่ยนเอกสารเก่า</div><div class="doc-history">${docs.slice().reverse().map(d=>`<div class="doc-history-row"><div><b>${e(d.number)}</b><small>${docTypeLabel(d.type)} · ${fmtDate(d.issuedDate)}${d.version?` · Revision ${d.version}`:''}</small></div><div class="actions"><button class="btn btn-outline btn-sm" onclick="closeModal();openDocument('${d.type}','${o.id}','${d.id}')">เปิดเอกสาร</button></div></div>`).join('')||'<div class="empty">ยังไม่มีเอกสารที่ออก</div>'}</div></div>`;openModal()}
function renderOrderSummary(o){const t=orderTotal(o);return `<aside class="summary-box"><div class="mono" style="color:rgba(255,255,255,.55)">ORDER SUMMARY</div><h3>${e(o.orderNo)}</h3><div class="sum-row"><span>สินค้า</span><b>${(o.products||[]).length} รายการ</b></div><div class="sum-row"><span>รวมสินค้า</span><b>฿${money(t.productSubtotal)}</b></div><div class="sum-row"><span>ค่าจัดส่ง (${(o.deliveries||[]).length} จุด)</span><b>฿${money(t.delivery)}</b></div><div class="sum-row"><span>ส่วนลด</span><b>- ฿${money(t.discount)}</b></div>${o.vatEnabled?`<div class="sum-row"><span>VAT ${num(o.vatRate)}%</span><b>฿${money(t.vat)}</b></div>`:''}<div class="sum-row total"><span>ยอดสุทธิ</span><span>฿${money(t.total)}</span></div>${editingOrderId?`<div class="sum-row"><span>รับชำระสุทธิ</span><b>฿${money(Math.max(0,paid(o)))}</b></div><div class="sum-row"><span>คงเหลือ</span><b>฿${money(Math.max(0,t.total-paid(o)))}</b></div>`:''}<div class="summary-actions"><button class="btn btn-white" onclick="saveOrderDraft()">บันทึกออเดอร์</button>${editingOrderId?`<button class="btn btn-primary" onclick="issueQuotation()">${(o.quoteVersions||[]).length?'ออก Revision ใหม่':'ออกใบเสนอราคา'}</button><button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)" onclick="openDocumentsMenu()">เอกสารทั้งหมด</button>`:''}</div></aside>`}
function renderCustomers(){return `<div class="page-head"><div><h2>ลูกค้า / CRM</h2><p>ข้อมูลผู้ซื้อเป็นหลัก ผู้รับดอกไม้เก็บในแต่ละออเดอร์ได้แยกกัน</p></div><div class="actions"><button class="btn btn-primary" onclick="openCustomerModal()">+ เพิ่มลูกค้า</button></div></div><div class="grid-3">${state.customers.map(c=>{let os=state.orders.filter(o=>o.customerId===c.id&&!['cancelled'].includes(o.status));let paidOrders=os.filter(o=>['confirmed','active','completed'].includes(o.status));let spend=paidOrders.reduce((s,o)=>s+orderTotal(o).total,0);let tier=spend>=50000?'VIP':paidOrders.length>=3?'Loyal':paidOrders.length>=1?'Active':'New';return `<div class="card entity-card"><h3>${e(c.name)}</h3><div class="meta"><span class="badge ${tier==='VIP'?'orange':''}">${tier}</span><span class="badge">${e(c.type)}</span><span class="badge">${e(c.channel||'-')}</span></div><div class="sub">${e(c.contactName||'')} · ${e(c.phone||'-')}</div><div class="sub">${e(c.email||'')}</div><div class="foot"><div><div class="money">฿${money(spend)}</div><div class="sub">${paidOrders.length} ออเดอร์ยืนยัน</div></div><button class="btn btn-outline btn-sm" onclick="openCustomerModal(false,'${c.id}')">แก้ไข</button></div></div>`}).join('')||'<div class="empty">ยังไม่มีลูกค้า</div>'}</div>`}
function renderAnalytics(){const orders=confirmedOrders();let flowerMap={},colorMap={},channelMap={};let revenue=0,cost=0;orders.forEach(o=>{revenue+=orderTotal(o).total;cost+=(o.eventCosts||[]).reduce((s,c)=>s+num(c.amount),0);channelMap[o.source]=(channelMap[o.source]||0)+1;(o.products||[]).forEach(p=>(p.flowers||[]).forEach(f=>{const used=num(f.qty)*num(p.qty||1);flowerMap[f.flowerName]=(flowerMap[f.flowerName]||0)+used;let k=(f.family||'ไม่ระบุ')+' / '+(f.tone||'');colorMap[k]=(colorMap[k]||0)+used}))});return `<div class="page-head"><div><h2>วิเคราะห์</h2><p>อ่านจากออเดอร์ที่ยืนยันแล้ว และคูณจำนวนสินค้าจริงในการนับการใช้ดอกไม้</p></div></div><div class="kpis" style="margin-bottom:14px"><div class="card kpi kpi-primary"><div class="kpi-label">รายได้ออเดอร์ยืนยัน</div><div class="kpi-value">฿${money(revenue)}</div><div class="kpi-note">Confirmed / Active / Completed</div></div><div class="card kpi kpi-primary"><div class="kpi-label">ต้นทุน Event ที่บันทึก</div><div class="kpi-value">฿${money(cost)}</div><div class="kpi-note">ยังไม่รวมต้นทุนดอกไม้รายชิ้น</div></div><div class="card kpi kpi-primary"><div class="kpi-label">Contribution หลัง Event Cost</div><div class="kpi-value">฿${money(revenue-cost)}</div><div class="kpi-note">ตัวเลขภายในเพื่อบริหารงาน</div></div></div><div class="analytics-grid">${rankCard('ดอกไม้ที่ถูกใช้',flowerMap,'หน่วย')}${rankCard('โทนสีที่ถูกใช้',colorMap,'หน่วย')}${rankCard('ช่องทางออเดอร์',channelMap,'ออเดอร์')}</div>`}
function globalSearch(q){if(!q.trim())return;const x=q.toLowerCase();const o=state.orders.find(o=>(o.orderNo+' '+customerName(o.customerId)+' '+(o.title||'')+' '+(o.products||[]).map(p=>p.name).join(' ')).toLowerCase().includes(x));if(o){editOrder(o.id);return}const c=state.customers.find(c=>(c.name+' '+c.phone+' '+(c.email||'')).toLowerCase().includes(x));if(c){currentView='customers';render();toast('พบลูกค้า: '+c.name);return}const t=state.templates.find(t=>(t.name+' '+(t.description||'')).toLowerCase().includes(x));if(t){currentView='templates';render();toast('พบสินค้า/แบบช่อ: '+t.name);return}}
function paginateDocItems(items){const pages=[];let page=[];let units=0;for(const p of items){const text=(p.name||'')+' '+(p.description||'');const u=1+Math.min(2,Math.floor(text.length/90));if(page.length&&(page.length>=6||units+u>8)){pages.push(page);page=[];units=0}page.push(p);units+=u}if(page.length||!pages.length)pages.push(page);return pages}
function openDocument(type,id,docId=''){const live=state.orders.find(x=>x.id===id)||draftOrder;if(!live)return;let doc=(live.documents||[]).find(d=>d.id===docId);let o,c,info;if(doc){o=structuredClone(doc.order);o._seller=doc.seller;o._issueDate=doc.issuedDate;o._docNo=doc.number;o._receiptAmount=doc.receiptAmount;c=structuredClone(doc.customer);info=[docTypeLabel(type),type.toUpperCase(),doc.number]}else{o=structuredClone(live);o._seller=snapshotSeller();o._issueDate=today();o._docNo='DRAFT';c=snapshotCustomer(o);info=[docTypeLabel(type),type.toUpperCase(),'DRAFT']}const chunks=paginateDocItems(o.products||[]);document.getElementById('docPages').innerHTML=chunks.map((chunk,idx)=>renderDocPage(type,o,c,info,chunk,idx,chunks.length)).join('');document.getElementById('docOverlay').classList.add('open');setTimeout(scaleDocPages,30)}

eryDateText(o))}</span>`:''}</div></div></div><table class="doc-table"><colgroup><col style="width:8%"><col style="width:44%"><col style="width:12%"><col style="width:18%"><col style="width:18%"></colgroup><thead><tr><th>#</th><th>สินค้า / รายละเอียด</th><th class="num">จำนวน</th><th class="num">ราคา/หน่วย</th><th class="num">รวม</th></tr></thead><tbody>${items.map((p,i)=>`<tr><td>${page*6+i+1}</td><td><div class="doc-item-name">${e(p.name)}</div>${p.description?`<div class="doc-item-desc">${e(p.description)}</div>`:''}</td><td class="num">${num(p.qty)} ${e(p.unit||'')}</td><td class="num">฿${money(p.unitPrice)}</td><td class="num">฿${money(productNet(p))}</td></tr>`).join('')}${Array.from({length:Math.max(0,6-items.length)},()=>`<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>`).join('')}</tbody></table>${isLast?`${isDelivery?renderDeliveryLast(o):renderFinancialLast(type,o,t)}`:''}<footer class="doc-footer"><span>${e(seller.instagram||'')} · ${e(seller.line||'')} · ${e(seller.phone||'')}</span><span class="doc-page-no">PAGE ${page+1} / ${totalPages}</span></footer></section>`}

/* ===== Core v1.2 QA hotfix overrides ===== */
function quoteVersionStatusLabel(s){return ({sent:'ส่งแล้ว',accepted:'ยืนยันแล้ว',superseded:'แทนที่แล้ว',legacy:'ข้อมูลเดิม'})[s]||s||'ส่งแล้ว'}
function acceptQuotation(){
  const versions=draftOrder.quoteVersions||[];
  if(!versions.length){toast('ต้องออกใบเสนอราคาก่อนยืนยัน','danger');return}
  versions.forEach(v=>{if(v.status==='accepted')v.status='superseded'});
  const latest=versions[versions.length-1];latest.status='accepted';latest.acceptedAt=new Date().toISOString();
  draftOrder.quoteStatus='accepted';draftOrder.acceptedQuoteDocumentId=latest.id;
  refreshOrderStatus(draftOrder,true);markDirty();saveOrderDraft();
}
function createDocumentSnapshot(type,extra={}){
  if(!saveOrderDraft())return null;
  const o=draftOrder;let number,version=null;
  if(type==='quotation'){
    if(o.quoteStatus==='accepted'||['active','completed'].includes(o.status)||o.productionStatus!=='not_started'){
      toast('ออเดอร์นี้ยืนยันแล้ว ไม่ควรออก Revision ใบเสนอราคาใหม่ในงานเดิม','danger');return null;
    }
    if(!o.quoteBaseNo)o.quoteBaseNo=`${state.settings.quotePrefix}-${new Date().getFullYear()}-${String(++state.seq.quote).padStart(4,'0')}`;
    (o.quoteVersions||[]).forEach(v=>{if(v.status!=='accepted')v.status='superseded'});
    version=(o.quoteVersions||[]).length+1;number=`${o.quoteBaseNo}-V${version}`;o.quoteNo=number;o.quoteStatus='sent';
  }else{
    const conf={invoice:['invoice','invoicePrefix'],delivery:['delivery','deliveryPrefix'],receipt:['receipt','receiptPrefix'],tax:['tax','taxPrefix']}[type];
    if(!conf)return null;number=`${state.settings[conf[1]]}-${new Date().getFullYear()}-${String(++state.seq[conf[0]]).padStart(4,'0')}`;
  }
  const doc={id:uid(),type,number,version,issuedDate:today(),issuedAt:new Date().toISOString(),seller:snapshotSeller(),customer:snapshotCustomer(o),order:structuredClone({...o,documents:[],quoteVersions:[]}),...extra};
  o.documents=o.documents||[];o.documents.push(doc);
  if(type==='quotation'){
    o.quoteVersions=o.quoteVersions||[];o.quoteVersions.push({id:doc.id,number,version,issuedAt:doc.issuedAt,status:'sent'});refreshOrderStatus(o,false)
  }
  const idx=state.orders.findIndex(x=>x.id===o.id);if(idx>=0)state.orders[idx]=structuredClone(o);save();draftDirty=false;return doc
}
function issueQuotation(){
  if(!editingOrderId){if(!saveOrderDraft())return}
  if(draftOrder.quoteStatus==='accepted'||['active','completed'].includes(draftOrder.status)||draftOrder.productionStatus!=='not_started'){
    toast('ออเดอร์ยืนยันแล้ว ไม่สามารถออก Revision ใบเสนอราคาใหม่ได้','danger');return
  }
  const doc=createDocumentSnapshot('quotation');if(doc){toast(`ออกใบเสนอราคา V${doc.version} แล้ว`,'success');openDocument('quotation',draftOrder.id,doc.id)}
}
function issueDocument(type){
  refreshOrderStatus(draftOrder,false);
  if(type==='invoice'&&!['confirmed','active','completed'].includes(draftOrder.status)){toast('ใบแจ้งหนี้ออกได้หลังลูกค้ายืนยันออเดอร์','danger');return}
  if(type==='delivery'&&!['active','completed'].includes(draftOrder.status)){toast('ใบส่งของออกได้เมื่อเริ่มดำเนินงานแล้ว','danger');return}
  if(['receipt','tax'].includes(type)&&paid(draftOrder)<=0){toast(`${docTypeLabel(type)} ต้องมีรายการรับชำระเงินก่อน`,'danger');return}
  if(type==='tax'&&!draftOrder.vatEnabled){toast('ออเดอร์นี้ไม่ได้เปิด VAT จึงไม่ออกใบกำกับภาษีจาก Flow นี้','danger');return}
  if(type==='tax'&&!String(state.settings.taxId||'').trim()){toast('กรุณากรอกเลขผู้เสียภาษีของร้านในตั้งค่าก่อนออกใบกำกับภาษี','danger');return}
  if(type==='receipt'){
    const received=(draftOrder.payments||[]).filter(p=>num(p.amount)>0&&!draftOrder.payments.some(x=>x.reversalFor===p.id)).sort((a,b)=>(a.createdAt||a.date||'').localeCompare(b.createdAt||b.date||''));
    const receipted=new Set((draftOrder.documents||[]).filter(d=>d.type==='receipt'&&d.paymentId).map(d=>d.paymentId));
    const target=received.find(p=>!receipted.has(p.id));
    if(!target){toast('ไม่มีรายการรับชำระที่ยังไม่ได้ออกใบเสร็จ','success');return}
    const doc=createDocumentSnapshot(type,{paymentId:target.id,receiptAmount:num(target.amount)});if(doc)openDocument(type,draftOrder.id,doc.id);return
  }
  const prior=(draftOrder.documents||[]).filter(d=>d.type===type);
  if(prior.length&&!confirm(`มี${docTypeLabel(type)}ออกแล้ว ${prior.length} ฉบับ ต้องการออกฉบับใหม่หรือไม่?`))return;
  const doc=createDocumentSnapshot(type);if(doc)openDocument(type,draftOrder.id,doc.id)
}

function paginateDocItems(items){
  const pages=[];let page=[],units=0,start=0,cursor=0;
  for(const p of items){
    const text=(p.name||'')+' '+(p.description||'');const u=1+Math.min(2,Math.floor(text.length/90));
    if(page.length&&(page.length>=6||units+u>8)){pages.push({items:page,start});start=cursor;page=[];units=0}
    page.push(p);units+=u;cursor++
  }
  if(page.length||!pages.length)pages.push({items:page,start});return pages
}

  else{o=structuredClone(live);o._seller=snapshotSeller();o._issueDate=today();o._docNo='DRAFT';c=snapshotCustomer(o);info=[docTypeLabel(type),type.toUpperCase(),'DRAFT']}
  const chunks=paginateDocItems(o.products||[]);
  document.getElementById('docPages').innerHTML=chunks.map((chunk,idx)=>renderDocPage(type,o,c,info,chunk.items,idx,chunks.length,chunk.start)).join('');
  document.getElementById('docOverlay').classList.add('open');setTimeout(scaleDocPages,30)
}

function reversePayment(id){
  const p=draftOrder.payments.find(x=>x.id===id);if(!p||num(p.amount)<=0||draftOrder.payments.some(x=>x.reversalFor===id))return;
  const receipt=(draftOrder.documents||[]).find(d=>d.type==='receipt'&&d.paymentId===id);

function renderRCExtras(o){if(!editingOrderId)return'';return `<div class="form-section"><div class="section-kicker">06 / CONTROL CENTER</div><div class="section-title">ต้นทุน ประวัติ และการควบคุมงาน</div><div class="tag-editor" style="margin-bottom:12px"><input class="input" value="${e((o.tags||[]).join(', '))}" placeholder="Tags เช่น VIP, Wedding, Urgent" oninput="updateOrderTags(this.value)"></div><div class="grid-2 rc-control-grid">${renderCostLedger(o)}${renderDocLedgerCompact(o)}</div><div style="margin-top:12px">${renderActivityTimeline(o)}</div></div>`}

const _rcIssueQuotation=issueQuotation;

const _rcSetProductionStatus=setProductionStatus;

const _rcSetDeliveryStatus=setDeliveryStatus;

const _rcReversePayment=reversePayment;
reversePayment=function(id){const n=draftOrder?.payments?.length||0;const r=_rcReversePayment(id);if(draftOrder&&(draftOrder.payments||[]).length>n){const p=draftOrder.payments[draftOrder.payments.length-1];logActivity('payment_reversal',`ย้อนรายการ ฿${money(Math.abs(p.amount))}`)}return r};
const _rcIssueDocument=issueDocument;
issueDocument=function(type){const n=draftOrder?.documents?.length||0;const r=_rcIssueDocument(type);if(draftOrder&&(draftOrder.documents||[]).length>n){const d=draftOrder.documents[draftOrder.documents.length-1];logActivity('document',`${docTypeLabel(type)} ${d.number}`)}return r};
const _rcCancelOrder=cancelOrder;
cancelOrder=function(){const before=draftOrder?.status;const r=_rcCancelOrder();if(draftOrder&&before!=='cancelled'&&draftOrder.status==='cancelled')logActivity('cancel','ออเดอร์ถูกยกเลิก เอกสารเดิมยังคงอยู่ใน Ledger');return r};

function customerAffinity(c){const os=state.orders.filter(o=>o.customerId===c.id&&['confirmed','active','completed'].includes(o.status));const fm={},cm={};os.forEach(o=>(o.products||[]).forEach(p=>(p.flowers||[]).forEach(f=>{fm[f.flowerName]=(fm[f.flowerName]||0)+num(f.qty)*num(p.qty||1);const k=(f.family||'ไม่ระบุ')+(f.tone?' / '+f.tone:'');cm[k]=(cm[k]||0)+num(f.qty)*num(p.qty||1)})));const top=m=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);return {flowers:top(fm),colors:top(cm)}}
function openCustomerRecord(id){const c=state.customers.find(x=>x.id===id);if(!c)return;const os=state.orders.filter(o=>o.customerId===id&&!['cancelled'].includes(o.status)).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const confirmed=os.filter(o=>['confirmed','active','completed'].includes(o.status)),spend=confirmed.reduce((s,o)=>s+orderTotal(o).total,0),aff=customerAffinity(c);document.getElementById('modal').className='modal';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">CUSTOMER RECORD</div><h3>${e(c.name)}</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="customer-record-grid"><div class="rc-panel"><div class="sub">${e(c.type)} · ${e(c.channel||'-')}</div><h3 style="margin-top:6px">฿${money(spend)}</h3><div class="sub">${confirmed.length} ออเดอร์ที่ยืนยันแล้ว</div><div style="margin-top:14px"><b>${e(c.contactName||'')}</b><div class="sub">${e(c.phone||'-')}<br>${e(c.email||'')}<br>${e(c.address||'')}</div></div><div style="margin-top:14px"><b>ดอกไม้ที่พบในงาน</b><div class="affinity" style="margin-top:6px">${aff.flowers.map(x=>`<span class="tag">${e(x)}</span>`).join('')||'<span class="sub">ยังไม่มีข้อมูล</span>'}</div></div><div style="margin-top:12px"><b>Color affinity</b><div class="affinity" style="margin-top:6px">${aff.colors.map(x=>`<span class="tag">${e(x)}</span>`).join('')||'<span class="sub">ยังไม่มีข้อมูล</span>'}</div></div><div class="actions" style="margin-top:16px"><button class="btn btn-outline btn-sm" onclick="closeModal();openCustomerModal(false,'${c.id}')">แก้ไขข้อมูล</button><button class="btn btn-dark btn-sm" onclick="closeModal();newOrderForCustomer('${c.id}')">สร้างออเดอร์</button></div></div><div class="rc-panel"><div class="rc-panel-head"><div><h4>Order history</h4><small>ประวัติงานของผู้ซื้อรายนี้</small></div></div>${os.map(o=>`<div class="customer-order-row" onclick="closeModal();editOrder('${o.id}')"><span><b>${e(o.title||o.orderNo)}</b><small class="sub">${e(o.orderNo)} · ${deliveryDateText(o)}</small></span><span style="text-align:right">${statusBadge(o)}<br><b style="font-size:12px">฿${money(orderTotal(o).total)}</b></span></div>`).join('')||'<div class="empty">ยังไม่มีออเดอร์</div>'}</div></div></div>`;openModal()}
function newOrderForCustomer(id){newOrder();draftOrder.customerId=id;prefillRecipient();markDirty();render()}
renderCustomers=function(){return `<div class="page-head"><div><h2>ลูกค้า / CRM</h2><p>Buyer เป็น Customer หลัก ส่วนผู้รับอยู่ในแต่ละออเดอร์ และ Record นี้รวมประวัติการซื้อกับ Preference ที่อนุมานจากงานจริง</p></div><div class="actions"><button class="btn btn-primary" onclick="openCustomerModal()">+ เพิ่มลูกค้า</button></div></div><div class="grid-3">${state.customers.map(c=>{let os=state.orders.filter(o=>o.customerId===c.id&&!['cancelled'].includes(o.status)),confirmed=os.filter(o=>['confirmed','active','completed'].includes(o.status)),spend=confirmed.reduce((s,o)=>s+orderTotal(o).total,0),tier=spend>=50000?'VIP':confirmed.length>=3?'Loyal':confirmed.length>=1?'Active':'New';return `<div class="card entity-card"><h3>${e(c.name)}</h3><div class="meta"><span class="badge ${tier==='VIP'?'orange':''}">${tier}</span><span class="badge">${e(c.type)}</span><span class="badge">${e(c.channel||'-')}</span></div><div class="sub">${e(c.contactName||'')} · ${e(c.phone||'-')}</div><div class="sub">${e(c.email||'')}</div><div class="foot"><div><div class="money">฿${money(spend)}</div><div class="sub">${confirmed.length} งานยืนยัน</div></div><div class="actions"><button class="btn btn-ghost btn-sm" onclick="openCustomerRecord('${c.id}')">ดูประวัติ</button><button class="btn btn-outline btn-sm" onclick="openCustomerModal(false,'${c.id}')">แก้ไข</button></div></div></div>`}).join('')||'<div class="empty">ยังไม่มีลูกค้า</div>'}</div>`}

globalSearch=function(q){q=String(q||'').trim().toLowerCase();if(!q)return;const o=state.orders.find(o=>orderSearchText(o).includes(q));if(o){editOrder(o.id);return}const c=state.customers.find(c=>(c.name+' '+c.phone+' '+(c.email||'')).toLowerCase().includes(q));if(c){openCustomerRecord(c.id);return}const f=state.flowers.find(f=>(f.name+' '+(f.note||'')).toLowerCase().includes(q));if(f){currentView='flowers';render();toast('พบดอกไม้: '+f.name);return}toast('ไม่พบข้อมูลที่ตรงกับคำค้น')}

renderAnalytics=function(){const orders=confirmedOrders();let flowerMap={},colorMap={},channelMap={},profitRows=[];orders.forEach(o=>{channelMap[o.source]=(channelMap[o.source]||0)+1;(o.products||[]).forEach(p=>(p.flowers||[]).forEach(f=>{const qty=num(f.qty)*num(p.qty||1);flowerMap[f.flowerName]=(flowerMap[f.flowerName]||0)+qty;let k=(f.family||'ไม่ระบุ')+' / '+(f.tone||'');colorMap[k]=(colorMap[k]||0)+qty}));profitRows.push([o.title||o.orderNo,grossProfitRecorded(o),orderTotal(o).total,recordedCost(o)])});profitRows.sort((a,b)=>b[1]-a[1]);const revenue=orders.reduce((s,o)=>s+orderTotal(o).total,0),cost=orders.reduce((s,o)=>s+recordedCost(o),0);return `<div class="page-head"><div><h2>วิเคราะห์</h2><p>วิเคราะห์จาก Order ที่ยืนยันแล้ว และแยกตัวเลขที่อาศัย “ต้นทุนที่บันทึก” ออกจากยอดขาย</p></div></div><div class="kpis"><div class="card kpi kpi-primary"><div class="kpi-label">Revenue</div><div class="kpi-value">฿${money(revenue)}</div><div class="kpi-note">ยอดขายยืนยัน</div></div><div class="card kpi kpi-primary"><div class="kpi-label">Recorded Cost</div><div class="kpi-value">฿${money(cost)}</div><div class="kpi-note">Actual ก่อน ถ้าไม่มีใช้ Estimate</div></div><div class="card kpi kpi-primary"><div class="kpi-label">Recorded Margin</div><div class="kpi-value">${revenue?money((revenue-cost)/revenue*100):'0.00'}%</div><div class="kpi-note">ไม่ใช่ Accounting profit หากกรอกต้นทุนไม่ครบ</div></div></div><div class="analytics-grid" style="margin-top:14px">${rankCard('ดอกไม้ที่ถูกใช้',flowerMap,'หน่วย')}${rankCard('โทนสีที่ถูกใช้',colorMap,'หน่วย')}${rankCard('ช่องทางออเดอร์',channelMap,'ออเดอร์')}</div><div class="card panel" style="margin-top:14px"><div class="panel-title"><h3>งานที่มีกำไรจากต้นทุนบันทึกสูงสุด</h3></div>${profitRows.slice(0,8).map(x=>`<div class="list-row"><div><b>${e(x[0])}</b><div class="sub">ยอดขาย ฿${money(x[2])} · ต้นทุน ฿${money(x[3])}</div></div><div class="money">฿${money(x[1])}</div></div>`).join('')||'<div class="empty">ยังไม่มีข้อมูล</div>'}</div>`}

function labelHtml(label,required=false){return `${e(label)}${required?'<span class="req">จำเป็น</span>':''}`}
field=function(label,html,span=1,hint='',required=false,error=''){return `<div class="field ${span===2?'span2':span===3?'span3':span===4?'full':''}"><label>${labelHtml(label,required)}</label>${hint?`<div class="field-hint">${e(hint)}</div>`:''}${html}<div class="field-error">${e(error||'กรุณาตรวจสอบข้อมูล')}</div></div>`}
function choiceField(label,key,value,options,hint='',required=false){return `<div class="choice-block"><div class="choice-label">${labelHtml(label,required)}</div>${hint?`<div class="choice-hint">${e(hint)}</div>`:''}<div class="choice-group" role="group" aria-label="${e(label)}">${options.map(o=>{const v=typeof o==='string'?o:o[0],t=typeof o==='string'?o:o[1];return `<button type="button" class="choice-btn ${value===v?'active':''}" onclick="setOrderChoice('${key}','${e(v)}')">${e(t)}</button>`}).join('')}</div></div>`}
function setOrderChoice(key,val){if(!draftOrder)return;if(commercialLocked()){toast('ข้อมูลการค้าถูกล็อกหลังลูกค้ายืนยันใบเสนอราคา','danger');return}draftOrder[key]=val;if(key==='jobType'&&val!=='Event'){}markDirty();render()}
function productChoiceField(value){const opts=[['Bouquet','ช่อดอกไม้'],['Arrangement','จัดแจกัน / กล่อง'],['Event Set','งาน Event'],['Service','บริการ'],['Other','อื่น ๆ']];return `<div class="choice-block"><div class="choice-label">ประเภทสินค้า</div><div class="choice-group">${opts.map(([v,t])=>`<button type="button" class="choice-btn ${value===v?'active':''}" onclick="setProductType('${v}')">${t}</button>`).join('')}</div></div>`}
function setProductType(v){collectProductFields();window._editingProduct.type=v;document.querySelectorAll('.choice-group .choice-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`setProductType('${v}')`));}
function digitsOnly(v,max=99){const map={'๐':'0','๑':'1','๒':'2','๓':'3','๔':'4','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9'};return String(v||'').split('').map(c=>map[c]??c).join('').replace(/\D/g,'').slice(0,max)}
function formatThaiPhone(v){const d=digitsOnly(v,10);if(d.length===10)return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;if(d.length===9)return `${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`;return d}
function formatPhoneEl(el){el.value=formatThaiPhone(el.value)}
function cleanTaxEl(el){el.value=digitsOnly(el.value,13)}
function moneyField(id,value,attrs=''){return `<div class="input-prefix-wrap"><span class="input-prefix">฿</span><input id="${id}" class="input" type="number" inputmode="decimal" min="0" step="0.01" value="${num(value)}" ${attrs}></div>`}
function clearFieldErrors(root=document){root.querySelectorAll('.field.has-error').forEach(x=>x.classList.remove('has-error'))}
function setFieldError(el,msg){const f=el?.closest('.field');if(!f)return;if(msg)f.querySelector('.field-error').textContent=msg;f.classList.add('has-error')}
function validateDateOrder(){clearFieldErrors(document);const d=document.querySelector('[data-order-field="date"]'),v=document.querySelector('[data-order-field="validUntil"]');if(d&&v&&d.value&&v.value&&v.value<d.value){setFieldError(v,'วันหมดอายุใบเสนอราคาต้องไม่ก่อนวันที่ออเดอร์');v.scrollIntoView({behavior:'smooth',block:'center'});return false}return true}

renderDeliveryEditor=function(o){return (o.deliveries||[]).map((d,i)=>`<div class="delivery-card"><div class="delivery-card-head"><div><div class="title">จุดส่ง ${i+1}${d.recipient?' · '+e(d.recipient):''}</div><div class="sub">${deliveryStatusLabel(d.status||'scheduled')} · สินค้าในออเดอร์สามารถผูกกับจุดส่งนี้ได้</div></div>${(o.deliveries||[]).length>1?`<button class="btn btn-danger btn-sm" type="button" onclick="removeDelivery('${d.id}')">ลบ</button>`:''}</div><div class="form-grid" style="margin-top:14px">

${field('เบอร์ผู้รับ',`<input class="input" type="tel" inputmode="tel" autocomplete="tel" value="${e(d.phone)}" placeholder="08x-xxx-xxxx" oninput="updateDelivery('${d.id}','phone',this.value)" onblur="formatPhoneEl(this);updateDelivery('${d.id}','phone',this.value)">`,2,'ใช้สำหรับคนส่งติดต่อหน้างาน')}

openProductModal=function(productId=''){if(commercialLocked()&&!productId){toast('ออเดอร์ยืนยันแล้ว ไม่สามารถเพิ่มสินค้าใหม่ใน Commercial Terms เดิม','danger');return}const existing=productId?draftOrder.products.find(p=>p.id===productId):null;const p=existing?structuredClone(existing):{id:uid(),name:'',type:'Bouquet',qty:1,unit:'ชิ้น',unitPrice:0,discountType:'amount',discountValue:0,description:'',internalNote:'',deliveryId:(draftOrder.deliveries||[])[0]?.id||'',flowers:[]};window._editingProduct=p;document.getElementById('modal').className='modal';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">PRODUCT ITEM</div><h3>${existing?'แก้ไขสินค้า':'เพิ่มสินค้าในออเดอร์'}</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body">

<div class="modal-section"><div class="section-kicker">FLOWER COMPOSITION</div><div class="section-title" style="font-size:18px">4. สูตรดอกไม้ภายใน</div><p class="sub">เลือกชนิดดอกไม้ สี จำนวน และสัดส่วนสำหรับทำงานจริง ข้อมูลส่วนนี้ไม่แสดงบนเอกสารลูกค้า</p><div id="productFlowerLines"></div><button class="btn btn-ghost" onclick="addProductFlower()">+ เพิ่มดอกไม้</button></div>
<div class="actions" style="justify-content:flex-end;margin-top:8px"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-dark" onclick="saveProductToDraft()">บันทึกสินค้า</button></div></div>`;renderProductFlowerLines();openModal();applyProductCommercialLock()}

openCustomerModal=function(quick=false,id=''){const c=id?structuredClone(state.customers.find(x=>x.id===id)):{id:uid(),type:'บุคคล',name:'',contactName:'',phone:'',email:'',taxId:'',branch:'',address:'',channel:'Instagram',tags:[],notes:''};window._editingCustomer={c,quick};document.getElementById('modal').className='modal';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">CUSTOMER</div><h3>${id?'แก้ไขลูกค้า':'เพิ่มลูกค้า'}</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="customer-type-hero"><input id="cType" type="hidden" value="${e(c.type)}"><div class="choice-label">ประเภทลูกค้า</div><div class="choice-group"><button type="button" class="choice-btn ${c.type==='บุคคล'?'active':''}" onclick="setCustomerType('บุคคล')">บุคคล</button><button type="button" class="choice-btn ${c.type==='บริษัท'?'active':''}" onclick="setCustomerType('บริษัท')">บริษัท / องค์กร</button></div></div>
<div class="modal-section"><div class="modal-section-title">ข้อมูลติดต่อหลัก</div><div class="form-grid">${field('ชื่อ / ชื่อบริษัท',`<input id="cName" class="input" value="${e(c.name)}" autocomplete="name" placeholder="${c.type==='บริษัท'?'ชื่อบริษัท':'ชื่อผู้ซื้อ'}">`,2,'ชื่อหลักที่ใช้ค้นหาใน CRM',true)}${field('ชื่อผู้ติดต่อ',`<input id="cContact" class="input" value="${e(c.contactName)}" autocomplete="name" placeholder="เช่น คุณพิม">`,2,'กรณีบริษัท ใช้ชื่อคนที่คุยงาน')}${field('โทรศัพท์',`<input id="cPhone" class="input" type="tel" inputmode="tel" autocomplete="tel" value="${e(c.phone)}" placeholder="08x-xxx-xxxx" onblur="formatPhoneEl(this)">`,2,'ใช้ติดต่อเรื่องออเดอร์')}${field('อีเมล',`<input id="cEmail" class="input" type="email" inputmode="email" autocomplete="email" value="${e(c.email)}" placeholder="name@example.com">`,2,'ไม่จำเป็นถ้าลูกค้าคุยผ่าน LINE/Instagram')}</div></div>
<div class="modal-section company-only" ${c.type==='บริษัท'?'':'hidden'}><div class="modal-section-title">ข้อมูลออกเอกสารบริษัท</div><div class="form-grid">${field('เลขผู้เสียภาษี',`<input id="cTax" class="input" inputmode="numeric" maxlength="13" value="${e(c.taxId)}" placeholder="13 หลัก" oninput="cleanTaxEl(this)">`,2,'กรอกเฉพาะเมื่อใช้เอกสารภาษี')}${field('สาขา',`<input id="cBranch" class="input" value="${e(c.branch)}" placeholder="สำนักงานใหญ่ / 00000">`,2)}</div></div>
<div class="modal-section"><div class="modal-section-title">ข้อมูลประกอบ CRM</div><div class="form-grid">${field('ที่อยู่สำหรับออกเอกสาร',`<textarea id="cAddress" class="textarea" autocomplete="street-address" placeholder="ที่อยู่ใบเสนอราคา / ใบแจ้งหนี้">${e(c.address)}</textarea>`,2,'ที่อยู่จัดส่งจริงจะอยู่ในแต่ละออเดอร์')}${field('ช่องทางที่รู้จักร้าน',`<select id="cChannel" class="select">${['Instagram','LINE','โทรศัพท์ส่วนตัว','Referral','Walk-in','อื่นๆ'].map(x=>`<option ${c.channel===x?'selected':''}>${x}</option>`).join('')}</select>`,1,'ใช้วิเคราะห์แหล่งที่มาของลูกค้า')}${field('Tags',`<input id="cTags" class="input" value="${e((c.tags||[]).join(', '))}" placeholder="Pastel, Anniversary, VIP">`,1,'คั่นด้วยเครื่องหมาย ,')}${field('โน้ต',`<textarea id="cNotes" class="textarea" placeholder="Preference หรือข้อมูลที่ช่วยดูแลลูกค้าครั้งต่อไป">${e(c.notes)}</textarea>`,4)}</div></div>
<div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-dark" onclick="saveCustomer()">บันทึกลูกค้า</button></div></div>`;openModal()}
function setCustomerType(type){window._editingCustomer.c.type=type;const ct=document.getElementById('cType');if(ct)ct.value=type;document.querySelectorAll('.customer-type-hero .choice-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&type==='บุคคล')||(i===1&&type==='บริษัท')));document.querySelectorAll('.company-only').forEach(x=>x.hidden=type!=='บริษัท');const n=document.getElementById('cName');if(n)n.placeholder=type==='บริษัท'?'ชื่อบริษัท':'ชื่อผู้ซื้อ'}
const _v14SaveCustomer=saveCustomer;
saveCustomer=function(){clearFieldErrors(document);const name=document.getElementById('cName'),email=document.getElementById('cEmail'),tax=document.getElementById('cTax'),phone=document.getElementById('cPhone');if(!name?.value.trim()){setFieldError(name,'กรุณาใส่ชื่อลูกค้า');name?.focus();return}if(email?.value&&!email.checkValidity()){setFieldError(email,'รูปแบบอีเมลไม่ถูกต้อง');email.focus();return}if(tax?.value&&digitsOnly(tax.value).length!==13){setFieldError(tax,'เลขผู้เสียภาษีควรมี 13 หลัก');tax.focus();return}if(phone)phone.value=formatThaiPhone(phone.value);if(tax)tax.value=digitsOnly(tax.value,13);window._editingCustomer.c.type=window._editingCustomer.c.type||'บุคคล';return _v14SaveCustomer()}

openPaymentModal=function(){if(!['confirmed','active','completed'].includes(draftOrder.status)){toast('ต้องยืนยันออเดอร์ก่อนบันทึกการชำระเงิน','danger');return}const outstanding=Math.max(0,orderTotal(draftOrder).total-paid(draftOrder));if(outstanding<=0){toast('ออเดอร์นี้รับชำระครบแล้ว','success');return}document.getElementById('modal').className='modal small';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">PAYMENT</div><h3>บันทึกการชำระเงิน</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="guard-note"><b>ยอดคงเหลือ ฿${money(outstanding)}</b> · ระบบจะไม่ให้รับเกินยอด</div><div class="quick-amounts"><button type="button" class="quick-amount" onclick="setPayAmount(${(outstanding*.25).toFixed(2)})">25%</button><button type="button" class="quick-amount" onclick="setPayAmount(${(outstanding*.5).toFixed(2)})">50%</button><button type="button" class="quick-amount" onclick="setPayAmount(${outstanding.toFixed(2)})">เต็มยอด</button></div><div class="form-grid" style="margin-top:14px">${field('จำนวนเงิน',`<div class="input-prefix-wrap"><span class="input-prefix">฿</span><input id="payAmount" type="number" inputmode="decimal" min="0.01" max="${outstanding}" step="0.01" class="input" value="${outstanding.toFixed(2)}"></div>`,2,'เลือก 25% / 50% / เต็มยอดด้านบนได้',true)}${field('วันที่รับเงิน',`<input id="payDate" type="date" class="input" value="${today()}">`,2)}<div class="choice-block"><div class="choice-label">ช่องทางชำระ</div><div class="choice-group payment-methods">${['โอนเงิน','เงินสด','บัตร','อื่นๆ'].map((m,i)=>`<button type="button" class="choice-btn ${i===0?'active':''}" onclick="setPaymentMethod('${m}',this)">${m}</button>`).join('')}</div><input id="payMethod" type="hidden" value="โอนเงิน"></div>${field('เลขอ้างอิง / หมายเหตุ',`<input id="payRef" class="input" placeholder="เช่น Slip 123456 / มัดจำงวดแรก">`,4,'ใส่เลขอ้างอิงเมื่อมี เพื่อย้อนตรวจรายการได้ง่าย')}</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-dark" onclick="savePayment()">บันทึกการชำระเงิน</button></div></div>`;openModal()}
function setPayAmount(v){const el=document.getElementById('payAmount');if(el){el.value=Number(v).toFixed(2);el.focus()}}
function setPaymentMethod(v,btn){document.getElementById('payMethod').value=v;btn.parentElement.querySelectorAll('.choice-btn').forEach(x=>x.classList.toggle('active',x===btn))}

openFlowerModal=function(id=''){const f=id?structuredClone(state.flowers.find(x=>x.id===id)):{id:uid(),name:'',unit:'ดอก',note:''};window._editingFlower=f;document.getElementById('modal').className='modal small';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">FLOWER MASTER</div><h3>${id?'แก้ไขดอกไม้':'เพิ่มดอกไม้'}</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-grid">${field('ชื่อดอกไม้',`<input id="fName" class="input" value="${e(f.name)}" placeholder="เช่น Hydrangea">`,2,'ใช้ชื่อที่ทีมค้นหาได้ง่าย',true)}${field('หน่วยมาตรฐาน',`<input id="fUnit" class="input" list="flowerUnitOptions" value="${e(f.unit)}" placeholder="ดอก"><datalist id="flowerUnitOptions"><option value="ดอก"><option value="ก้าน"><option value="ใบ"><option value="กำ"><option value="ช่อ"></datalist>`,2,'หน่วยที่ใช้ตอนระบุสูตรดอกไม้')}${field('หมายเหตุ',`<textarea id="fNote" class="textarea" placeholder="เช่น ดอกฟอร์มใหญ่ ใช้สร้าง Volume">${e(f.note)}</textarea>`,4)}</div><div class="guard-note" style="margin-top:14px">สีไม่เก็บใน Flower Master เพราะสีเป็นข้อมูลของสินค้าในออเดอร์จริง</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-dark" onclick="saveFlower()">บันทึก</button></div></div>`;openModal()}

te</button></div></div>`;openModal()}
function setTemplateType(v,btn){document.getElementById('tType').value=v;window._editingTemplate.type=v;btn.parentElement.querySelectorAll('.choice-btn').forEach(x=>x.classList.toggle('active',x===btn))}

renderSettings=function(){const s=state.settings;return `<div class="page-head"><div><h2>ตั้งค่า</h2><p>ตั้งค่าข้อมูลร้าน เอกสาร ภาษี และการรับชำระ โดยแยกตามงานที่ใช้จริง</p></div><div class="actions"><button class="btn btn-dark" onclick="saveSettings()">บันทึกการตั้งค่า</button></div></div><div class="settings-grid"><div class="card settings-card"><h3>ข้อมูลร้าน / ผู้ออกเอกสาร</h3><div class="form-grid">${field('ชื่อร้าน',`<input id="sCompany" class="input" value="${e(s.company)}" autocomplete="organization">`,2,'ชื่อแบรนด์ที่แสดงบนเอกสาร')}${field('ชื่อทางกฎหมาย',`<input id="sLegal" class="input" value="${e(s.legalName)}" autocomplete="organization">`,2,'ใช้กรณีชื่อจดทะเบียนต่างจากชื่อร้าน')}${field('เลขผู้เสียภาษี',`<input id="sTaxId" class="input" inputmode="numeric" maxlength="13" value="${e(s.taxId)}" placeholder="13 หลัก" oninput="cleanTaxEl(this)">`,2)}${field('สาขา',`<input id="sBranch" class="input" value="${e(s.branch)}" placeholder="สำนักงานใหญ่">`,2)}${field('โทรศัพท์',`<input id="sPhone" type="tel" inputmode="tel" autocomplete="tel" class="input" value="${e(s.phone)}" placeholder="08x-xxx-xxxx" onblur="formatPhoneEl(this)">`,2)}${field('อีเมล',`<input id="sEmail" type="email" inputmode="email" autocomplete="email" class="input" value="${e(s.email)}" placeholder="hello@example.com">`,2)}${field('Instagram',`<input id="sIg" class="input" value="${e(s.instagram)}" placeholder="@account">`,2)}${field('LINE',`<input id="sLine" class="input" value="${e(s.line)}" placeholder="@lineid">`,2)}${field('ที่อยู่',`<textarea id="sAddress" class="textarea" autocomplete="street-address">${e(s.address)}</textarea>`,4,'ที่อยู่ที่ใช้บนเอกสาร')}</div></div>
<div class="card settings-card"><h3>เอกสารและภาษี</h3><label class="checkbox-setting"><input id="sVatSwitch" type="checkbox" class="setting-checkbox ${s.vatEnabled?'on':''}" ${s.vatEnabled?'checked':''} onchange="this.classList.toggle('on',this.checked)"><span class="checkbox-mark" aria-hidden="true"></span><span><b>เปิด VAT เป็นค่าเริ่มต้น</b><span class="sub">ออเดอร์ใหม่จะเริ่มด้วยค่านี้ แต่ยังแก้รายออเดอร์ได้ก่อน Confirm</span></span></label><div class="form-grid" style="margin-top:14px">${field('VAT',`<div class="input-suffix-wrap"><input id="sVatRate" type="number" inputmode="decimal" min="0" max="100" step="0.01" class="input" value="${num(s.vatRate)}"><span class="input-suffix">%</span></div>`)}${field('อายุใบเสนอราคา',`<div class="input-suffix-wrap"><input id="sValid" type="number" inputmode="numeric" min="1" max="365" step="1" class="input" value="${num(s.quoteValidDays)}"><span class="input-suffix">วัน</span></div>`)}${field('Prefix ใบเสนอราคา',`<input id="sQ" class="input" maxlength="8" value="${e(s.quotePrefix)}" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9_-]/g,'')">`)}${field('Prefix Invoice',`<input id="sI" class="input" maxlength="8" value="${e(s.invoicePrefix)}" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9_-]/g,'')">`)}${field('Prefix ใบส่งของ',`<input id="sD" class="input" maxlength="8" value="${e(s.deliveryPrefix)}" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9_-]/g,'')">`)}${field('Prefix Receipt',`<input id="sR" class="input" maxlength="8" value="${e(s.receiptPrefix)}" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9_-]/g,'')">`)}${field('Prefix Tax Invoice',`<input id="sT" class="input" maxlength="8" value="${e(s.taxPrefix)}" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9_-]/g,'')">`)}${field('เงื่อนไขใบเสนอราคา',`<textarea id="sTerms" class="textarea">${e(s.terms)}</textarea>`,4,'เขียนเป็นข้อความสั้น ชัด และใช้กับออเดอร์ใหม่')}</div></div>
<div class="card settings-card"><h3>ข้อมูลรับชำระ</h3><div class="form-grid">${field('ธนาคาร',`<input id="sBank" class="input" value="${e(s.bankName)}" placeholder="ชื่อธนาคาร">`,2)}${field('ชื่อบัญชี',`<input id="sBankAcc" class="input" value="${e(s.bankAccount)}" placeholder="ชื่อบัญชี">`,2)}${field('เลขบัญชี',`<input id="sBankNo" class="input" inputmode="numeric" value="${e(s.bankNo)}" placeholder="เลขบัญชี" oninput="this.value=this.value.replace(/[^0-9-]/g,'')">`,4,'จะแสดงในเอกสารเมื่อกรอกข้อมูลครบ')}</div></div>
<div class="card settings-card"><h3>สำรอง / ย้ายข้อมูล</h3><p class="sub">Standalone นี้เก็บข้อมูลใน Browser เครื่องนี้ ควร Export Backup เป็นระยะ</p><div class="actions"><button class="btn btn-dark" onclick="exportBackup()">Export Backup (.json)</button><label class="btn btn-outline">Import Backup<input type="file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])"></label></div><div style="margin-top:18px"><button class="btn btn-danger btn-sm" onclick="resetData()">ล้างข้อมูลทั้งหมด</button></div></div></div>`}

const _v14SaveSettings=saveSettings;
saveSettings=function(){clearFieldErrors(document);const tax=document.getElementById('sTaxId'),email=document.getElementById('sEmail'),phone=document.getElementById('sPhone');if(tax?.value&&digitsOnly(tax.value).length!==13){setFieldError(tax,'เลขผู้เสียภาษีควรมี 13 หลัก');tax.focus();return}if(email?.value&&!email.checkValidity()){setFieldError(email,'รูปแบบอีเมลไม่ถูกต้อง');email.focus();return}if(phone)phone.value=formatThaiPhone(phone.value);if(tax)tax.value=digitsOnly(tax.value,13);return _v14SaveSettings()}

const _v14SaveOrder=saveOrderDraft;
saveOrderDraft=function(){if(!validateDateOrder())return false;return _v14SaveOrder()}

const _v14ApplyCommercialLock=applyCommercialLock;
applyCommercialLock=function(){
  _v14ApplyCommercialLock();
  if(currentView!=='orderEdit'||!commercialLocked())return;
  document.querySelectorAll('button[onclick^=\"setOrderChoice(\"]').forEach(b=>{b.disabled=true;b.title='ข้อมูลการค้าถูกล็อกตามใบเสนอราคาที่ลูกค้ายืนยัน'});
};

applyProductCommercialLock=function(){
  if(!commercialLocked())return;
  ['pName','pQty','pUnit','pPrice','pDiscount','pDiscountType','pDesc'].forEach(id=>{const el=document.getElementById(id);if(el){el.disabled=true;el.title='ข้อมูลการค้าถูกล็อกหลังลูกค้ายืนยันใบเสนอราคา'}});
  document.querySelectorAll('#modal .choice-group .choice-btn[onclick^=\"setProductType\"]')?.forEach(b=>{b.disabled=true;b.title='ประเภทสินค้าถูกล็อกตามใบเสนอราคาที่ลูกค้ายืนยัน'});
  const body=document.querySelector('#modal .modal-body');if(body&&!body.querySelector('.commercial-lock-note'))body.insertAdjacentHTML('afterbegin','<div class=\"guard-note commercial-lock-note\"><b>Commercial Terms ถูกล็อกแล้ว</b><br>ยังแก้จุดส่ง โน้ตภายใน และสูตรดอกไม้สำหรับผลิตจริงได้</div>')
}

const _v14Render=render;
render=function(){_v14Render();const chip=document.querySelector('.top-right .chip');if(chip)chip.textContent='RC v1.4 · Form UX';if(currentView==='orderEdit')setTimeout(()=>applyCommercialLock(),0)}

render();

<script>
/* ===== RC v1.5 INPUT UX ===== */
labelHtml=function(label,required=false){return `${e(label)}${required?'<span class="req" aria-label="จำเป็น"></span>':''}`}
field=function(label,html,span=1,hint='',required=false,error=''){return `<div class="field ${span===2?'span2':span===3?'span3':span===4?'full':''}"><label>${labelHtml(label,required)}</label>${html}${hint?`<div class="field-hint">${e(hint)}</div>`:''}<div class="field-error">${e(error||'กรุณาตรวจสอบข้อมูล')}</div></div>`}
choiceField=function(label,key,value,options,hint='',required=false,segmented=false){return `<div class="choice-block"><div class="choice-label">${labelHtml(label,required)}</div><div class="choice-group ${segmented?'segmented':''}" role="group" aria-label="${e(label)}">${options.map(o=>{const v=typeof o==='string'?o:o[0],t=typeof o==='string'?o:o[1];return `<button type="button" class="choice-btn ${value===v?'active':''}" onclick="setOrderChoice('${key}','${e(v)}',this)">${e(t)}</button>`}).join('')}</div>${hint?`<div class="choice-hint">${e(hint)}</div>`:''}</div>`}
setOrderChoice=function(key,val,btn){if(!draftOrder)return;if(commercialLocked()){toast('ข้อมูลการค้าถูกล็อกหลังลูกค้ายืนยันใบเสนอราคา','danger');return}draftOrder[key]=val;markDirty();if(btn){btn.parentElement.querySelectorAll('.choice-btn').forEach(x=>x.classList.toggle('active',x===btn))}if(key==='jobType'){const area=document.getElementById('eventCostArea');if(area)area.innerHTML=val==='Event'?renderEventCostPanel(draftOrder):''}}
function renderEventCostPanel(o){return `<div class="advanced-panel" style="margin-top:12px"><div class="advanced-body"><div class="section-title" style="font-size:16px">ต้นทุนพิเศษงาน Event</div><div class="section-lead">ใช้สำหรับต้นทุนเฉพาะงาน เช่น Staff / Venue / Transport</div><div id="eventCosts">${renderEventCosts(o)}</div><button class="btn btn-ghost btn-sm" onclick="addEventCost()">+ เพิ่มต้นทุน</button></div></div>`}
function renderCustomerPicker(o){const c=state.customers.find(x=>x.id===o.customerId);return `<div class="customer-select"><button type="button" class="customer-picker-btn" onclick="openOrderCustomerPicker()"><span class="customer-picker-main">${c?`<b>${e(c.name)}</b><small>${e(c.phone||c.email||c.type||'ลูกค้า')}</small>`:`<b class="customer-picker-empty">ค้นหาหรือเลือกลูกค้า</b><small>ค้นจากชื่อ เบอร์ หรืออีเมล</small>`}</span><span>⌄</span></button><button type="button" class="btn btn-outline" onclick="openCustomerModal(true)">+ ลูกค้าใหม่</button><input type="hidden" data-order-field="customerId" value="${e(o.customerId)}"></div>`}
function openOrderCustomerPicker(){document.getElementById('modal').className='modal small';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">CUSTOMER PICKER</div><h3>เลือกลูกค้า</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><input id="customerSearchV15" class="input" placeholder="ค้นหาชื่อ เบอร์โทร หรืออีเมล…" autocomplete="off" oninput="filterOrderCustomers(this.value)"><div id="customerPickerList" class="picker-list"></div><div class="actions" style="margin-top:12px"><button class="btn btn-outline" onclick="closeModal();openCustomerModal(true)">+ เพิ่มลูกค้าใหม่</button></div></div>`;openModal();filterOrderCustomers('');setTimeout(()=>document.getElementById('customerSearchV15')?.focus(),50)}
function filterOrderCustomers(q){const box=document.getElementById('customerPickerList');if(!box)return;const s=String(q||'').trim().toLowerCase();const rows=state.customers.filter(c=>(c.name+' '+(c.contactName||'')+' '+(c.phone||'')+' '+(c.email||'')).toLowerCase().includes(s)).slice(0,50);box.innerHTML=rows.map(c=>`<button class="picker-item" onclick="selectOrderCustomer('${c.id}')"><span><b>${e(c.name)}</b><small>${e(c.phone||'-')}${c.email?' · '+e(c.email):''}</small></span><span class="badge">${e(c.type||'ลูกค้า')}</span></button>`).join('')||'<div class="empty">ไม่พบลูกค้า</div>'}
function selectOrderCustomer(id){if(commercialLocked()){toast('ลูกค้าถูกล็อกตามใบเสนอราคาที่อนุมัติแล้ว','danger');return}draftOrder.customerId=id;markDirty();closeModal();render();toast('เลือกลูกค้าแล้ว · จุดส่งจะไม่ถูกแก้อัตโนมัติ','success')}
function setOrderVat(v){if(commercialLocked()){toast('VAT ถูกล็อกตามใบเสนอราคาที่อนุมัติแล้ว','danger');return}draftOrder.vatEnabled=!!v;markDirty();render()}
renderOrderEditor=function(){const o=draftOrder;if(!o)return'';refreshOrderStatus(o,false);const jobOpts=[['Bouquet','ช่อดอกไม้'],['Arrangement','จัดแจกัน / กระเช้า'],['Event','งาน Event'],['Other','อื่น ๆ']],srcOpts=[['Instagram','Instagram'],['LINE','LINE'],['โทรศัพท์ส่วนตัว','โทรศัพท์'],['Referral','แนะนำต่อ'],['Walk-in','Walk-in'],['อื่นๆ','อื่น ๆ']];const hasExtra=!!(num(o.orderDiscount)||o.vatEnabled||o.note||o.internalNote);return `<div class="page-head order-edit-head"><div><h2>${editingOrderId?'แก้ไขออเดอร์':'สร้างออเดอร์ใหม่'}</h2><p>${e(o.orderNo)} · กรอกเฉพาะข้อมูลที่รู้ตอนนี้ ที่เหลือเติมภายหลังได้</p></div><div class="actions"><button class="btn btn-ghost" onclick="go('orders')">กลับ</button><button class="btn btn-dark" onclick="saveOrderDraft()">บันทึก</button></div></div>${editingOrderId?renderWorkflowCard(o):''}<div class="order-summary"><div class="form-shell">
<div class="form-section"><div class="section-kicker">01 / ESSENTIALS</div><div class="section-title">รับออเดอร์</div><div class="section-lead">เริ่มจากผู้ซื้อ งานที่ต้องการ และช่องทางที่คุยกัน — ส่วนเอกสาร/ภาษีไม่ต้องแตะถ้ายังไม่จำเป็น</div><p class="form-note"><span class="req"></span> ช่องจำเป็น</p><div class="core-form-grid"><div class="field full"><label>${labelHtml('ลูกค้า',true)}</label>${renderCustomerPicker(o)}<div class="field-hint">ผู้ซื้อหลักของออเดอร์ ผู้รับดอกไม้กำหนดแยกด้านล่าง</div><div class="field-error">กรุณาเลือกลูกค้า</div></div>${field('ชื่องาน / Occasion',`<input class="input" data-order-field="title" value="${e(o.title)}" placeholder="เช่น Anniversary · Birthday Mom" oninput="syncOrderFields()" autocomplete="off">`,4,'ตั้งชื่อสั้น ๆ ให้กลับมาเห็นแล้วรู้ทันทีว่างานไหน')}${choiceField('ประเภทงาน','jobType',o.jobType,jobOpts,'',true,true)}${choiceField('ช่องทางรับออเดอร์','source',o.source,srcOpts,'',false,true)}</div>
<details class="advanced-panel" ${hasExtra?'open':''}><summary><span>เอกสาร ราคา และหมายเหตุ</span><span class="advanced-summary-meta">ไม่จำเป็นต้องกรอกตอนเปิดออเดอร์</span></summary><div class="advanced-body"><div class="form-grid">${field('วันที่รับออเดอร์',`<input type="date" class="input" data-order-field="date" value="${e(o.date)}" onchange="syncOrderFields()">`,1)}${field('ใบเสนอราคาใช้ได้ถึง',`<input type="date" class="input" data-order-field="validUntil" value="${e(o.validUntil)}" onchange="syncOrderFields()">`,1,'ตั้งอัตโนมัติจาก Settings')}${field('ส่วนลดท้ายบิล',`<div class="input-prefix-wrap"><span class="input-prefix">฿</span><input type="number" inputmode="decimal" step="0.01" min="0" class="input" data-order-field="orderDiscount" value="${num(o.orderDiscount)}" oninput="syncOrderFields()"></div>`)}<div class="choice-block"><div class="choice-label">VAT</div><div class="choice-group segmented"><button type="button" class="choice-btn ${!o.vatEnabled?'active':''}" onclick="setOrderVat(false)">ไม่คิด VAT</button><button type="button" class="choice-btn ${o.vatEnabled?'active':''}" onclick="setOrderVat(true)">คิด VAT</button></div></div>${o.vatEnabled?field('อัตรา VAT',`<div class="input-suffix-wrap"><input type="number" inputmode="decimal" step="0.01" min="0" max="100" class="input" data-order-field="vatRate" value="${num(o.vatRate)}" oninput="syncOrderFields()"><span class="input-suffix">%</span></div>`):''}${field('หมายเหตุสำหรับลูกค้า',`<textarea class="textarea" data-order-field="note" placeholder="ข้อความที่อาจแสดงในเอกสารลูกค้า" oninput="syncOrderFields()">${e(o.note)}</textarea>`,2)}${field('โน้ตภายในร้าน',`<textarea class="textarea" data-order-field="internalNote" placeholder="ข้อมูลภายใน ไม่แสดงให้ลูกค้า" oninput="syncOrderFields()">${e(o.internalNote)}</textarea>`,2)}</div><div id="eventCostArea">${o.jobType==='Event'?renderEventCostPanel(o):''}</div></div></details></div>
<div class="form-section"><div class="section-kicker">02 / PRODUCTS</div><div class="section-title">สินค้า</div><div class="section-lead">เพิ่มรายการที่ลูกค้าซื้อก่อน สูตรดอกไม้เติมทีหลังได้จนกว่าจะเริ่มผลิต</div><div class="product-stack">${renderDraftProducts(o)}</div><div style="margin-top:12px"><button class="btn btn-primary" onclick="openProductModal()">+ เพิ่มสินค้า</button></div></div>
<div class="form-section"><div class="section-kicker">03 / DELIVERY</div><div class="section-title">ผู้รับและการจัดส่ง</div><div class="section-lead">กรอกเฉพาะข้อมูลสำหรับส่งจริง และใช้ปุ่มคัดลอกชื่อ/เบอร์ผู้ซื้อเมื่อผู้ซื้อเป็นผู้รับเอง</div><div id="deliveryEditor">${renderDeliveryEditor(o)}</div><button class="btn btn-ghost btn-sm" type="button" onclick="addDelivery()">+ เพิ่มจุดส่ง</button></div>
${editingOrderId?`<div class="form-section"><div class="section-kicker">04 / MONEY & DOCUMENTS</div><div class="section-title">การชำระเงินและเอกสาร</div>${renderPaymentSection(o)}</div>`:''}
</div><div id="orderSummary">${renderOrderSummary(o)}</div></div>`}

renderDeliveryEditor=function(o){return (o.deliveries||[]).map((d,i)=>`<div class="delivery-card"><div class="delivery-card-head"><div><div class="title">จุดส่ง ${i+1}${d.recipient?' · '+e(d.recipient):''}</div><div class="sub">${deliveryStatusLabel(d.status||'scheduled')}</div></div>${(o.deliveries||[]).length>1?`<button class="btn btn-danger btn-sm" type="button" onclick="removeDelivery('${d.id}')">ลบ</button>`:''}</div><div class="delivery-tools"><button type="button" class="micro-action" onclick="copyBuyerContactToDelivery('${d.id}')">ใช้ชื่อ/เบอร์ผู้ซื้อ</button><button type="button" class="micro-action" onclick="setDeliveryDateQuick('${d.id}',0)">ส่งวันนี้</button><button type="button" class="micro-action" onclick="setDeliveryDateQuick('${d.id}',1)">ส่งพรุ่งนี้</button></div><div class="delivery-main-grid">${field('ชื่อผู้รับ',`<input class="input" value="${e(d.recipient)}" placeholder="ชื่อผู้รับ" autocomplete="name" oninput="updateDelivery('${d.id}','recipient',this.value)">`,1,'')}${field('เบอร์ผู้รับ',`<input class="input" type="tel" inputmode="tel" value="${e(d.phone)}" placeholder="08x-xxx-xxxx" oninput="updateDelivery('${d.id}','phone',this.value)" onblur="this.value=formatThaiPhone(this.value);updateDelivery('${d.id}','phone',this.value)">`)}<div class="field address"><label>ที่อยู่จัดส่ง</label><textarea class="textarea" placeholder="บ้านเลขที่ / อาคาร / ชั้น / จุดสังเกต" oninput="updateDelivery('${d.id}','address',this.value)">${e(d.address)}</textarea><div class="field-hint">เก็บเป็นที่อยู่ของออเดอร์นี้ ไม่เปลี่ยนข้อมูล CRM</div><div class="field-error">กรุณาตรวจสอบข้อมูล</div></div><div class="delivery-schedule-v15">${field('วันที่ส่ง',`<input id="delDate-${d.id}" class="input" type="date" value="${e(d.date)}" onchange="updateDelivery('${d.id}','date',this.value)">`)}${field('เวลา',`<input class="input" type="time" step="900" value="${e(d.time)}" onchange="updateDelivery('${d.id}','time',this.value)">`)}${field('ค่าส่ง',`<div class="input-prefix-wrap"><span class="input-prefix">฿</span><input class="input" type="number" inputmode="decimal" min="0" step="0.01" value="${num(d.fee)}" oninput="updateDelivery('${d.id}','fee',this.value)"></div>`)}</div></div>${editingOrderId?`<div style="margin-top:12px"><div class="choice-label">สถานะการจัดส่ง</div><div class="choice-group segmented">${[['scheduled','รอส่ง'],['dispatched','กำลังส่ง'],['delivered','ส่งแล้ว'],['rescheduled','เลื่อน']].map(([s,t])=>`<button class="choice-btn ${(d.status||'scheduled')===s?'active':''}" type="button" onclick="setDeliveryStatus('${d.id}','${s}')">${t}</button>`).join('')}</div></div>`:''}</div>`).join('')}
function copyBuyerContactToDelivery(id){const d=draftOrder.deliveries.find(x=>x.id===id),c=state.customers.find(x=>x.id===draftOrder.customerId);if(!d){return}if(!c){toast('กรุณาเลือกลูกค้าก่อน','danger');return}d.recipient=c.contactName||c.name||'';d.phone=c.phone||'';d.autoFromCustomer=true;markDirty();const box=document.getElementById('deliveryEditor');if(box)box.innerHTML=renderDeliveryEditor(draftOrder)}
function setDeliveryDateQuick(id,days){const d=draftOrder.deliveries.find(x=>x.id===id);if(!d)return;d.date=addDays(today(),days);d.autoFromCustomer=false;markDirty();const el=document.getElementById('delDate-'+id);if(el)el.value=d.date}

productChoiceField=function(value){const opts=[['Bouquet','ช่อดอกไม้'],['Arrangement','จัดแจกัน / กล่อง'],['Event Set','Event'],['Service','บริการ'],['Other','อื่น ๆ']];return `<div class="choice-block"><div class="choice-label">ประเภทสินค้า</div><div class="choice-group segmented product-type-group">${opts.map(([v,t])=>`<button type="button" class="choice-btn ${value===v?'active':''}" onclick="setProductType('${v}',this)">${t}</button>`).join('')}</div><input id="pType" type="hidden" value="${e(value)}"></div>`}
setProductType=function(v,btn){collectProductFields();window._editingProduct.type=v;const hidden=document.getElementById('pType');if(hidden)hidden.value=v;if(btn)btn.parentElement.querySelectorAll('.choice-btn').forEach(x=>x.classList.toggle('active',x===btn))}
openProductModal=function(productId=''){if(commercialLocked()&&!productId){toast('ออเดอร์ยืนยันแล้ว ไม่สามารถเพิ่มสินค้าใหม่ใน Commercial Terms เดิม','danger');return}const existing=productId?draftOrder.products.find(p=>p.id===productId):null;const p=existing?structuredClone(existing):{id:uid(),name:'',type:'Bouquet',qty:1,unit:'ชิ้น',unitPrice:0,discountType:'amount',discountValue:0,description:'',internalNote:'',deliveryId:(draftOrder.deliveries||[])[0]?.id||'',flowers:[]};window._editingProduct=p;const floral=['Bouquet','Arrangement','Event Set'].includes(p.type),multi=(draftOrder.deliveries||[]).length>1;document.getElementById('modal').className='modal';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">PRODUCT ITEM</div><h3>${existing?'แก้ไขสินค้า':'เพิ่มสินค้า'}</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><p class="form-note"><span class="req"></span> ช่องจำเป็น · สูตรดอกไม้เติมภายหลังได้ก่อนเริ่มผลิต</p><div class="modal-section"><div class="product-essential">${field('ชื่อสินค้า',`<input id="pName" class="input" value="${e(p.name)}" placeholder="เช่น Signature Pastel Bouquet" autocomplete="off">`,1,'ชื่อที่ลูกค้าเห็นในเอกสาร',true)}${field('ราคา / หน่วย',`<div class="input-prefix-wrap"><span class="input-prefix">฿</span><input id="pPrice" class="input" type="number" inputmode="decimal" min="0" step="0.01" value="${existing||num(p.unitPrice)?num(p.unitPrice):''}"></div>`,1,'',true)}</div><div style="margin-top:14px">${productChoiceField(p.type)}</div><div class="product-money" style="margin-top:14px">${field('จำนวน',`<input id="pQty" class="input" type="number" inputmode="decimal" min="0.01" step="1" value="${num(p.qty||1)}">`,1,'',true)}${multi?field('ส่งไปที่',`<select id="pDelivery" class="select"><option value="">ยังไม่ระบุ</option>${(draftOrder.deliveries||[]).map((d,i)=>`<option value="${d.id}" ${p.deliveryId===d.id?'selected':''}>จุดส่ง ${i+1}${d.recipient?' · '+e(d.recipient):''}</option>`).join('')}</select>`):`<input id="pDelivery" type="hidden" value="${e(p.deliveryId||(draftOrder.deliveries||[])[0]?.id||'')}">`}</div></div>
<details class="advanced-panel"><summary><span>รายละเอียดสินค้าเพิ่มเติม</span><span class="advanced-summary-meta">ส่วนลด · หน่วย · คำอธิบาย</span></summary><div class="advanced-body"><div class="form-grid">${field('หน่วย',`<input id="pUnit" class="input" value="${e(p.unit||'ชิ้น')}" list="productUnits"><datalist id="productUnits"><option value="ชิ้น"><option value="ชุด"><option value="งาน"><option value="ช่อ"></datalist>`)}${field('ส่วนลด',`<div class="input-prefix-wrap"><span class="input-prefix">${p.discountType==='percent'?'%':'฿'}</span><input id="pDiscount" class="input" type="number" inputmode="decimal" min="0" step="0.01" value="${num(p.discountValue)}"></div>`)}${field('รูปแบบส่วนลด',`<select id="pDiscountType" class="select"><option value="amount" ${p.discountType==='amount'?'selected':''}>จำนวนเงิน</option><option value="percent" ${p.discountType==='percent'?'selected':''}>เปอร์เซ็นต์</option></select>`)}${field('คำอธิบายสำหรับลูกค้า',`<textarea id="pDesc" class="textarea" placeholder="สี ขนาด หรือรายละเอียดที่ลูกค้าควรรู้">${e(p.description)}</textarea>`,2)}${field('โน้ตภายใน',`<textarea id="pInternal" class="textarea" placeholder="รายละเอียดสำหรับทีมจัดดอกไม้">${e(p.internalNote)}</textarea>`,2)}</div></div></details>
<details class="advanced-panel composition-panel" ${(p.flowers||[]).length?'open':''}><summary><span>สูตรดอกไม้ภายใน</span><span class="composition-status ${(p.flowers||[]).length?'ready':''}">${(p.flowers||[]).length?`${p.flowers.length} รายการ`:'เติมก่อนเริ่มผลิต'}</span></summary><div class="advanced-body"><p class="sub">สูตรนี้ไม่แสดงในเอกสารลูกค้า สามารถบันทึกสินค้าก่อนได้แล้วกลับมาเติมภายหลัง</p><div id="productFlowerLines"></div><button class="btn btn-ghost" onclick="addProductFlower()">+ เพิ่มดอกไม้</button></div></details><div class="modal-foot-sticky"><div class="actions" style="justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-dark" onclick="saveProductToDraft()">บันทึกสินค้า</button></div></div></div>`;renderProductFlowerLines();openModal();applyProductCommercialLock()}
saveProductToDraft=function(){clearFieldErrors(document);collectProductFields();const p=window._editingProduct;const name=document.getElementById('pName'),qty=document.getElementById('pQty');if(!p.name.trim()){setFieldError(name,'กรุณาใส่ชื่อสินค้า');name?.focus();return}if(num(p.qty)<=0){setFieldError(qty,'จำนวนต้องมากกว่า 0');qty?.focus();return}const noColor=(p.flowers||[]).find(f=>!f.color);if(noColor){toast('ดอกไม้ที่เพิ่มในสูตรต้องเลือกสีให้ครบ','danger');return}const ratio=(p.flowers||[]).reduce((s,f)=>s+num(f.ratio),0);if((p.flowers||[]).length&&ratio&&Math.abs(ratio-100)>1)toast(`สัดส่วนรวม ${ratio}% · บันทึกได้ แต่ควรปรับก่อนเริ่มผลิต`);const idx=draftOrder.products.findIndex(x=>x.id===p.id);if(idx>=0)draftOrder.products[idx]=structuredClone(p);else draftOrder.products.push(structuredClone(p));markDirty();closeModal();render()}
function productionCompositionIssues(o){const issues=[];(o.products||[]).forEach(p=>{if(['Bouquet','Arrangement','Event Set'].includes(p.type)){if(!(p.flowers||[]).length)issues.push(`${p.name||'สินค้า'} ยังไม่มีสูตรดอกไม้`);else if((p.flowers||[]).some(f=>!f.color||num(f.qty)<=0))issues.push(`${p.name||'สินค้า'} มีสูตรดอกไม้ไม่ครบ`)}});return issues}
const _v15PrevSetProductionStatus=setProductionStatus;setProductionStatus=function(s){if(s==='in_production'){const issues=productionCompositionIssues(draftOrder);if(issues.length){toast(issues[0]+' · เติมสูตรก่อนเริ่มผลิต','danger');return}}return _v15PrevSetProductionStatus(s)}

<script id="emily-design-v2-marker">
(function(){
  let enhanceSeq=0;
  function enhanceSemantics(root=document){
    const chip=document.querySelector('.top-right .chip');
    if(chip) chip.textContent='V3.1 · Cloud';
    // Keep parent navigation context while editing an order.
    const navButtons=[...document.querySelectorAll('.nav-btn')];
    if(typeof currentView!=='undefined' && currentView==='orderEdit'){
      navButtons.forEach(b=>b.classList.toggle('active',(b.getAttribute('onclick')||'').includes("go('orders')")));
    }
    navButtons.forEach(b=>{
      if(b.classList.contains('active')) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
    const tabs=document.querySelector('.order-tabs');
    if(tabs){tabs.setAttribute('role','tablist'); tabs.querySelectorAll('.order-tab').forEach(b=>{b.setAttribute('role','tab');b.setAttribute('aria-selected',b.classList.contains('active')?'true':'false')})}
    root.querySelectorAll?.('.choice-btn').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('active')?'true':'false'));
    root.querySelectorAll?.('.customer-picker-btn').forEach(b=>b.setAttribute('aria-haspopup','dialog'));
    // Associate persistent labels, hints and errors with controls.
    root.querySelectorAll?.('.field').forEach((f,i)=>{
      const c=f.querySelector('input:not([type="hidden"]),select,textarea');
      const lab=f.querySelector(':scope > label');
      if(!c)return;
      if(!c.id)c.id='mmd-field-'+(++enhanceSeq);
      if(lab)lab.setAttribute('for',c.id);
      const ids=[];
      const hint=f.querySelector('.field-hint');
      const err=f.querySelector('.field-error');
      if(hint){if(!hint.id)hint.id=c.id+'-hint';ids.push(hint.id)}
      if(err){if(!err.id)err.id=c.id+'-error';ids.push(err.id)}
      if(ids.length)c.setAttribute('aria-describedby',ids.join(' '));
      c.setAttribute('aria-invalid',f.classList.contains('has-error')?'true':'false');
    });
    const toast=document.getElementById('toast');if(toast){toast.setAttribute('role','status');toast.setAttribute('aria-live','polite')}
    const modal=document.getElementById('modal');if(modal){modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true')}
    // Mobile task completion stays reachable on long order forms.
    let savebar=document.getElementById('v20MobileSavebar');
    const needsMobileSave=typeof currentView!=='undefined' && currentView==='orderEdit' && window.innerWidth<=520 && !!draftOrder;
    if(needsMobileSave && !savebar){
      savebar=document.createElement('div');
      savebar.id='v20MobileSavebar';
      savebar.className='mobile-savebar';
      savebar.setAttribute('role','region');
      savebar.setAttribute('aria-label','การทำงานออเดอร์บนมือถือ');
      savebar.innerHTML='<button type="button" class="btn btn-outline" onclick="go(\'orders\')">กลับ</button><button type="button" class="btn btn-primary" onclick="saveOrderDraft()">บันทึกออเดอร์</button>';
      document.body.appendChild(savebar);
    } else if(!needsMobileSave && savebar){ savebar.remove(); }
  }
  const previousRender=window.render;
  if(typeof previousRender==='function'){
    window.render=function(){const result=previousRender.apply(this,arguments);enhanceSemantics(document);return result;};
  }
  const brandSub=document.querySelector('.brand-sub');if(brandSub)brandSub.textContent='Studio Operations';
  const search=document.getElementById('globalSearch');if(search)search.placeholder='ค้นหาออเดอร์ ลูกค้า สินค้า ผู้รับ…';
  const modalContent=document.getElementById('modalContent');
  if(modalContent)new MutationObserver(()=>enhanceSemantics(modalContent)).observe(modalContent,{childList:true,subtree:true});
  window.addEventListener('resize',()=>enhanceSemantics(document),{passive:true});
  enhanceSemantics(document);
  if(typeof render==='function') render();
})();
</script>
