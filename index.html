<script id="mmd-v21-quotation-ready">
(function(){
  const VERSION='V3 · Floral Atelier';
  const DEFAULT_BASIS='ราคานี้อ้างอิงจากรูปภาพและรูปแบบล่าสุดที่ตกลงร่วมกัน ณ วันที่ออกใบเสนอราคา';
  const DEFAULT_FLOWER='รายละเอียดการจัดวาง ชนิด ปริมาณ และโทนสีของดอกไม้อาจปรับตามความเหมาะสมของพื้นที่หน้างานและความพร้อมของดอกไม้ โดยยังคงแนวคิดและภาพรวมตามแบบที่ตกลงกันไว้';
  const DEFAULT_CHANGE='กรณีมีการขอปรับเปลี่ยนหรือเพิ่มเติมรายละเอียดภายหลังจากวันที่ตกลง ซึ่งส่งผลต่อต้นทุน ทางร้านขอสงวนสิทธิ์พิจารณาปรับราคาเพิ่มเติมตามความเหมาะสม';
  const DEFAULT_PAYMENT='ชำระเต็มจำนวนภายในวันที่กำหนด';
  function ensureV21(data){
    if(!data||typeof data!=='object')return data;
    data.settings=data.settings||{};const s=data.settings;
    if(s.salesperson===undefined)s.salesperson='';
    if(s.withholdingEnabled===undefined)s.withholdingEnabled=false;
    if(s.withholdingRate===undefined)s.withholdingRate=3;
    if(s.paymentDueDays===undefined)s.paymentDueDays=7;
    if(s.paymentTerms===undefined)s.paymentTerms=DEFAULT_PAYMENT;
    if(s.quotationBasis===undefined)s.quotationBasis=DEFAULT_BASIS;
    if(s.flowerFlexTerms===undefined)s.flowerFlexTerms=DEFAULT_FLOWER;
    if(s.changeControlTerms===undefined)s.changeControlTerms=DEFAULT_CHANGE;
    (data.orders||[]).forEach(o=>{
      if(o.salesperson===undefined)o.salesperson=s.salesperson||'';
      if(o.withholdingEnabled===undefined)o.withholdingEnabled=!!s.withholdingEnabled;
      if(o.withholdingRate===undefined)o.withholdingRate=num(s.withholdingRate||3);
      if(o.paymentDueDate===undefined)o.paymentDueDate=addDays(o.date||today(),num(s.paymentDueDays||7));
      if(o.paymentTerms===undefined)o.paymentTerms=s.paymentTerms||DEFAULT_PAYMENT;
      if(o.quotationBasis===undefined)o.quotationBasis=s.quotationBasis||DEFAULT_BASIS;
      if(o.flowerFlexTerms===undefined)o.flowerFlexTerms=s.flowerFlexTerms||DEFAULT_FLOWER;
      if(o.changeControlTerms===undefined)o.changeControlTerms=s.changeControlTerms||DEFAULT_CHANGE;
    });
    return data;
  }
  const prevUpgrade=upgradeState;
  upgradeState=function(data){return ensureV21(prevUpgrade(data))};
  state=ensureV21(state);save();

  const prevBlank=blankOrder;
  blankOrder=function(){const o=prevBlank();const s=state.settings;return Object.assign(o,{salesperson:s.salesperson||'',withholdingEnabled:!!s.withholdingEnabled,withholdingRate:num(s.withholdingRate||3),paymentDueDate:addDays(today(),num(s.paymentDueDays||7)),paymentTerms:s.paymentTerms||DEFAULT_PAYMENT,quotationBasis:s.quotationBasis||DEFAULT_BASIS,flowerFlexTerms:s.flowerFlexTerms||DEFAULT_FLOWER,changeControlTerms:s.changeControlTerms||DEFAULT_CHANGE})};

  const baseOrderTotal=orderTotal;
  orderTotal=function(o){const t=baseOrderTotal(o);const whtBase=Math.max(0,t.base);const withholding=o?.withholdingEnabled?whtBase*num(o.withholdingRate||0)/100:0;return {...t,grossTotal:t.total,withholdingBase:whtBase,withholding,amountDue:Math.max(0,t.total-withholding)}};
  function amountDue(o){return orderTotal(o).amountDue}
  paymentStatus=function(o){const due=amountDue(o),p=Math.max(0,paid(o));return p<=0?'unpaid':p+0.005>=due?'paid':'partial'};

  const prevSync=syncOrderFields;
  syncOrderFields=function(){prevSync();if(!draftOrder)return;draftOrder.withholdingRate=num(draftOrder.withholdingRate||0);draftOrder.withholdingEnabled=!!draftOrder.withholdingEnabled;renderOrderSummaryOnly()};

/ ปรับราคา',`<textarea class="textarea" data-order-field="changeControlTerms" oninput="syncOrderFields()">${e(o.changeControlTerms||'')}</textarea>`,4)}</div>${o.withholdingEnabled?`<div class="wht-preview"><span>ยอดหัก ณ ที่จ่าย ${num(o.withholdingRate)}%</span><strong>- ฿${money(t.withholding)} · ยอดชำระ ฿${money(t.amountDue)}</strong></div>`:''}</div>`;
    const anchor='<div id="eventCostArea">';const pos=html.indexOf(anchor);if(pos>=0){const close=html.indexOf('</div></div></details></div>',pos);if(close>=0)html=html.slice(0,close+6)+extra+html.slice(close+6)}return html;

  renderSettings=function(){const s=state.settings;let html=prevSettings();html+=`<div class="settings-grid v21-settings"><div class="card settings-card"><h3>ค่าเริ่มต้นใบเสนอราคา</h3><div class="form-grid">${field('ผู้ขาย / ผู้ดูแลเริ่มต้น',`<input id="sSalesperson" class="input" value="${e(s.salesperson||'')}" placeholder="ชื่อผู้ขาย/ผู้ประสานงาน">`,2)}${field('กำหนดชำระหลังออกเอกสาร',`<div class="input-suffix-wrap"><input id="sPaymentDueDays" type="number" min="0" max="365" class="input" value="${num(s.paymentDueDays||7)}"><span class="input-suffix">วัน</span></div>`,2)}${field('WHT เริ่มต้น',`<select id="sWhtEnabled" class="select"><option value="false" ${!s.withholdingEnabled?'selected':''}>ไม่หัก ณ ที่จ่าย</option><option value="true" ${s.withholdingEnabled?'selected':''}>หัก ณ ที่จ่าย</option></select>`,2)}${field('อัตรา WHT เริ่มต้น',`<div class="input-suffix-wrap"><input id="sWhtRate" type="number" min="0" max="100" step="0.01" class="input" value="${num(s.withholdingRate||3)}"><span class="input-suffix">%</span></div>`,2)}${field('เงื่อนไขการชำระ',`<input id="sPaymentTerms" class="input" value="${e(s.paymentTerms||'')}">`,4)}${field('หลักเกณฑ์ราคา / แบบอ้างอิง',`<textarea id="sQuotationBasis" class="textarea">${e(s.quotationBasis||'')}</textarea>`,4)}${field('เงื่อนไขดอกไม้และหน้างาน',`<textarea id="sFlowerFlexTerms" class="textarea">${e(s.flowerFlexTerms||'')}</textarea>`,4)}${field('เงื่อนไขแก้ไขงาน / ปรับราคา',`<textarea id="sChangeControlTerms" class="textarea">${e(s.changeControlTerms||'')}</textarea>`,4)}</div><div class="guard-note">ใช้เป็น Template ตอนสร้างออเดอร์ใหม่ เอกสารที่ออกแล้วจะเก็บ Snapshot เดิมไว้</div></div></div>`;return html};
  const prevSaveSettings=saveSettings;
  saveSettings=function(){prevSaveSettings();const s=state.settings;if(document.getElementById('sSalesperson'))s.salesperson=document.getElementById('sSalesperson').value.trim();if(document.getElementById('sPaymentDueDays'))s.paymentDueDays=num(document.getElementById('sPaymentDueDays').value||7);if(document.getElementById('sWhtEnabled'))s.withholdingEnabled=document.getElementById('sWhtEnabled').value==='true';if(document.getElementById('sWhtRate'))s.withholdingRate=num(document.getElementById('sWhtRate').value||3);if(document.getElementById('sPaymentTerms'))s.paymentTerms=document.getElementById('sPaymentTerms').value.trim();if(document.getElementById('sQuotationBasis'))s.quotationBasis=document.getElementById('sQuotationBasis').value.trim();if(document.getElementById('sFlowerFlexTerms'))s.flowerFlexTerms=document.getElementById('sFlowerFlexTerms').value.trim();if(document.getElementById('sChangeControlTerms'))s.changeControlTerms=document.getElementById('sChangeControlTerms').value.trim();save();toast('บันทึกการตั้งค่าใบเสนอราคาแล้ว','success')};

  const prevSnapshotSeller=snapshotSeller;

  function quoteTerms(o,seller){const blocks=[];if(o.note)blocks.push(`<div class="term-block"><strong>หมายเหตุ</strong><br>${e(o.note).replace(/\n/g,'<br>')}</div>`);if(o.quotationBasis||seller.quotationBasis)blocks.push(`<div class="term-block"><strong>หลักเกณฑ์ราคา / แบบอ้างอิง</strong><br>${e(o.quotationBasis||seller.quotationBasis).replace(/\n/g,'<br>')}</div>`);if(o.flowerFlexTerms||seller.flowerFlexTerms)blocks.push(`<div class="term-block"><strong>รายละเอียดดอกไม้และหน้างาน</strong><br>${e(o.flowerFlexTerms||seller.flowerFlexTerms).replace(/\n/g,'<br>')}</div>`);if(o.changeControlTerms||seller.changeControlTerms)blocks.push(`<div class="term-block"><strong>การเปลี่ยนแปลงรายละเอียด</strong><br>${e(o.changeControlTerms||seller.changeControlTerms).replace(/\n/g,'<br>')}</div>`);return blocks.join('')}
  const prevFinancial=renderFinancialLast;
  renderFinancialLast=function(type,o,t){if(type!=='quotation')return prevFinancial(type,o,t);const seller=o._seller||state.settings;return `<div class="doc-finance-wrap"><div class="doc-commercial-terms">${quoteTerms(o,seller)}<div class="doc-payment-box"><strong>เงื่อนไขการชำระ</strong><br>${e(o.paymentTerms||seller.paymentTerms||DEFAULT_PAYMENT)}${o.paymentDueDate?` ภายในวันที่ <b>${fmtDate(o.paymentDueDate)}</b>`:''}${seller.bankNo?`<br><span class="bank">${e(seller.bankName||'')} · ${e(seller.bankAccount||'')} · ${e(seller.bankNo)}</span>`:''}</div></div><div class="doc-total-box"><div class="doc-total-row"><span>รวมสินค้า</span><b>฿${money(t.productSubtotal)}</b></div>${t.delivery?`<div class="doc-total-row"><span>ค่าจัดส่ง</span><b>฿${money(t.delivery)}</b></div>`:''}${t.discount?`<div class="doc-total-row"><span>ส่วนลด</span><b>- ฿${money(t.discount)}</b></div>`:''}${o.vatEnabled?`<div class="doc-total-row"><span>VAT ${num(o.vatRate)}%</span><b>฿${money(t.vat)}</b></div>`:''}<div class="doc-total-row grand"><span>รวมเป็นเงิน</span><span>฿${money(t.grossTotal)}</span></div>${o.withholdingEnabled?`<div class="doc-total-row wht"><span>หัก ณ ที่จ่าย ${num(o.withholdingRate)}%</span><b>- ฿${money(t.withholding)}</b></div>`:''}<div class="doc-total-row payable"><span>ยอดชำระ</span><span>฿${money(t.amountDue)}</span></div></div></div><div class="doc-signatures quote-signatures"><div><div class="doc-signature-title">ในนามผู้ซื้อ / ลูกค้า</div><div class="sig-line">ผู้สั่งซื้อ / ผู้อนุมัติ</div><div class="doc-sign-date">วันที่ ____________________</div></div><div><div class="doc-signature-title">ในนาม ${e(seller.company||'MADE MY DAY STUDIO')}</div><div class="sig-line">ผู้อนุมัติ / ผู้เสนอราคา</div><div class="doc-sign-date">วันที่ ____________________</div></div></div>`};

  const prevDocPage=renderDocPage;
  renderDocPage=function(type,o,c,info,items,page,totalPages,startIndex=0){if(type!=='quotation')return prevDocPage(type,o,c,info,items,page,totalPages,startIndex);const t=orderTotal(o),isLast=page===totalPages-1,seller=o._seller||state.settings;return `<section class="doc-page ${page?'continuation':''}"><header class="doc-header"><div><div class="doc-brand">${e(seller.company||seller.legalName||'MADE MY DAY STUDIO')}<small>Flower Studio · Bangkok</small></div><div class="doc-seller">${seller.legalName&&seller.legalName!==(seller.company||'')?`${e(seller.legalName)}<br>`:''}${e(seller.address||'')}${seller.taxId?`<br>เลขผู้เสียภาษี ${e(seller.taxId)} ${e(seller.branch||'')}`:''}${seller.phone?`<br>โทร ${e(seller.phone)}`:''}</div></div><div class="doc-type"><h1>ใบเสนอราคา</h1><div class="doc-no">QUOTATION / ${e(info[2])}${page?` / CONT. ${page+1}`:''}</div><div class="doc-contact-row">${o.salesperson||seller.salesperson?`ผู้ขาย ${e(o.salesperson||seller.salesperson)}`:''}</div></div></header><div class="doc-info"><div><div class="doc-box-title">ลูกค้า</div><div class="doc-customer"><strong>${e(c.name||'ลูกค้าทั่วไป')}</strong><br>${e(c.address||'-')}${c.taxId?`<br>เลขผู้เสียภาษี ${e(c.taxId)} ${e(c.branch||'')}`:''}${c.contactName||c.phone?`<br><b>ผู้ติดต่อ</b> ${e(c.contactName||'-')} ${c.phone?`· ${e(c.phone)}`:''}`:''}</div></div><div><div class="doc-quote-meta"><span class="k">เลขที่</span><span class="v">${e(info[2])}</span><span class="k">วันที่</span><span class="v">${fmtDate(o._issueDate||today())}</span><span class="k">ใช้ได้ถึง</span><span class="v">${fmtDate(o.validUntil)}</span>${o.paymentDueDate?`<span class="k">กำหนดชำระ</span><span class="v">${fmtDate(o.paymentDueDate)}</span>`:''}<span class="k">อ้างอิง</span><span class="v">${e(o.orderNo)}</span><span class="k">ชื่องาน</span><span class="v">${e(o.title||'-')}</span></div></div></div><table class="doc-table doc-quote-table"><colgroup><col style="width:7%"><col style="width:41%"><col style="width:10%"><col style="width:10%"><col style="width:16%"><col style="width:16%"></colgroup><thead><tr><th>#</th><th>รายละเอียด</th><th>จำนวน</th><th>หน่วย</th><th>ราคาต่อหน่วย</th><th>ยอดรวม</th></tr></thead><tbody>${items.map((p,i)=>`<tr><td>${startIndex+i+1}</td><td><div class="doc-item-name">${e(p.name)}</div>${p.description?`<div class="doc-item-desc">${e(p.description)}</div>`:''}</td><td class="num">${num(p.qty)}</td><td class="unit">${e(p.unit||'ชิ้น')}</td><td class="num">฿${money(p.unitPrice)}</td><td class="num">฿${money(productNet(p))}</td></tr>`).join('')}</tbody></table>${isLast?renderFinancialLast(type,o,t):''}<footer class="doc-footer"><span>${[seller.instagram,seller.line,seller.phone].filter(Boolean).map(e).join(' · ')}</span><span class="doc-page-no">PAGE ${page+1} / ${totalPages}</span></footer></section>`};
  function paginateQuote(items){const pages=[];let page=[],units=0,start=0,cursor=0;for(const p of items){const text=(p.name||'')+' '+(p.description||'');const u=1+Math.min(2,Math.floor(text.length/85));if(page.length&&(page.length>=4||units+u>6)){pages.push({items:page,start});start=cursor;page=[];units=0}page.push(p);units+=u;cursor++}if(page.length||!pages.length)pages.push({items:page,start});return pages}
  const prevOpenDocument=openDocument;

  renderOrderSummary=function(o){const t=orderTotal(o),locked=commercialLocked(o);return `<aside class="summary-box"><div class="mono" style="color:rgba(255,255,255,.55)">ORDER SUMMARY</div><h3>${e(o.orderNo)}</h3><div class="sum-row"><span>สินค้า</span><b>${(o.products||[]).length} รายการ</b></div><div class="sum-row"><span>รวมสินค้า</span><b>฿${money(t.productSubtotal)}</b></div><div class="sum-row"><span>ค่าจัดส่ง (${(o.deliveries||[]).length} จุด)</span><b>฿${money(t.delivery)}</b></div><div class="sum-row"><span>ส่วนลด</span><b>- ฿${money(t.discount)}</b></div>${o.vatEnabled?`<div class="sum-row"><span>VAT ${num(o.vatRate)}%</span><b>฿${money(t.vat)}</b></div>`:''}<div class="sum-row"><span>รวมเป็นเงิน</span><b>฿${money(t.grossTotal)}</b></div>${o.withholdingEnabled?`<div class="sum-row wht"><span>หัก ณ ที่จ่าย ${num(o.withholdingRate)}%</span><b>- ฿${money(t.withholding)}</b></div>`:''}<div class="sum-row payable"><span>ยอดชำระ</span><span>฿${money(t.amountDue)}</span></div>${editingOrderId?`<div class="sum-row"><span>รับชำระแล้ว</span><b>฿${money(Math.max(0,paid(o)))}</b></div><div class="sum-row"><span>คงเหลือ</span><b>฿${money(Math.max(0,t.amountDue-paid(o)))}</b></div>`:''}<div class="summary-actions"><button class="btn btn-white" onclick="saveOrderDraft()">บันทึกออเดอร์</button>${editingOrderId&&!locked?`<button class="btn btn-primary" onclick="issueQuotation()">${(o.quoteVersions||[]).length?'ออก Revision ใหม่':'ออกใบเสนอราคา'}</button>`:''}${editingOrderId&&locked?`<div class="summary-lock">✓ ใบเสนอราคายืนยันแล้ว · Commercial Terms ถูกล็อก</div>`:''}${editingOrderId?`<button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)" onclick="openDocumentsMenu()">เอกสารทั้งหมด</button>`:''}</div></aside>`};
  renderPaymentSection=function(o){const docs=o.documents||[],due=amountDue(o);return `<div class="grid-2"><div><div class="list">${(o.payments||[]).map(p=>`<div class="ledger-row ${num(p.amount)<0?'refund':''}"><div><b>${fmtDate(p.date)} · ${e(p.method||'ปรับปรุงรายการ')}</b><div class="sub">${e(p.ref||p.note||'')} ${p.reversalFor?'· ย้อนรายการ':''}</div></div><div><div class="money">${num(p.amount)<0?'- ':'+'}฿${money(Math.abs(num(p.amount)))}</div>${num(p.amount)>0&&!o.payments.some(x=>x.reversalFor===p.id)?`<div class="actions" style="margin-top:5px"><button class="btn btn-danger btn-sm" onclick="reversePayment('${p.id}')">ย้อนรายการ</button></div>`:''}</div></div>`).join('')||'<div class="empty">ยังไม่มีการชำระเงิน</div>'}</div><div style="margin-top:10px"><button class="btn btn-dark btn-sm" onclick="openPaymentModal()">+ บันทึกการชำระเงิน</button></div><div class="guard-note">ยอดตามใบเสนอราคา ฿${money(orderTotal(o).grossTotal)}${o.withholdingEnabled?` · WHT ฿${money(orderTotal(o).withholding)}`:''}<br>ยอดรับสุทธิ ฿${money(Math.max(0,paid(o)))} · คงเหลือ ฿${money(Math.max(0,due-paid(o)))}</div></div><div><div class="card entity-card"><h3>เอกสารที่ออกแล้ว</h3><div class="doc-history">${docs.slice().reverse().map(d=>`<div class="doc-history-row"><div><b>${e(d.number)}</b><small>${docTypeLabel(d.type)} · ออก ${fmtDate(d.issuedDate)}${d.version?` · V${d.version}`:''}</small></div><div class="actions"><button class="btn btn-outline btn-sm" onclick="openDocument('${d.type}','${o.id}','${d.id}')">เปิด</button></div></div>`).join('')||'<div class="sub">ยังไม่มีเอกสารที่ออก</div>'}</div></div></div></div>`};
  openPaymentModal=function(){if(!['confirmed','active','completed'].includes(draftOrder.status)){toast('ต้องยืนยันออเดอร์ก่อนบันทึกการชำระเงิน','danger');return}const outstanding=Math.max(0,amountDue(draftOrder)-paid(draftOrder));if(outstanding<=0){toast('ออเดอร์นี้รับชำระครบแล้ว','success');return}document.getElementById('modal').className='modal small';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">PAYMENT</div><h3>รับชำระเงิน</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="guard-note"><b>ยอดคงเหลือ ฿${money(outstanding)}</b>${draftOrder.withholdingEnabled?` · หลังหัก ณ ที่จ่าย ${num(draftOrder.withholdingRate)}%`:''}</div><div class="quick-amounts"><button type="button" class="quick-amount" onclick="setPayAmount(${(outstanding*.25).toFixed(2)})">25%</button><button type="button" class="quick-amount" onclick="setPayAmount(${(outstanding*.5).toFixed(2)})">50%</button><button type="button" class="quick-amount primary" onclick="setPayAmount(${outstanding.toFixed(2)})">เต็มยอด</button></div><div class="form-grid"><div class="field span2 money-entry"><label>${labelHtml('จำนวนเงิน',true)}</label><div class="input-prefix-wrap"><span class="input-prefix">฿</span><input id="payAmount" type="number" inputmode="decimal" min="0.01" max="${outstanding}" step="0.01" class="input" value="${outstanding.toFixed(2)}"></div><div class="field-error">จำนวนเงินไม่ถูกต้อง</div></div>${field('วันที่รับเงิน',`<input id="payDate" type="date" class="input" value="${today()}">`,2)}<div class="choice-block"><div class="choice-label">ช่องทางชำระ</div><div class="choice-group segmented payment-methods">${['โอนเงิน','เงินสด','บัตร','อื่นๆ'].map((m,i)=>`<button type="button" class="choice-btn ${i===0?'active':''}" onclick="setPaymentMethod('${m}',this)">${m}</button>`).join('')}</div><input id="payMethod" type="hidden" value="โอนเงิน"></div>${field('เลขอ้างอิง / หมายเหตุ',`<input id="payRef" class="input" placeholder="เช่น Slip 123456 / มัดจำงวดแรก">`,4,'ช่วยย้อนตรวจรายการได้ง่าย')}</div><div class="modal-foot-sticky"><div class="actions" style="justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-dark" onclick="savePayment()">บันทึกการชำระเงิน</button></div></div></div>`;openModal()};
  savePayment=function(){let a=num(document.getElementById('payAmount').value),outstanding=Math.max(0,amountDue(draftOrder)-paid(draftOrder));if(a<=0){toast('จำนวนเงินต้องมากกว่า 0','danger');return}if(a>outstanding+0.005){toast('ยอดรับเกินยอดคงเหลือ','danger');return}draftOrder.payments.push({id:uid(),kind:'payment',date:document.getElementById('payDate').value,amount:a,method:document.getElementById('payMethod').value,ref:document.getElementById('payRef').value,createdAt:new Date().toISOString()});refreshOrderStatus(draftOrder,false);markDirty();closeModal();saveOrderDraft()};
  orderRows=function(rows){return rows.map(o=>{const t=orderTotal(o);return `<tr data-search="${e((o.orderNo+' '+customerName(o.customerId)+' '+(o.title||'')).toLowerCase())}" data-status="${o.status}"><td><b>${e(o.orderNo)}</b><div class="sub">${e(o.quoteNo||'ยังไม่ออกใบเสนอราคา')}</div></td><td><b>${e(customerName(o.customerId))}</b><div class="sub">${e(o.title||'-')} · ${e(o.source||'-')}</div></td><td>${(o.products||[]).length} สินค้า<div class="sub">${(o.products||[]).reduce((s,p)=>s+(p.flowers||[]).length,0)} รายการดอกไม้ภายใน</div></td><td>${deliveryDateText(o)}<div class="sub">${(o.deliveries||[]).length} จุดส่ง</div></td><td>${statusBadge(o)}</td><td>฿${money(paid(o))}<div class="sub">คงเหลือ ฿${money(Math.max(0,t.amountDue-paid(o)))}</div></td><td class="money">฿${money(t.grossTotal)}${o.withholdingEnabled?`<div class="sub">รับจริง ฿${money(t.amountDue)}</div>`:''}</td><td><div class="actions"><button class="btn btn-outline btn-sm" onclick="editOrder('${o.id}')">เปิด</button><button class="btn btn-ghost btn-sm" onclick="duplicateOrder('${o.id}')">ทำซ้ำ</button></div></td></tr>`}).join('')||`<tr><td colspan="8"><div class="empty">ยังไม่มีออเดอร์ กด “สร้างออเดอร์” เพื่อเริ่มงานแรก</div></td></tr>`};
  renderOrderMobileCards=function(rows){return rows.map(o=>{const t=orderTotal(o);return `<div class="order-mobile-card" onclick="editOrder('${o.id}')"><div class="head"><div><div class="title">${e(o.title||customerName(o.customerId))}</div><div class="sub">${e(o.orderNo)} · ${e(customerName(o.customerId))}</div></div>${statusBadge(o)}</div><div class="meta"><span class="badge">${(o.products||[]).length} สินค้า</span><span class="badge">${e(productionLabel(o.productionStatus))}</span>${(o.tags||[]).slice(0,2).map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div><div class="moneyline"><span>${deliveryDueDate(o)==='9999-12-31'?'ยังไม่กำหนดส่ง':'ส่ง '+deliveryDateText(o)}</span><b>฿${money(t.grossTotal)}</b></div><div class="moneyline"><span>ชำระแล้ว ฿${money(Math.max(0,paid(o)))}</span><span>คงเหลือ ฿${money(Math.max(0,t.amountDue-paid(o)))}</span></div></div>`}).join('')||'<div class="empty">ไม่พบออเดอร์ในมุมมองนี้</div>'};

  const prevDashboard=renderDashboard;

<script id="mmd-v21-quotation-pagination-fix">
(function(){
  const previousOpenDocumentV21=openDocument;
  function renderQuoteTermsOnlyPageV21(o,c,info,page,totalPages){
    const seller=o._seller||state.settings,t=orderTotal(o);
    return `<section class="doc-page continuation"><header class="doc-header"><div><div class="doc-brand">${e(seller.company||seller.legalName||'MADE MY DAY STUDIO')}<small>Flower Studio · Bangkok</small></div><div class="doc-seller">${e(seller.address||'')}${seller.taxId?`<br>เลขผู้เสียภาษี ${e(seller.taxId)} ${e(seller.branch||'')}`:''}${seller.phone?`<br>โทร ${e(seller.phone)}`:''}</div></div><div class="doc-type"><h1>ใบเสนอราคา</h1><div class="doc-no">QUOTATION / ${e(info[2])} / CONT. ${page+1}</div></div></header><div class="doc-info"><div><div class="doc-box-title">ลูกค้า</div><div class="doc-customer"><strong>${e(c.name||'ลูกค้าทั่วไป')}</strong>${c.contactName||c.phone?`<br><b>ผู้ติดต่อ</b> ${e(c.contactName||'-')} ${c.phone?`· ${e(c.phone)}`:''}`:''}</div></div><div><div class="doc-quote-meta"><span class="k">เลขที่</span><span class="v">${e(info[2])}</span><span class="k">วันที่</span><span class="v">${fmtDate(o._issueDate||today())}</span><span class="k">อ้างอิง</span><span class="v">${e(o.orderNo)}</span><span class="k">ชื่องาน</span><span class="v">${e(o.title||'-')}</span></div></div></div><div class="doc-box-title" style="margin-top:5mm">เงื่อนไข การชำระเงิน และการอนุมัติ</div>${renderFinancialLast('quotation',o,t)}<footer class="doc-footer"><span>${[seller.instagram,seller.line,seller.phone].filter(Boolean).map(e).join(' · ')}</span><span class="doc-page-no">PAGE ${page+1} / ${totalPages}</span></footer></section>`;
  }
  openDocument=function(type,id,docId=''){
    if(type!=='quotation')return previousOpenDocumentV21(type,id,docId);
    const live=state.orders.find(x=>x.id===id)||draftOrder;if(!live)return;
    let doc=(live.documents||[]).find(d=>d.id===docId),o,c,info;
    if(doc){o=structuredClone(doc.order);o._seller=doc.seller;o._issueDate=doc.issuedDate;o._docNo=doc.number;c=structuredClone(doc.customer);info=['ใบเสนอราคา','QUOTATION',doc.number]}
    else{o=structuredClone(live);o._seller=snapshotSeller();o._issueDate=today();o._docNo='DRAFT';c=snapshotCustomer(o);info=['ใบเสนอราคา','QUOTATION','DRAFT']}
    const items=o.products||[];
    // Single short quotation stays one A4 page. Multi-page quotes reserve the final page for commercial terms/signatures.
    if(items.length<=4)return previousOpenDocumentV21(type,id,docId);
    const chunks=[];for(let i=0;i<items.length;i+=4)chunks.push({items:items.slice(i,i+4),start:i});
    const totalPages=chunks.length+1;
    const body=chunks.map((chunk,idx)=>renderDocPage(type,o,c,info,chunk.items,idx,totalPages,chunk.start)).join('')+renderQuoteTermsOnlyPageV21(o,c,info,chunks.length,totalPages);
    document.getElementById('docPages').innerHTML=body;document.getElementById('docOverlay').classList.add('open');setTimeout(scaleDocPages,30);
  };
})();
</script>

<script id="mmd-v3-floral-atelier-script">
(function(){
  const V3_NAV=[['dashboard','01','Overview'],['orders','02','Orders'],['customers','03','Clients'],['templates','04','Designs'],['flowers','05','Flowers'],['analytics','06','Insights'],['settings','07','Settings']];
  window.v3OrderStep=window.v3OrderStep||1;

  window.renderNav=function(){
    document.getElementById('nav').innerHTML=V3_NAV.map(n=>`<button class="nav-btn ${currentView===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="nav-ico">${n[1]}</span>${n[2]}</button>`).join('');
  };

  function ensureV3Brief(o){
    if(!o.v3Brief)o.v3Brief={occasion:'',mood:'',palette:'',budget:'',cardMessage:'',referenceNote:''};
    return o.v3Brief;
  }
  window.ensureV3Brief=ensureV3Brief;

  const _newOrder=window.newOrder;
  window.newOrder=function(){v3OrderStep=1;_newOrder();ensureV3Brief(draftOrder)};
  const _editOrder=window.editOrder;
  if(_editOrder) window.editOrder=function(id){v3OrderStep=1;_editOrder(id);if(draftOrder)ensureV3Brief(draftOrder)};

  window.syncV3Fields=function(){
    if(!draftOrder)return; const b=ensureV3Brief(draftOrder);
    document.querySelectorAll('[data-v3-field]').forEach(el=>{b[el.dataset.v3Field]=el.value});
  };
  window.setV3Field=function(k,v){if(!draftOrder)return;ensureV3Brief(draftOrder)[k]=v;render()};
  window.setOrderStepV3=function(n){syncOrderFields();syncV3Fields();v3OrderStep=Math.max(1,Math.min(5,n));render();window.scrollTo({top:0,behavior:'smooth'})};
  window.applyOrderPresetV3=function(type){
    if(!draftOrder)return; const b=ensureV3Brief(draftOrder);
    const presets={
      birthday:{jobType:'Bouquet',occasion:'Birthday',mood:'Bright & Joyful',title:'Birthday Bouquet'},
      anniversary:{jobType:'Bouquet',occasion:'Anniversary',mood:'Romantic & Soft',title:'Anniversary Bouquet'},
      congrats:{jobType:'Bouquet',occasion:'Congratulations',mood:'Fresh & Elegant',title:'Congratulations Bouquet'},
      sympathy:{jobType:'Arrangement',occasion:'Sympathy',mood:'Calm & Gentle',title:'Sympathy Flowers'},
      corporate:{jobType:'Arrangement',occasion:'Corporate Gift',mood:'Refined & Modern',title:'Corporate Floral Gift'},
      event:{jobType:'Event',occasion:'Event',mood:'Editorial & Cohesive',title:'Event Floral Styling'}
    };
    const p=presets[type]; if(!p)return;
    draftOrder.jobType=p.jobType; draftOrder.title=p.title; b.occasion=p.occasion; b.mood=p.mood; render();
  };

  function choice(label,value,current,field){return `<button type="button" class="v3-choice ${current===value?'active':''}" onclick="setV3Field('${field}','${value.replace(/'/g,"\\'")}')">${label}</button>`}
  function stageNav(prev,next){return `<div class="v3-stage-footer"><div>${prev?`<button class="btn btn-ghost" type="button" onclick="setOrderStepV3(${prev})">← ก่อนหน้า</button>`:''}</div><div class="v3-order-savebar"><button class="btn btn-outline" type="button" onclick="syncOrderFields();syncV3Fields();saveOrderDraft()">บันทึกร่าง</button>${next?`<button class="btn btn-dark" type="button" onclick="setOrderStepV3(${next})">ถัดไป →</button>`:''}</div></div>`}
  function stepbar(){const steps=[['Brief','Brief'],['Design','Design'],['Delivery','Delivery'],['Pricing','Price'],['Review','Review']];return `<div class="v3-stepbar">${steps.map((x,i)=>`<button class="v3-step ${v3OrderStep===i+1?'active':''}" onclick="setOrderStepV3(${i+1})"><b>${i+1}</b>${x[1]}</button>`).join('')}</div>`}

  function renderBriefStage(o){const b=ensureV3Brief(o);return `<section class="v3-stage"><div class="v3-stage-head"><div class="v3-stage-title"><div class="section-kicker">Step 01 · Brief</div><h3>เริ่มจากสิ่งที่ลูกค้าต้องการ</h3><p>เก็บโจทย์ก่อนรายละเอียดเชิงระบบ เพื่อให้การคุยกับลูกค้าและการทำใบเสนอราคาเดินต่อได้เร็วขึ้น</p></div></div>
    <div class="v3-presets"><button class="v3-preset" onclick="applyOrderPresetV3('birthday')">Birthday</button><button class="v3-preset" onclick="applyOrderPresetV3('anniversary')">Anniversary</button><button class="v3-preset" onclick="applyOrderPresetV3('congrats')">Congratulations</button><button class="v3-preset" onclick="applyOrderPresetV3('sympathy')">Sympathy</button><button class="v3-preset" onclick="applyOrderPresetV3('corporate')">Corporate</button><button class="v3-preset" onclick="applyOrderPresetV3('event')">Event</button></div>
    <div class="v3-form-grid">
      <div class="v3-field full"><label>ลูกค้า</label><select class="select" data-order-field="customerId" onchange="syncOrderFields();prefillRecipient()"><option value="">เลือกลูกค้า</option>${state.customers.map(c=>`<option value="${c.id}" ${o.customerId===c.id?'selected':''}>${e(c.name)}</option>`).join('')}</select><small><button class="btn btn-ghost btn-sm" type="button" onclick="openCustomerModal(true)">+ เพิ่มลูกค้าใหม่</button></small></div>
      <div class="v3-field"><label>ชื่องาน / ชื่อที่ใช้จำ</label><input class="input" data-order-field="title" value="${e(o.title||'')}" placeholder="เช่น Soft Pink Anniversary Bouquet" oninput="syncOrderFields()"></div>
      <div class="v3-field"><label>Occasion</label><input class="input" data-v3-field="occasion" value="${e(b.occasion||'')}" placeholder="Birthday, Anniversary, Proposal…" oninput="syncV3Fields()"></div>
      <div class="v3-field"><label>ประเภทงาน</label><select class="select" data-order-field="jobType" onchange="syncOrderFields()">${['Bouquet','Arrangement','Event','Other'].map(x=>`<option ${o.jobType===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="v3-field"><label>ช่องทางที่ติดต่อ</label><select class="select" data-order-field="source" onchange="syncOrderFields()">${['Instagram','LINE','โทรศัพท์ส่วนตัว','Referral','Walk-in','อื่นๆ'].map(x=>`<option ${o.source===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="v3-field full"><label>Mood / Feeling</label><div class="v3-choice-row">${choice('Soft & Romantic','Romantic & Soft',b.mood,'mood')}${choice('Fresh & Elegant','Fresh & Elegant',b.mood,'mood')}${choice('Bright & Joyful','Bright & Joyful',b.mood,'mood')}${choice('Calm & Gentle','Calm & Gentle',b.mood,'mood')}${choice('Modern & Editorial','Editorial & Cohesive',b.mood,'mood')}</div><input class="input" style="margin-top:9px" data-v3-field="mood" value="${e(b.mood||'')}" placeholder="หรือพิมพ์ mood เอง" oninput="syncV3Fields()"></div>
      <div class="v3-field"><label>Color palette</label><input class="input" data-v3-field="palette" value="${e(b.palette||'')}" placeholder="เช่น blush pink, cream, muted green" oninput="syncV3Fields()"><small>ใช้เป็น design direction ในใบเสนอราคาได้</small></div>
      <div class="v3-field"><label>งบประมาณโดยประมาณ</label><input class="input" inputmode="decimal" data-v3-field="budget" value="${e(b.budget||'')}" placeholder="เช่น 2,500–3,500 บาท" oninput="syncV3Fields()"></div>
      <div class="v3-field full"><label>Reference / สิ่งที่ลูกค้าชอบหรือไม่ชอบ</label><textarea class="textarea" data-v3-field="referenceNote" placeholder="เช่น อยากได้ช่อโปร่ง ไม่แน่น ไม่ใช้แดงสด…" oninput="syncV3Fields()">${e(b.referenceNote||'')}</textarea></div>
      <div class="v3-field full"><label>ข้อความบนการ์ด</label><textarea class="textarea" data-v3-field="cardMessage" placeholder="เว้นว่างได้" oninput="syncV3Fields()">${e(b.cardMessage||'')}</textarea></div>
      <div class="v3-field"><label>วันที่เอกสาร</label><input type="date" class="input" data-order-field="date" value="${e(o.date)}" onchange="syncOrderFields()"></div>
      <div class="v3-field"><label>ใบเสนอราคาใช้ได้ถึง</label><input type="date" class="input" data-order-field="validUntil" value="${e(o.validUntil)}" onchange="syncOrderFields()"></div>
    </div>${stageNav(null,2)}</section>`}

  function renderDesignStage(o){return `<section class="v3-stage"><div class="v3-stage-head"><div class="v3-stage-title"><div class="section-kicker">Step 02 · Design</div><h3>จัดองค์ประกอบสินค้า</h3><p>แต่ละรายการคือสิ่งที่ลูกค้าซื้อ ส่วนสูตรดอกไม้เก็บไว้ภายในร้านเพื่อใช้ผลิตจริง</p></div><button class="btn btn-dark" onclick="openProductModal()">+ เพิ่มสินค้า</button></div>
  ${(o.products||[]).length?`<div class="product-stack">${renderDraftProducts(o)}</div>`:`<div class="v3-product-empty"><div class="flower">❀</div><b>ยังไม่มีสินค้าในออเดอร์</b><div class="sub">เริ่มจากชื่อช่อ/เซ็ต ราคา และรายละเอียดที่ลูกค้าจะเห็น แล้วค่อยใส่สูตรดอกไม้ภายใน</div><button class="btn btn-dark" style="margin-top:16px" onclick="openProductModal()">สร้างรายการแรก</button></div>`}${stageNav(1,3)}</section>`}

  function renderDeliveryStage(o){return `<section class="v3-stage v3-delivery-wrap"><div class="v3-stage-head"><div class="v3-stage-title"><div class="section-kicker">Step 03 · Delivery</div><h3>ผู้รับและการจัดส่ง</h3><p>แยกผู้ซื้อออกจากผู้รับได้ และรองรับหลายจุดส่งสำหรับงานเดียวกัน</p></div><button class="btn btn-outline" type="button" onclick="addDelivery()">+ เพิ่มจุดส่ง</button></div><div id="deliveryEditor">${renderDeliveryEditor(o)}</div>${stageNav(2,4)}</section>`}

  function renderPricingStage(o){return `<section class="v3-stage"><div class="v3-stage-head"><div class="v3-stage-title"><div class="section-kicker">Step 04 · Pricing</div><h3>ราคา เงื่อนไข และโน้ต</h3><p>เก็บเฉพาะสิ่งที่มีผลกับ commercial terms ส่วนรายละเอียดการออกแบบอยู่ใน Brief แล้ว</p></div></div><div class="v3-form-grid">
    <div class="v3-field"><label>ส่วนลดท้ายบิล</label><input type="number" min="0" class="input" data-order-field="orderDiscount" value="${num(o.orderDiscount)}" oninput="syncOrderFields()"></div>
    <div class="v3-field"><label>VAT</label><select class="select" data-order-field="vatEnabled" onchange="draftOrder.vatEnabled=this.value==='true';renderOrderSummaryOnly()"><option value="false" ${!o.vatEnabled?'selected':''}>ไม่คิด VAT</option><option value="true" ${o.vatEnabled?'selected':''}>คิด VAT</option></select></div>
    ${o.vatEnabled?`<div class="v3-field"><label>อัตรา VAT (%)</label><input type="number" step="0.01" min="0" class="input" data-order-field="vatRate" value="${num(o.vatRate)}" oninput="syncOrderFields()"></div>`:''}
    <div class="v3-field"><label>สถานะออเดอร์</label><select class="select" data-order-field="status" onchange="syncOrderFields()">${['draft','quoted','confirmed','active','completed','cancelled'].map(x=>`<option value="${x}" ${o.status===x?'selected':''}>${({draft:'ร่าง',quoted:'เสนอราคาแล้ว',confirmed:'ยืนยันแล้ว',active:'กำลังดำเนินการ',completed:'เสร็จสิ้น',cancelled:'ยกเลิก'})[x]}</option>`).join('')}</select></div>
    <div class="v3-field full"><label>หมายเหตุสำหรับลูกค้า</label><textarea class="textarea" data-order-field="note" placeholder="เฉพาะเงื่อนไขหรือข้อความที่ควรปรากฏในเอกสาร" oninput="syncOrderFields()">${e(o.note||'')}</textarea></div>
    <div class="v3-field full"><label>โน้ตภายในร้าน</label><textarea class="textarea" data-order-field="internalNote" placeholder="ข้อมูลภายใน ไม่แสดงกับลูกค้า" oninput="syncOrderFields()">${e(o.internalNote||'')}</textarea></div>
  </div>${o.jobType==='Event'?`<div style="margin-top:22px"><div class="section-kicker">Internal Event Cost</div><div id="eventCosts">${renderEventCosts(o)}</div><button class="btn btn-ghost btn-sm" onclick="addEventCost()">+ เพิ่มต้นทุน</button></div>`:''}${stageNav(3,5)}</section>`}

  function renderReviewStage(o){const b=ensureV3Brief(o);const c=state.customers.find(x=>x.id===o.customerId)||{};return `<section class="v3-stage"><div class="v3-stage-head"><div class="v3-stage-title"><div class="section-kicker">Step 05 · Review</div><h3>ตรวจทานก่อนส่งให้ลูกค้า</h3><p>ดูเฉพาะสิ่งสำคัญก่อนบันทึกและออกใบเสนอราคา</p></div></div>
  <div class="v3-review-card"><h4>Client & Design Brief</h4><dl class="v3-review-list"><dt>ลูกค้า</dt><dd>${e(c.name||'ยังไม่ได้เลือก')}</dd><dt>งาน</dt><dd>${e(o.title||'-')}</dd><dt>Occasion</dt><dd>${e(b.occasion||'-')}</dd><dt>Mood</dt><dd>${e(b.mood||'-')}</dd><dt>Palette</dt><dd>${e(b.palette||'-')}</dd><dt>Budget guide</dt><dd>${e(b.budget||'-')}</dd></dl></div>
  <div class="v3-review-card"><h4>Order Summary</h4><dl class="v3-review-list"><dt>สินค้า</dt><dd>${(o.products||[]).length} รายการ</dd><dt>จุดส่ง</dt><dd>${(o.deliveries||[]).length} จุด</dd><dt>กำหนดส่ง</dt><dd>${e(deliveryDateText(o))}</dd><dt>สถานะ</dt><dd>${e(o.status||'draft')}</dd></dl></div>
  ${editingOrderId?`<div class="v3-review-card"><h4>Payment & Documents</h4>${renderPaymentSection(o)}</div>`:''}
  <div class="v3-stage-footer"><button class="btn btn-ghost" onclick="setOrderStepV3(4)">← ก่อนหน้า</button><div class="v3-order-savebar"><button class="btn btn-outline" onclick="syncOrderFields();syncV3Fields();saveOrderDraft()">บันทึกออเดอร์</button>${editingOrderId?`<button class="btn btn-dark" onclick="syncOrderFields();syncV3Fields();issueQuotation()">${o.quoteNo?'ดูใบเสนอราคา':'ออกใบเสนอราคา'}</button>`:''}</div></div></section>`}

  window.renderOrderEditor=function(){

    if(!row||!row.state)throw new Error('ไม่พบข้อมูลระบบ');
    state=row.state;cloudVersion=Number(row.version||1);localStorage.setItem(KEY,JSON.stringify(state));sessionStorage.setItem('mmd_access_code',code);ready=true;gate.classList.add('hidden');render();setStatus('Cloud · synced','ok');
  }
  async function saveCloud(){
    if(!ready||saving)return;if(!sessionStorage.getItem('mmd_access_code'))return;saving=true;pending=false;setStatus('Cloud · saving');
    try{const rows=await rpc('mmd_save_state',{p_code:sessionStorage.getItem('mmd_access_code'),p_state:state,p_expected_version:cloudVersion});const row=Array.isArray(rows)?rows[0]:rows;cloudVersion=Number(row.version);setStatus('Cloud · saved','ok')}
    catch(e){if(String(e.message).includes('VERSION_CONFLICT')){setStatus('Cloud · conflict','warn');toast('มีการแก้ข้อมูลจากอีกเครื่อง กรุณารีเฟรชเพื่อรับข้อมูลล่าสุด','danger')}else{setStatus('Cloud · save failed','err');toast('บันทึก Cloud ไม่สำเร็จ ข้อมูลยังอยู่ในเครื่องนี้','danger')}}
    finally{saving=false;if(pending)saveCloud()}
  }
  window.mmdQueueCloudSave=function(){if(!ready)return;pending=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,350)};
  document.getElementById('mmdAccessButton').addEventListener('click',async()=>{const code=codeInput.value.trim();if(!code)return;try{await login(code)}catch(e){err.textContent='รหัสไม่ถูกต้อง หรือเชื่อมต่อฐานข้อมูลไม่ได้';setStatus('Cloud · locked','err')}});
  codeInput.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('mmdAccessButton').click()});
  const saved=sessionStorage.getItem('mmd_access_code');if(saved){codeInput.value=saved;login(saved).catch(()=>{sessionStorage.removeItem('mmd_access_code');gate.classList.remove('hidden');setStatus('Cloud · locked','err')})}else{setStatus('Cloud · locked','warn')}
})();
</script>
</body></html>
