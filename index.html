<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>NLG HM Schedule</title>
<link rel="stylesheet" href="styles-v5.css?v=5">
<link rel="stylesheet" href="export-columns-v6.css?v=13">
<link rel="stylesheet" href="main-overview-v7.css?v=2">
<link rel="stylesheet" href="responsive-v8.css?v=1">
</head>
<body>
<div class="unlock" id="unlock"><div class="unlockcard">
  <small>NLG • HM SET</small><h1>เชื่อมข้อมูล</h1>
  <p>ใส่รหัสครั้งเดียวบนอุปกรณ์นี้ เพื่อเปิดตารางที่บันทึกไว้ใน Supabase</p>
  <input id="accessInput" type="password" placeholder="รหัสเชื่อมข้อมูล" autocomplete="off">
  <button id="unlockBtn">เชื่อมข้อมูล</button>
</div></div>

<div class="app">
  <div class="top">
    <div class="toolbar">
      <div class="toolbar-main">
        <div class="brand"><small>NLG • HM SET</small><b>Schedule</b></div>
        <div class="monthnav"><button id="prev">‹</button><input id="month" type="month"><button id="next">›</button></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="addTop">＋ เพิ่มวัน</button>
        <button class="btn" id="settingsBtn">ตั้งค่า Set</button>
        <button class="btn" id="exportBtn">สร้างภาพแนวนอน</button>
        <div class="status" id="status">กำลังเชื่อม...</div>
      </div>
    </div>
  </div>

  <main>
    <div class="hero"><div><h1 id="monthTitle"></h1><p>แสดงเฉพาะวันที่มีตาราง • จัด Week แบบศุกร์–พฤหัส</p></div></div>
    <div class="legend" id="legend"></div>
    <div class="weeks" id="weeks"></div>
  </main>
</div>
<button class="fab" id="fab">＋ เพิ่มวัน</button>

<div class="modal" id="itemModal"><div class="sheet">
  <div class="handle"></div><h2 id="formTitle">เพิ่มวัน</h2><div class="sub">เลือกชนิดตาราง แล้วกรอกเฉพาะข้อมูลที่ใช้จริง</div>
  <div class="field"><label>วันที่</label><input id="fDate" type="date"></div>
  <div class="field"><label>รูปแบบ</label><div class="kindseg" id="kindSeg">
    <button data-kind="hm_large">HM ใหญ่</button><button data-kind="hm_small">HM เล็ก</button><button data-kind="special">Special Event</button>
  </div></div>
  <div id="hmFields">
    <div class="formbox" id="speakerBox"><div class="optrow"><input id="speakerOn" type="checkbox" checked><label for="speakerOn"><b>Speaker</b></label></div><input class="grow" id="fSpeaker" placeholder="เช่น แนน + สีน้ำ"></div>
    <div class="formbox" id="productBox"><div class="optrow"><input id="productOn" type="checkbox" checked><label for="productOn"><b>Product</b></label></div><input class="grow" id="fProduct" placeholder="เช่น Nutriplant / Artistry"></div>
    <div class="formbox" id="bringBox"><div class="optrow"><input id="bringOn" type="checkbox"><label for="bringOn"><b>Bring</b></label></div><input class="grow" id="fBring" placeholder="เช่น โชค (เครื่อง) + แนน (สาธิต)"></div>
  </div>
  <div id="specialFields" style="display:none">
    <div class="field"><label>ชื่อ Event</label><input id="fTitle" placeholder="เช่น AwakeConnect #1"></div>
  </div>
  <div class="sacts"><button class="btn" id="cancelItem">ยกเลิก</button><button class="btn primary" id="saveItem">บันทึก</button></div>
</div></div>

<div class="modal" id="settingsModal"><div class="sheet">
  <div class="handle"></div><h2>ตั้งค่า Set</h2><div class="sub">ค่าตรงนี้เป็น Default และใช้กับ HM ทุกวัน</div>
  <div id="settingsRows"></div>
  <div class="sacts"><button class="btn" id="cancelSettings">ยกเลิก</button><button class="btn primary" id="saveSettings">บันทึกค่า Default</button></div>
</div></div>

<div id="exportBoard"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="legacy-migrate-v5.js?v=5"></script>
<script src="app-v5.js?v=5"></script>
<script src="main-overview-v7.js?v=2"></script>
<script src="export-columns-v6.js?v=13"></script>
</body>
</html>
