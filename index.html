<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MADE MY DAY STUDIO · Floral Atelier v3</title>
<style id="emily-design-system-v2">
/* ================================================================
   MADE MY DAY STUDIO / BACKOFFICE 2.0
   Emily Design System reset
   Functional authority: Emily ERP/POS UXUI 2027 + Component Engine
   Visual layer: restrained M3-informed product system
   ================================================================ */
:root{
  /* semantic color system */
  --bg:#f4f6f3;
  --surface:#ffffff;
  --surface-1:#f8faf8;
  --surface-2:#edf1ed;
  --surface-3:#e3e9e4;
  --ink:#17201b;
  --text:#314039;
  --muted:#69766f;
  --subtle:#8d9892;
  --line:#dce3de;
  --line-strong:#bac6bf;
  --primary:#24513f;
  --primary-hover:#1e4536;
  --primary-pressed:#18392d;
  --primary-container:#dcebe3;
  --on-primary:#ffffff;
  --secondary:#6e5268;
  --secondary-container:#eee4eb;
  --success:#217a50;
  --success-container:#dff2e7;
  --warning:#93621e;
  --warning-container:#f8ecd6;
  --danger:#b13d3d;
  --danger-container:#fae4e2;
  --info:#3d638f;
  --info-container:#e2ebf5;
  --focus:#4f7e69;

  /* type */
  --font-ui:Inter,"Segoe UI","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;

  /* sizing */
  --nav-w:236px;
  --top-h:64px;
  --content-max:1440px;
  --control-h:44px;
  --control-h-touch:48px;
  --r-xs:6px;
  --r-sm:9px;
  --r-md:12px;
  --r-lg:16px;
  --r-xl:22px;
  --shadow-float:0 12px 36px rgba(23,32,27,.12);
  --shadow-dialog:0 26px 72px rgba(23,32,27,.22);
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.52}
[hidden]{display:none!important}
::selection{background:var(--primary-container);color:var(--ink)}

/* APP SHELL */
.app{min-height:100vh;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;z-index:50;display:flex;flex-direction:column;padding:18px 14px;background:#18352a;color:#f7fbf8;border-right:1px solid rgba(255,255,255,.08)}
.brand{padding:8px 10px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{font-weight:760;font-size:16px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.brand-mark span{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#dcebe3;color:#24513f;font-size:13px}
.brand-sub{margin-top:4px;color:rgba(247,251,248,.58);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px;padding:18px 0;overflow:auto}
.nav-btn{width:100%;min-height:42px;display:flex;align-items:center;gap:11px;padding:0 11px;border:0;border-radius:10px;background:transparent;color:rgba(247,251,248,.72);text-align:left;font-size:12.5px;font-weight:600;transition:background .14s ease,color .14s ease}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:#eef7f1;color:#173a2c}
.nav-ico{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.08);font-size:12px}
.nav-btn.active .nav-ico{background:#d9eadf;color:#24513f}
.sidebar-foot{margin-top:auto;padding:14px 10px 6px;color:rgba(247,251,248,.53);font-size:9.5px;line-height:1.65;border-top:1px solid rgba(255,255,255,.10)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#63c78c;margin-right:6px;box-shadow:0 0 0 3px rgba(99,199,140,.12)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:40;height:var(--top-h);display:flex;align-items:center;gap:18px;padding:0 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.menu-btn{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:18px}
.searchbox{position:relative;flex:1;max-width:640px}
.searchbox:before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-52%);color:var(--muted);font-size:20px;pointer-events:none}
.searchbox input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface-1);padding:0 14px 0 39px;outline:0;font-size:12.5px;transition:border .12s,background .12s,box-shadow .12s}
.searchbox input:hover{border-color:var(--line-strong);background:#fff}
.searchbox input:focus{background:#fff;border-color:var(--focus);box-shadow:0 0 0 3px rgba(79,126,105,.14)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;min-height:28px;border:1px solid var(--line);border-radius:999px;padding:0 10px;background:var(--surface-1);color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.04em}
.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--primary);color:#fff;font-size:10px;font-weight:800;letter-spacing:.04em}
.content{width:100%;max-width:var(--content-max);margin:0 auto;padding:30px 32px 80px}
.view{display:none}.view.active{display:block}

/* TYPOGRAPHY + PAGE HEADERS */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.page-head h2{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.035em;font-weight:730}
.page-head p{max-width:760px;margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.section-label,.section-kicker,.mono{font-family:var(--font-mono);font-size:9.5px;line-height:1.4;letter-spacing:.095em;text-transform:uppercase;color:var(--muted)}
.section-title{margin:5px 0 16px;font-size:20px;line-height:1.25;letter-spacing:-.02em;font-weight:720}
.section-lead{max-width:760px;margin:-8px 0 16px;color:var(--muted);font-size:11px;line-height:1.58}
.sub{color:var(--muted);font-size:10.5px;line-height:1.45}
.title{font-weight:700}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* BUTTON SYSTEM */
.btn{appearance:none;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:0 15px;background:transparent;color:var(--ink);font-size:12px;font-weight:690;line-height:1;white-space:nowrap;transition:background .12s,border .12s,color .12s,transform .08s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn-primary,.btn-dark{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not(:disabled),.btn-dark:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-primary:active:not(:disabled),.btn-dark:active:not(:disabled){background:var(--primary-pressed)}
.btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-outline:hover:not(:disabled){border-color:#85968c;background:var(--surface-1)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-danger{background:transparent;border-color:#ecc5c2;color:var(--danger)}
.btn-danger:hover:not(:disabled){background:var(--danger-container);border-color:#dfaaa6}
.btn-white{background:#fff;color:var(--ink);border-color:#fff}
.btn-sm{min-height:34px;padding:0 11px;border-radius:8px;font-size:10.5px}
.close-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font-size:15px}
.close-btn:hover{background:var(--surface-2);color:var(--ink)}
button:focus-visible,.btn:focus-visible,.nav-btn:focus-visible,.order-tab:focus-visible,.choice-btn:focus-visible,.customer-picker-btn:focus-visible,.picker-item:focus-visible,.micro-action:focus-visible,.row-button:focus-visible,.ops-row:focus-visible,.action-tile:focus-visible{outline:3px solid rgba(79,126,105,.28);outline-offset:2px}

/* SURFACES / CARDS / DASHBOARD */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel{padding:20px}
.panel-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.panel-title h3{margin:2px 0 0;font-size:17px;line-height:1.3;letter-spacing:-.015em}
.recovery-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px;padding:13px 15px;border:1px solid #cad9cf;border-radius:12px;background:#eff7f2}
.recovery-banner p{margin:0;font-size:11px;color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{min-width:0;padding:17px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--line-strong)}
.kpi-primary:before{background:var(--primary)}
.kpi-label{color:var(--muted);font-size:9.5px;font-weight:670;line-height:1.4;min-height:27px}
.kpi-value{margin-top:6px;font-size:23px;line-height:1.15;font-weight:760;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-note{margin-top:6px;color:var(--subtle);font-size:8.8px;line-height:1.4}
.dashboard-command,.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:12px;margin-top:12px}
.action-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.action-tile{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-1);text-align:left;color:var(--ink);transition:border .12s,background .12s,transform .08s}
.action-tile:hover{background:#fff;border-color:var(--line-strong);transform:translateY(-1px)}
.action-tile span{min-width:0}.action-tile b{display:block;font-size:11.5px}.action-tile small{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.35}.action-tile strong{min-width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--surface-2);font-size:16px}
.action-tile.urgent strong{background:var(--warning-container);color:var(--warning)}
.action-tile.production strong{background:var(--primary-container);color:var(--primary)}
.action-tile.delivery strong{background:var(--info-container);color:var(--info)}
.ops-queue,.list,.attention-list{display:flex;flex-direction:column}
.ops-row,.row-button,.list-row{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:54px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:inherit}
.ops-row:last-child,.row-button:last-child,.list-row:last-child{border-bottom:0}
.ops-row:hover,.row-button:hover{background:var(--surface-1)}
.ops-row b,.row-button b{font-size:11px}.ops-row small,.row-button small{display:block;margin-top:2px;color:var(--muted);font-size:9px}.due{color:var(--muted);font-size:9.5px;white-space:nowrap}

/* FILTERS + TABS */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.toolbar>.input{flex:1;min-width:220px}.toolbar>.select{width:auto;min-width:160px}
.order-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 10px;margin-bottom:4px;scrollbar-width:thin}
.order-tab{min-height:36px;white-space:nowrap;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--muted);font-size:10.5px;font-weight:680}
.order-tab:hover{border-color:var(--line-strong);color:var(--ink)}
.order-tab.active{background:var(--primary-container);border-color:#b9d2c3;color:var(--primary)}

/* TABLE / DATA COLLECTION */
.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.table{width:100%;min-width:900px;border-collapse:separate;border-spacing:0}
.table th{position:sticky;top:0;z-index:2;padding:10px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);color:var(--muted);text-align:left;font-size:9px;font-weight:760;letter-spacing:.055em;text-transform:uppercase}
.table td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:11px;color:var(--text)}
.table tr:last-child td{border-bottom:0}.table tbody tr:hover td{background:#f9fbf9}.table td .sub{margin-top:2px}.table .num,.table td.money{text-align:right;font-variant-numeric:tabular-nums}
.order-mobile-list{display:none}
.order-mobile-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;margin-bottom:8px}.order-mobile-card .head{display:flex;justify-content:space-between;gap:12px}.order-mobile-card .title{font-size:13px}.order-mobile-card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.order-mobile-card .foot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

/* BADGES / STATUS */
.badge,.status-pill,.tag,.composition-status{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:24px;border:1px solid var(--line);border-radius:999px;padding:0 8px;background:var(--surface-2);color:var(--text);font-size:9px;font-weight:720;line-height:1}
.badge.success{background:var(--success-container);border-color:#c6e3d2;color:var(--success)}
.badge.warn{background:var(--warning-container);border-color:#eddbb8;color:var(--warning)}
.badge.danger{background:var(--danger-container);border-color:#efc8c5;color:var(--danger)}
.badge.orange,.badge.dark{background:var(--primary);border-color:var(--primary);color:#fff}
.status-pill{min-height:34px;padding:0 11px;background:var(--surface);border-color:var(--line-strong);color:var(--muted)}
.status-pill.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* FORM ARCHITECTURE */
.order-summary{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.form-shell{min-width:0;display:flex;flex-direction:column;gap:10px;background:transparent;border:0}
.form-section{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:21px 22px}
.form-section:before{content:"";position:absolute;left:-1px;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--surface-3)}
.form-section:has(.section-kicker:first-child):before{background:#bdd4c6}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.form-subgrid,.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.full{grid-column:1/-1}
.core-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.core-form-grid .full{grid-column:1/-1}
.field,.choice-block{min-width:0;display:flex;flex-direction:column;gap:6px}
.field label,.choice-label{display:flex;align-items:center;gap:4px;color:var(--text);font-size:11px;font-weight:700;line-height:1.35}
.req{color:var(--danger);font-size:0}.req:before{content:"*";font-size:12px;font-weight:800}
.field-hint,.choice-hint{order:5;color:var(--muted);font-size:9px;line-height:1.45}
.field-error{display:none;order:6;color:var(--danger);font-size:9px;line-height:1.45}
.field.has-error .field-error{display:block}
.form-note{margin:0 0 12px;color:var(--muted);font-size:9.5px}
.input,.select,.textarea{width:100%;min-width:0;appearance:none;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);padding:10px 12px;outline:0;font-size:12.5px;line-height:1.35;box-shadow:none;transition:border .12s,box-shadow .12s,background .12s}
.input,.select{height:var(--control-h)}
.select{padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 18px,calc(100% - 12px) 18px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.textarea{min-height:88px;resize:vertical}
.input::placeholder,.textarea::placeholder{color:#98a29d}
.input:hover,.select:hover,.textarea:hover{border-color:#8fa098}
.input:focus,.select:focus,.textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(79,126,105,.14)}
.field.has-error .input,.field.has-error .select,.field.has-error .textarea{border-color:var(--danger);box-shadow:0 0 0 3px rgba(177,61,61,.10)}
.input:disabled,.select:disabled,.textarea:disabled{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.input-prefix-wrap,.input-suffix-wrap{position:relative}.input-prefix-wrap .input{padding-left:36px}.input-suffix-wrap .input{padding-right:42px}.input-prefix,.input-suffix{position:absolute;top:50%;transform:translateY(-50%);z-index:2;color:var(--muted);font-size:10.5px;font-weight:700;pointer-events:none}.input-prefix{left:12px}.input-suffix{right:12px}

/* CHOICE CONTROLS */
.choice-group{display:flex;gap:6px;flex-wrap:wrap}
.choice-btn{min-height:38px;border:1px solid var(--line-strong);border-radius:9px;padding:0 12px;background:var(--surface);color:var(--text);font-size:10.5px;font-weight:690;transition:background .12s,border .12s,color .12s}
.choice-btn:hover:not(:disabled){background:var(--surface-1);border-color:#8fa098}
.choice-btn.active{background:var(--primary-container);border-color:#a7c7b5;color:var(--primary)}
.choice-group.segmented{display:inline-flex;align-self:flex-start;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;gap:2px}
.choice-group.segmented .choice-btn{border:0;border-radius:8px;background:transparent;min-height:34px}
.choice-group.segmented .choice-btn.active{background:var(--surface);color:var(--primary);box-shadow:0 1px 4px rgba(23,32,27,.10)}

/* CUSTOMER PICKER */
.customer-select{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.customer-picker-btn{min-height:52px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);text-align:left}
.customer-picker-btn:hover{border-color:#8fa098;background:var(--surface-1)}
.customer-picker-main{min-width:0}.customer-picker-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}.customer-picker-main small{display:block;margin-top:2px;color:var(--muted);font-size:9.5px}.customer-picker-empty{color:var(--muted)!important;font-weight:650!important}
.picker-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:380px;overflow:auto}
.picker-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.picker-item:hover{background:var(--surface-1);border-color:var(--line-strong)}.picker-item b{font-size:11px}.picker-item small{display:block;color:var(--muted);font-size:9px;margin-top:2px}

/* PROGRESSIVE DISCLOSURE */
.advanced-panel{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-1);overflow:hidden}
.advanced-panel>summary{min-height:44px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 13px;cursor:pointer;color:var(--text);font-size:10.5px;font-weight:720}
.advanced-panel>summary::-webkit-details-marker{display:none}.advanced-panel>summary:after{content:"＋";margin-left:auto;color:var(--muted);font-size:15px;font-weight:400}.advanced-panel[open]>summary:after{content:"−"}
.advanced-summary-meta{margin-left:auto;color:var(--muted);font-size:8.8px;font-weight:500}.advanced-panel[open]>summary{border-bottom:1px solid var(--line)}.advanced-body{padding:14px;background:var(--surface)}

/* ORDER SUMMARY / STICKY CONTEXT */
.summary-box{position:sticky;top:calc(var(--top-h) + 16px);padding:18px;border:1px solid #2d604b;border-radius:16px;background:#1f4938;color:#fff;box-shadow:none}
.summary-box .mono{color:rgba(255,255,255,.55)}.summary-box h3{margin:5px 0 14px;font-size:16px;letter-spacing:-.02em}.sum-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.70);font-size:10px}.sum-row b{color:#fff;font-variant-numeric:tabular-nums}.sum-row.total{margin-top:5px;padding-top:12px;border-bottom:0;font-size:14px}.sum-row.total b{font-size:20px}.summary-actions{display:flex;flex-direction:column;gap:7px;margin-top:14px}.summary-actions .btn{width:100%}.summary-lock{margin-top:10px;padding:9px;border-radius:9px;background:rgba(255,255,255,.08);font-size:9px;color:rgba(255,255,255,.72)}

/* PRODUCTS / FLOWERS */

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">MADE MY DAY <span>✿</span></div><div class="brand-sub">Studio Backoffice</div></div>

  </aside>
  <main class="main">
    <header class="topbar"><button class="menu-btn" onclick="toggleSidebar()">☰</button><div class="searchbox"><input id="globalSearch" placeholder="ค้นหาออเดอร์ ลูกค้า หรือสินค้า..." oninput="globalSearch(this.value)"></div><div class="top-right"><div class="chip">V3 · Floral Atelier</div><div class="avatar">MD</div></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"><div id="modalContent"></div></div></div>
<div class="doc-overlay" id="docOverlay"><div class="doc-toolbar"><button class="btn btn-white" onclick="window.print()">พิมพ์ / บันทึก PDF</button><button class="btn btn-dark" onclick="closeDocument()">ปิด</button></div><div class="doc-pages" id="docPages"></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='mmd_fullfunction_v1_2';
const LEGACY_KEY='mmd_fullfunction_v1';
const NAV=[['dashboard','◒','ภาพรวม'],['orders','▤','ออเดอร์'],['customers','◎','ลูกค้า / CRM'],['templates','◇','สินค้า / แบบช่อ'],['flowers','✿','รายการดอกไม้'],['analytics','↗','วิเคราะห์'],['settings','⚙','ตั้งค่า']];
const QUICK_COLORS=['#fffaf0','#f3b6c4','#ef8c73','#f3cc55','#b69ad7','#8fb7d8'];
const money=n=>new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0));
const num=n=>Number(n||0);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
const e=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const localYMD=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const today=()=>localYMD(new Date());
const addDays=(date,days)=>{const [y,m,dn]=date.split('-').map(Number);let d=new Date(y,m-1,dn,12,0,0);d.setDate(d.getDate()+Number(days||0));return localYMD(d)};
const fmtDate=s=>{if(!s)return'-';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'})};
function seed(){return {seq:{order:1003,quote:26,invoice:12,receipt:8,delivery:10,tax:6},settings:{company:'MADE MY DAY STUDIO',legalName:'MADE MY DAY STUDIO',address:'กรุงเทพมหานคร ประเทศไทย',taxId:'',branch:'สำนักงานใหญ่',phone:'',email:'',instagram:'@mademyday_studio',line:'@mademyday.bkk',bankName:'',bankAccount:'',bankNo:'',quotePrefix:'QT',invoicePrefix:'INV',receiptPrefix:'RC',deliveryPrefix:'DN',taxPrefix:'TAX',quoteValidDays:7,vatEnabled:false,vatRate:7,terms:'ราคานี้มีอายุตามวันที่ระบุในใบเสนอราคา การยืนยันงานถือเป็นการยืนยันรายละเอียดสินค้า ราคา และกำหนดส่ง กรุณาชำระตามเงื่อนไขที่ตกลงก่อนเริ่มจัดทำงาน'},flowers:[
{id:uid(),name:'Hydrangea',unit:'ดอก',note:'ดอกฟอร์มใหญ่ ใช้สร้าง Volume'},
{id:uid(),name:'Rose',unit:'ดอก',note:'ใช้ได้หลายสไตล์และหลายโอกาส'},
{id:uid(),name:'Scabiosa',unit:'ก้าน',note:'ดอกทรงโปร่ง ใช้สร้าง Movement'},
{id:uid(),name:'Amaranthus',unit:'ก้าน',note:'ใช้สร้างเส้นสายและการไหล'},
{id:uid(),name:'Eucalyptus',unit:'ก้าน',note:'ใบประกอบ'}],customers:[
{id:uid(),type:'บุคคล',name:'คุณพิม',contactName:'คุณพิม',phone:'081-234-5678',email:'',taxId:'',branch:'',address:'กรุงเทพฯ',channel:'Instagram',tags:['Pastel','Anniversary'],notes:''},
{id:uid(),type:'บริษัท',name:'BLOOM EVENT CO., LTD.',contactName:'คุณเจน',phone:'089-555-2121',email:'hello@bloom-event.test',taxId:'0105559999999',branch:'สำนักงานใหญ่',address:'กรุงเทพฯ',channel:'Referral',tags:['Event'],notes:''}],templates:[],orders:[]};}
let state=load();let currentView='dashboard';let editingOrderId=null;let draftOrder=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));if(window.mmdQueueCloudSave)window.mmdQueueCloudSave()}
function toast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',2200)}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="nav-btn ${currentView===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="nav-ico">${n[1]}</span>${n[2]}</button>`).join('')}
function go(v){currentView=v;editingOrderId=null;draftOrder=null;render();document.getElementById('sidebar').classList.remove('open');document.body.classList.remove('nav-open')}
function toggleSidebar(){const sb=document.getElementById('sidebar');sb.classList.toggle('open');document.body.classList.toggle('nav-open',sb.classList.contains('open'))}
function render(){renderNav();const c=document.getElementById('content');if(currentView==='dashboard')c.innerHTML=renderDashboard();if(currentView==='orders')c.innerHTML=renderOrders();if(currentView==='customers')c.innerHTML=renderCustomers();if(currentView==='templates')c.innerHTML=renderTemplates();if(currentView==='flowers')c.innerHTML=renderFlowers();if(currentView==='analytics')c.innerHTML=renderAnalytics();if(currentView==='settings')c.innerHTML=renderSettings();if(currentView==='orderEdit')c.innerHTML=renderOrderEditor();}
function deliveryTotal(o){return (o.deliveries||[]).reduce((s,d)=>s+num(d.fee),0)}
function orderTotal(o){const products=(o.products||[]);let productSubtotal=products.reduce((s,p)=>s+productNet(p),0);let delivery=deliveryTotal(o);let subtotal=productSubtotal+delivery;let discount=num(o.orderDiscount);let base=Math.max(0,subtotal-discount);let vat=(o.vatEnabled?base*num(o.vatRate)/100:0);return {productSubtotal,delivery,subtotal,discount,base,vat,total:base+vat}}
function deliveryDateText(o){const ds=(o.deliveries||[]).filter(d=>d.date).sort((a,b)=>a.date.localeCompare(b.date));if(!ds.length)return '-';if(ds.length===1)return fmtDate(ds[0].date)+(ds[0].time?' '+ds[0].time:'');return fmtDate(ds[0].date)+' +'+(ds.length-1)+' จุดส่ง'}
function deliveryName(id){const d=(draftOrder?.deliveries||[]).find(x=>x.id===id);return d?(d.recipient||'จุดส่ง'):'ยังไม่กำหนด'}
function productNet(p){let gross=num(p.qty||1)*num(p.unitPrice);let d=p.discountType==='percent'?gross*num(p.discountValue)/100:num(p.discountValue);return Math.max(0,gross-d)}
function paid(o){return (o.payments||[]).reduce((s,p)=>s+num(p.amount),0)}
function confirmedOrders(){return state.orders.filter(o=>['confirmed','active','completed'].includes(o.status))}
function statusBadge(o){const m={draft:['ร่าง',''],quoted:['เสนอราคาแล้ว','warn'],confirmed:['ยืนยันแล้ว','success'],active:['กำลังดำเนินการ','orange'],completed:['เสร็จสิ้น','dark'],cancelled:['ยกเลิก','danger']};let x=m[o.status]||m.draft;return `<span class="badge ${x[1]}">${x[0]}</span>`}
function renderDashboard(){const confirmed=confirmedOrders();const sales=confirmed.reduce((s,o)=>s+orderTotal(o).total,0);const outstanding=confirmed.reduce((s,o)=>s+Math.max(0,orderTotal(o).total-paid(o)),0);const quotes=state.orders.filter(o=>o.status==='quoted').length;const todayDue=state.orders.filter(o=>(o.deliveries||[]).some(d=>d.date===today())&&!['cancelled','completed'].includes(o.status));const avg=confirmed.length?sales/confirmed.length:0;const recent=[...state.orders].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,6);return `
<div class="hero"><div class="hero-copy"><small>MADE MY DAY STUDIO / TODAY</small><h1>หลังบ้านที่เบา<br>เพื่อให้งานดอกไม้เด่น</h1><p>ออเดอร์ ลูกค้า เอกสาร การชำระเงิน และสูตรดอกไม้ อยู่ใน flow เดียวกันโดยไม่ทำให้หน้าจอรก</p><div class="hero-actions"><button class="btn btn-primary" onclick="newOrder()">+ สร้างออเดอร์</button><button class="btn btn-outline" onclick="go('orders')">ดูออเดอร์ทั้งหมด</button></div></div><div class="hero-flower" aria-hidden="true"><span>✿</span><b>${todayDue.length}</b><small>ส่งวันนี้</small></div></div>
<div class="section-label">ภาพรวมธุรกิจ</div><div class="kpis">
${[['ยอดขายยืนยัน','฿'+money(sales),'ยอดจากออเดอร์ที่ยืนยันแล้ว'],['ค้างรับ','฿'+money(outstanding),'ยอดที่ยังไม่ได้รับชำระ'],['เฉลี่ยต่อออเดอร์','฿'+money(avg),'Average Order Value'],['ออเดอร์',''+confirmed.length,'ยืนยัน / กำลังทำ / เสร็จ'],['รอคำตอบราคา',''+quotes,'ใบเสนอราคาที่ยังไม่ปิด'],['ฐานลูกค้า',''+state.customers.length,'ลูกค้าที่บันทึกไว้']].map((x,i)=>`<div class="card kpi ${i<3?'kpi-primary':'kpi-secondary'}"><div class="kpi-label">${x[0]}</div><div class="kpi-value">${x[1]}</div><div class="kpi-note">${x[2]}</div></div>`).join('')}
</div>
<div class="dashboard-grid"><div class="card panel recent-panel"><div class="panel-title"><div><div class="section-label">ล่าสุด</div><h3>ออเดอร์ที่กำลังเคลื่อนไหว</h3></div><button class="btn btn-ghost btn-sm" onclick="go('orders')">ดูทั้งหมด →</button></div>${recent.length?`<div class="list">${recent.map(o=>`<button class="list-row row-button" onclick="editOrder('${o.id}')"><div><div class="title">${e(o.title||customerName(o.customerId))}</div><div class="sub">${e(o.orderNo)} · ${e(customerName(o.customerId))} · ส่ง ${deliveryDateText(o)}</div><div class="row-status">${statusBadge(o)}</div></div><div class="money">฿${money(orderTotal(o).total)}</div></button>`).join('')}</div>`:'<div class="empty">ยังไม่มีออเดอร์<br><span class="sub">เริ่มจากออเดอร์แรก แล้ว Dashboard จะสรุปสิ่งที่ต้องทำให้เอง</span></div>'}</div>
<div class="card panel attention-panel"><div class="panel-title"><div><div class="section-label">Focus</div><h3>สิ่งที่ควรจัดการก่อน</h3></div></div><div class="attention-list"><button onclick="go('orders')"><span><b>ใบเสนอราคารอคำตอบ</b><small>ติดตามเพื่อปิดการขาย</small></span><strong>${quotes}</strong></button><button onclick="go('orders')"><span><b>ยอดค้างรับ</b><small>จากออเดอร์ที่ยืนยันแล้ว</small></span><strong>฿${money(outstanding)}</strong></button><button onclick="go('orders')"><span><b>กำหนดส่งวันนี้</b><small>เช็กความพร้อมก่อนจัดส่ง</small></span><strong>${todayDue.length}</strong></button></div></div></div>`}
function customerName(id){return state.customers.find(c=>c.id===id)?.name||'ลูกค้าทั่วไป'}
function renderOrders(){let rows=[...state.orders].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));return `<div class="page-head"><div><h2>ออเดอร์</h2><p>หนึ่งออเดอร์เพิ่มได้หลายสินค้า และแต่ละสินค้าจะมีสูตรดอกไม้/สีของตัวเอง</p></div><div class="actions"><button class="btn btn-primary" onclick="newOrder()">+ สร้างออเดอร์</button></div></div><div class="toolbar"><input class="input" id="orderSearch" placeholder="ค้นหาเลขออเดอร์ / ลูกค้า / ชื่องาน" oninput="filterOrderRows(this.value)"><select class="select" id="orderStatusFilter" onchange="filterOrderRows(document.getElementById('orderSearch').value)"><option value="">ทุกสถานะ</option><option value="draft">ร่าง</option><option value="quoted">เสนอราคาแล้ว</option><option value="confirmed">ยืนยันแล้ว</option><option value="active">กำลังทำ</option><option value="completed">เสร็จสิ้น</option><option value="cancelled">ยกเลิก</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>เลขออเดอร์</th><th>ลูกค้า / งาน</th><th>รายการสินค้า</th><th>กำหนดส่ง</th><th>สถานะ</th><th>ชำระ</th><th>ยอดสุทธิ</th><th></th></tr></thead><tbody id="orderRows">${orderRows(rows)}</tbody></table></div>`}
function orderRows(rows){return rows.map(o=>`<tr data-search="${e((o.orderNo+' '+customerName(o.customerId)+' '+(o.title||'')).toLowerCase())}" data-status="${o.status}"><td><b>${e(o.orderNo)}</b><div class="sub">${e(o.quoteNo||'ยังไม่ออกใบเสนอราคา')}</div></td><td><b>${e(customerName(o.customerId))}</b><div class="sub">${e(o.title||'-')} · ${e(o.source||'-')}</div></td><td>${(o.products||[]).length} สินค้า<div class="sub">${(o.products||[]).reduce((s,p)=>s+(p.flowers||[]).length,0)} รายการดอกไม้ภายใน</div></td><td>${deliveryDateText(o)}<div class="sub">${(o.deliveries||[]).length} จุดส่ง</div></td><td>${statusBadge(o)}</td><td>฿${money(paid(o))}<div class="sub">คงเหลือ ฿${money(Math.max(0,orderTotal(o).total-paid(o)))}</div></td><td class="money">฿${money(orderTotal(o).total)}</td><td><div class="actions"><button class="btn btn-outline btn-sm" onclick="editOrder('${o.id}')">เปิด</button><button class="btn btn-ghost btn-sm" onclick="duplicateOrder('${o.id}')">ทำซ้ำ</button></div></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">ยังไม่มีออเดอร์ กด “สร้างออเดอร์” เพื่อเริ่มงานแรก</div></td></tr>`}
function duplicateOrder(id){const src=state.orders.find(o=>o.id===id);if(!src)return;const o=structuredClone(src);o.id=uid();o.orderNo='ORD-'+(++state.seq.order);o.quoteNo='';o.invoiceNo='';o.deliveryNo='';o.receiptNo='';o.taxNo='';o.status='draft';o.quoteStatus='draft';o.paymentStatus='unpaid';o.payments=[];o.createdAt=new Date().toISOString();o.updatedAt=o.createdAt;o.products.forEach(p=>p.id=uid());o.deliveries=(o.deliveries||[]).map(d=>({...d,id:uid()}));o.products.forEach(p=>p.deliveryId='');state.orders.push(o);save();editOrder(o.id);toast('ทำสำเนาออเดอร์แล้ว','success')}
function filterOrderRows(q=''){q=q.toLowerCase();const st=document.getElementById('orderStatusFilter')?.value||'';document.querySelectorAll('#orderRows tr[data-search]').forEach(r=>r.style.display=((!q||r.dataset.search.includes(q))&&(!st||r.dataset.status===st))?'':'none')}
function blankOrder(){return {id:uid(),orderNo:'ORD-'+(++state.seq.order),date:today(),validUntil:addDays(today(),state.settings.quoteValidDays),customerId:'',source:'Instagram',jobType:'Bouquet',title:'',deliveries:[{id:uid(),recipient:'',phone:'',address:'',date:'',time:'',fee:0}],note:'',internalNote:'',orderDiscount:0,vatEnabled:!!state.settings.vatEnabled,vatRate:num(state.settings.vatRate||7),status:'draft',quoteStatus:'draft',paymentStatus:'unpaid',products:[],payments:[],eventCosts:[],documents:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function newOrder(){editingOrderId=null;draftOrder=blankOrder();currentView='orderEdit';render()}
function editOrder(id){editingOrderId=id;draftOrder=structuredClone(state.orders.find(o=>o.id===id));currentView='orderEdit';render()}
function syncOrderFields(){if(!draftOrder)return;document.querySelectorAll('[data-order-field]').forEach(el=>{let k=el.dataset.orderField;if(el.type==='checkbox')draftOrder[k]=el.checked;else if(k==='vatEnabled')draftOrder[k]=el.value==='true';else draftOrder[k]=el.value});draftOrder.orderDiscount=num(draftOrder.orderDiscount);draftOrder.vatRate=num(draftOrder.vatRate);renderOrderSummaryOnly()}
function renderOrderEditor(){const o=draftOrder;if(!o)return'';return `<div class="page-head"><div><h2>${editingOrderId?'แก้ไขออเดอร์':'สร้างออเดอร์ใหม่'}</h2><p>${e(o.orderNo)} · โครงสร้าง: Order → Product → Flower Composition</p></div><div class="actions"><button class="btn btn-ghost" onclick="go('orders')">กลับ</button><button class="btn btn-dark" onclick="saveOrderDraft()">บันทึก</button></div></div><div class="order-summary"><div class="form-shell">
<div class="form-section"><div class="section-kicker">01 / Order Details</div><div class="section-title">รายละเอียดออเดอร์</div><div class="form-grid">
${field('ลูกค้า',`<select class="select" data-order-field="customerId" onchange="syncOrderFields();prefillRecipient()"><option value="">เลือกลูกค้า</option>${state.customers.map(c=>`<option value="${c.id}" ${o.customerId===c.id?'selected':''}>${e(c.name)}</option>`).join('')}</select><div class="helper"><button class="btn btn-ghost btn-sm" type="button" onclick="openCustomerModal(true)">+ เพิ่มลูกค้าใหม่</button></div>`,2)}
${field('ชื่องาน / Occasion',`<input class="input" data-order-field="title" value="${e(o.title)}" placeholder="เช่น Anniversary Bouquet" oninput="syncOrderFields()">`,2)}
${field('ช่องทาง',`<select class="select" data-order-field="source" onchange="syncOrderFields()">${['Instagram','LINE','โทรศัพท์ส่วนตัว','Referral','Walk-in','อื่นๆ'].map(x=>`<option ${o.source===x?'selected':''}>${x}</option>`).join('')}</select>`)}
${field('ประเภทงาน',`<select class="select" data-order-field="jobType" onchange="syncOrderFields()">${['Bouquet','Arrangement','Event','Other'].map(x=>`<option ${o.jobType===x?'selected':''}>${x}</option>`).join('')}</select>`)}
${field('วันที่เอกสาร',`<input type="date" class="input" data-order-field="date" value="${e(o.date)}" onchange="syncOrderFields()">`)}
${field('ใบเสนอราคาถึงวันที่',`<input type="date" class="input" data-order-field="validUntil" value="${e(o.validUntil)}" onchange="syncOrderFields()">`)}
</div></div>
<div class="form-section"><div class="section-kicker">02 / Products</div><div class="section-title">สินค้าในออเดอร์</div><div class="product-stack">${renderDraftProducts(o)}</div><div style="margin-top:12px"><button class="btn btn-primary" onclick="openProductModal()">+ เพิ่มสินค้า</button></div></div>
<div class="form-section"><div class="section-kicker">03 / Fulfillment</div><div class="section-title">การจัดส่ง / ผู้รับ</div><div class="form-grid">
<div class="field full"><div id="deliveryEditor">${renderDeliveryEditor(o)}</div><button class="btn btn-ghost btn-sm" type="button" onclick="addDelivery()">+ เพิ่มจุดส่ง</button></div>
</div></div>
<div class="form-section"><div class="section-kicker">04 / Finance & Notes</div><div class="section-title">ราคาและหมายเหตุ</div><div class="form-grid">${field('ส่วนลดท้ายบิล',`<input type="number" min="0" class="input" data-order-field="orderDiscount" value="${num(o.orderDiscount)}" oninput="syncOrderFields()">`)}${field('VAT',`<select class="select" data-order-field="vatEnabled" onchange="draftOrder.vatEnabled=this.value==='true';renderOrderSummaryOnly()"><option value="false" ${!o.vatEnabled?'selected':''}>ไม่คิด VAT</option><option value="true" ${o.vatEnabled?'selected':''}>คิด VAT</option></select>`)}${field('อัตรา VAT (%)',`<input type="number" step="0.01" min="0" class="input" data-order-field="vatRate" value="${num(o.vatRate)}" oninput="syncOrderFields()">`)}${field('สถานะ',`<select class="select" data-order-field="status" onchange="syncOrderFields()">${['draft','quoted','confirmed','active','completed','cancelled'].map(x=>`<option value="${x}" ${o.status===x?'selected':''}>${({draft:'ร่าง',quoted:'เสนอราคาแล้ว',confirmed:'ยืนยันแล้ว',active:'กำลังดำเนินการ',completed:'เสร็จสิ้น',cancelled:'ยกเลิก'})[x]}</option>`).join('')}</select>`)}${field('หมายเหตุสำหรับลูกค้า',`<textarea class="textarea" data-order-field="note" oninput="syncOrderFields()">${e(o.note)}</textarea>`,2)}${field('โน้ตภายในร้าน',`<textarea class="textarea" data-order-field="internalNote" oninput="syncOrderFields()">${e(o.internalNote)}</textarea>`,2)}</div>
${o.jobType==='Event'?`<div style="margin-top:18px"><div class="section-title" style="font-size:16px">ต้นทุนงาน Event (ข้อมูลภายใน)</div><div id="eventCosts">${renderEventCosts(o)}</div><button class="btn btn-ghost btn-sm" onclick="addEventCost()">+ เพิ่มต้นทุน</button></div>`:''}
</div>
${editingOrderId?`<div class="form-section"><div class="section-kicker">05 / Payment & Documents</div><div class="section-title">การชำระเงินและเอกสาร</div>${renderPaymentSection(o)}</div>`:''}
</div><div id="orderSummary">${renderOrderSummary(o)}</div></div>`}
function field(label,html,span=1){return `<div class="field ${span===2?'span2':span===3?'span3':span===4?'full':''}"><label>${label}</label>${html}</div>`}
function renderDraftProducts(o){if(!(o.products||[]).length)return '<div class="empty">ยังไม่มีสินค้าในออเดอร์<br><span class="sub">เพิ่ม “สินค้า” ก่อน แล้วค่อยเลือกดอกไม้และสีภายในสินค้าแต่ละชิ้น</span></div>';return o.products.map((p,i)=>`<div class="order-product"><div class="order-product-head"><div><div class="order-product-name">${i+1}. ${e(p.name)}</div><div class="sub">${e(p.type||'สินค้า')} · ${num(p.qty||1)} ${e(p.unit||'ชิ้น')} × ฿${money(p.unitPrice)} · ส่ง: ${e(deliveryName(p.deliveryId))}</div></div><div><div class="order-product-price">฿${money(productNet(p))}</div><div class="actions" style="justify-content:flex-end;margin-top:7px"><button class="btn btn-ghost btn-sm" onclick="openProductModal('${p.id}')">แก้ไข</button><button class="btn btn-danger btn-sm" onclick="removeDraftProduct('${p.id}')">ลบ</button></div></div></div><div class="composition"><div class="composition-label">สูตรดอกไม้ภายใน — ไม่แสดงในเอกสารลูกค้า</div><div class="composition-chips">${(p.flowers||[]).map(f=>`<span class="flower-chip"><i class="color-dot" style="background:${e(f.color||'#ddd')}"></i>${e(f.flowerName)} ${num(f.qty)} ${e(f.unit||'')} · ${e(f.family||'-')} / ${e(f.tone||'-')} · ${num(f.ratio||0)}%</span>`).join('')||'<span class="sub">ไม่มีสูตรดอกไม้</span>'}</div></div></div>`).join('')}
function renderOrderSummary(o){const t=orderTotal(o);return `<aside class="summary-box"><div class="mono">ORDER SUMMARY</div><h3>${e(o.orderNo)}</h3><div class="sum-row"><span>สินค้า</span><b>${(o.products||[]).length} รายการ</b></div><div class="sum-row"><span>รวมสินค้า</span><b>฿${money(t.productSubtotal)}</b></div><div class="sum-row"><span>ค่าจัดส่ง (${(o.deliveries||[]).length} จุด)</span><b>฿${money(t.delivery)}</b></div><div class="sum-row"><span>ส่วนลด</span><b>- ฿${money(t.discount)}</b></div>${o.vatEnabled?`<div class="sum-row"><span>VAT ${num(o.vatRate)}%</span><b>฿${money(t.vat)}</b></div>`:''}<div class="sum-row total"><span>ยอดสุทธิ</span><span>฿${money(t.total)}</span></div>${editingOrderId?`<div class="sum-row"><span>รับชำระแล้ว</span><b>฿${money(paid(o))}</b></div><div class="sum-row"><span>คงเหลือ</span><b>฿${money(Math.max(0,t.total-paid(o)))}</b></div>`:''}<div class="summary-actions"><button class="btn btn-white" onclick="saveOrderDraft()">บันทึกออเดอร์</button>${editingOrderId?`<button class="btn btn-primary" onclick="issueQuotation()">${o.quoteNo?'ดูใบเสนอราคา':'ออกใบเสนอราคา'}</button><button class="btn btn-outline" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)" onclick="openDocumentsMenu()">เอกสารทั้งหมด</button>`:''}</div></aside>`}
function renderOrderSummaryOnly(){const el=document.getElementById('orderSummary');if(el)el.innerHTML=renderOrderSummary(draftOrder)}
function prefillRecipient(){const c=state.customers.find(c=>c.id===draftOrder.customerId);const d=(draftOrder.deliveries||[])[0];if(c&&d&&!d.recipient){d.recipient=c.contactName||c.name;d.phone=c.phone||'';d.address=c.address||'';render()}}
function saveOrderDraft(){syncOrderFields();if(!draftOrder.customerId){toast('กรุณาเลือกลูกค้าก่อน','danger');return}if(!(draftOrder.products||[]).length){toast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ','danger');return}draftOrder.updatedAt=new Date().toISOString();const idx=state.orders.findIndex(x=>x.id===draftOrder.id);if(idx>=0)state.orders[idx]=structuredClone(draftOrder);else state.orders.push(structuredClone(draftOrder));save();editingOrderId=draftOrder.id;toast('บันทึกออเดอร์แล้ว','success');render()}
function openProductModal(productId=''){if(commercialLocked()&&!productId){toast('ออเดอร์ยืนยันแล้ว ไม่สามารถเพิ่มสินค้าใหม่ใน Commercial Terms เดิม','danger');return}const existing=productId?draftOrder.products.find(p=>p.id===productId):null;const p=existing?structuredClone(existing):{id:uid(),name:'',type:'Bouquet',qty:1,unit:'ชิ้น',unitPrice:0,discountType:'amount',discountValue:0,description:'',internalNote:'',deliveryId:(draftOrder.deliveries||[])[0]?.id||'',flowers:[]};window._editingProduct=p;document.getElementById('modal').className='modal';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">PRODUCT ITEM</div><h3>${existing?'แก้ไขสินค้า':'เพิ่มสินค้าในออเดอร์'}</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body">${state.templates.length?`<div class="product-template-picker"><button class="template-pill" onclick="loadProductTemplate('')">เริ่มเปล่า</button>${state.templates.map(t=>`<button class="template-pill" onclick="loadProductTemplate('${t.id}')">${e(t.name)}</button>`).join('')}</div>`:''}<div class="form-grid">${field('ชื่อสินค้าที่จะแสดงในเอกสาร',`<input id="pName" class="input" value="${e(p.name)}" placeholder="เช่น Pastel Anniversary Bouquet">`,2)}${field('ประเภท',`<select id="pType" class="select">${['Bouquet','Arrangement','Event Set','Service','Other'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('จุดส่ง',`<select id="pDelivery" class="select"><option value="">ยังไม่กำหนด</option>${(draftOrder.deliveries||[]).map(d=>`<option value="${d.id}" ${p.deliveryId===d.id?'selected':''}>${e(d.recipient||'จุดส่ง')} ${d.date?'· '+fmtDate(d.date):''}</option>`).join('')}</select>`)}${field('จำนวน',`<input id="pQty" type="number" min="0.01" step="0.01" class="input" value="${num(p.qty||1)}">`)}${field('หน่วย',`<input id="pUnit" class="input" value="${e(p.unit||'ชิ้น')}">`)}${field('ราคาต่อหน่วย',`<input id="pPrice" type="number" min="0" class="input" value="${num(p.unitPrice)}">`)}${field('ส่วนลด',`<input id="pDiscount" type="number" min="0" class="input" value="${num(p.discountValue)}">`)}${field('รูปแบบส่วนลด',`<select id="pDiscountType" class="select"><option value="amount" ${p.discountType!=='percent'?'selected':''}>บาท</option><option value="percent" ${p.discountType==='percent'?'selected':''}>%</option></select>`)}${field('คำอธิบายสำหรับลูกค้า (ไม่ใส่ก็ได้)',`<textarea id="pDesc" class="textarea">${e(p.description)}</textarea>`,2)}${field('โน้ตภายใน',`<textarea id="pInternal" class="textarea">${e(p.internalNote)}</textarea>`,2)}</div><div style="margin-top:22px"><div class="section-kicker">FLOWER COMPOSITION</div><div class="section-title" style="font-size:18px">ดอกไม้ภายในสินค้านี้</div><p class="sub">เลือกชนิดดอกไม้ สี จำนวน และสัดส่วนสำหรับทำงานจริง ข้อมูลส่วนนี้ไม่แสดงบนใบเสนอราคา/ใบแจ้งหนี้</p><div id="productFlowerLines"></div><button class="btn btn-ghost" onclick="addProductFlower()">+ เพิ่มดอกไม้</button></div><div class="actions" style="justify-content:flex-end;margin-top:22px"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-dark" onclick="saveProductToDraft()">บันทึกสินค้า</button></div></div>`;renderProductFlowerLines();openModal();applyProductCommercialLock()}
function collectProductFields(){let p=window._editingProduct;if(!p)return;p.name=document.getElementById('pName')?.value||p.name;p.type=document.getElementById('pType')?.value||p.type;p.deliveryId=document.getElementById('pDelivery')?.value||'';p.qty=num(document.getElementById('pQty')?.value||p.qty);p.unit=document.getElementById('pUnit')?.value||p.unit;p.unitPrice=num(document.getElementById('pPrice')?.value||p.unitPrice);p.discountValue=num(document.getElementById('pDiscount')?.value||0);p.discountType=document.getElementById('pDiscountType')?.value||'amount';p.description=document.getElementById('pDesc')?.value||'';p.internalNote=document.getElementById('pInternal')?.value||''}
function loadProductTemplate(id){collectProductFields();if(!id){const keep=window._editingProduct.id;window._editingProduct={id:keep,name:'',type:'Bouquet',qty:1,unit:'ชิ้น',unitPrice:0,discountType:'amount',discountValue:0,description:'',internalNote:'',deliveryId:(draftOrder.deliveries||[])[0]?.id||'',flowers:[]};}else{const t=state.templates.find(x=>x.id===id);if(!t)return;window._editingProduct={...window._editingProduct,name:t.name,type:t.type,unitPrice:num(t.defaultPrice),description:t.description||'',flowers:(t.flowers||[]).map(f=>({...structuredClone(f),id:uid(),color:'',family:'',tone:''}))};}const p=window._editingProduct;document.getElementById('pName').value=p.name;document.getElementById('pType').value=p.type;document.getElementById('pDelivery').value=p.deliveryId||'';document.getElementById('pQty').value=p.qty||1;document.getElementById('pUnit').value=p.unit||'ชิ้น';document.getElementById('pPrice').value=p.unitPrice||0;document.getElementById('pDiscount').value=p.discountValue||0;document.getElementById('pDiscountType').value=p.discountType||'amount';document.getElementById('pDesc').value=p.description||'';document.getElementById('pInternal').value=p.internalNote||'';renderProductFlowerLines()}
function addProductFlower(){collectProductFields();const first=state.flowers[0];if(!first){toast('กรุณาสร้างรายการดอกไม้ใน Flower Master ก่อน','danger');return}window._editingProduct.flowers.push({id:uid(),flowerId:first.id,flowerName:first.name,unit:first.unit,qty:1,ratio:0,color:'',family:'',tone:''});renderProductFlowerLines()}
function renderProductFlowerLines(){const box=document.getElementById('productFlowerLines');if(!box)return;const p=window._editingProduct;box.innerHTML=(p.flowers||[]).map((f,i)=>`<div class="flower-line"><div class="flower-line-grid"><div class="field"><label>ดอกไม้</label><select class="select" onchange="updateProductFlower('${f.id}','flowerId',this.value)">${state.flowers.map(x=>`<option value="${x.id}" ${x.id===f.flowerId?'selected':''}>${e(x.name)} · ${e(x.unit)}</option>`).join('')}</select></div><div class="field"><label>จำนวน</label><input class="input" type="number" min="0" step="0.01" value="${num(f.qty)}" oninput="updateProductFlower('${f.id}','qty',this.value)"></div><div class="field"><label>สัดส่วน %</label><input class="input" type="number" min="0" max="100" step="1" value="${num(f.ratio)}" oninput="updateProductFlower('${f.id}','ratio',this.value)"></div><button class="btn btn-danger btn-sm" onclick="removeProductFlower('${f.id}')">ลบ</button></div><div class="swatches"><span class="sub">สี:</span>${QUICK_COLORS.map(c=>`<button class="swatch ${f.color===c?'active':''}" style="background:${c}" title="${c}" onclick="setFlowerColor('${f.id}','${c}')"></button>`).join('')}<input class="color-picker" type="color" value="${f.color||'#f3b6c4'}" onchange="setFlowerColor('${f.id}',this.value)" title="เลือกสีอื่น"><span class="tone-readout">${f.color?`${e(f.color)} · ${e(f.family)} / ${e(f.tone)}`:'ยังไม่เลือกสี'}</span></div><div class="ratio-meter"><span style="width:${Math.min(100,num(f.ratio))}%"></span></div></div>`).join('')||'<div class="empty">ยังไม่มีดอกไม้ในสินค้านี้</div>'}
function updateProductFlower(id,key,val){collectProductFields();const f=window._editingProduct.flowers.find(x=>x.id===id);if(!f)return;if(key==='flowerId'){const fm=state.flowers.find(x=>x.id===val);f.flowerId=val;f.flowerName=fm?.name||'';f.unit=fm?.unit||''}else f[key]=num(val);renderProductFlowerLines()}
function removeProductFlower(id){collectProductFields();window._editingProduct.flowers=window._editingProduct.flowers.filter(x=>x.id!==id);renderProductFlowerLines()}
function setFlowerColor(id,color){collectProductFields();const f=window._editingProduct.flowers.find(x=>x.id===id);if(!f)return;const cl=classifyColor(color);f.color=color;f.family=cl.family;f.tone=cl.tone;renderProductFlowerLines()}
function classifyColor(hex){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;let max=Math.max(r,g,b),min=Math.min(r,g,b),H=0,S=0,L=(max+min)/2,d=max-min;if(d){S=d/(1-Math.abs(2*L-1));switch(max){case r:H=60*(((g-b)/d)%6);break;case g:H=60*((b-r)/d+2);break;case b:H=60*((r-g)/d+4)}if(H<0)H+=360}let family;if(S<.08){family=L>.86?'ขาว':L<.2?'ดำ':'เทา'}else if(H<15||H>=345)family='แดง';else if(H<42)family='ส้ม/พีช';else if(H<68)family='เหลือง';else if(H<155)family='เขียว';else if(H<200)family='มิ้นต์/ฟ้าอมเขียว';else if(H<250)family='ฟ้า/น้ำเงิน';else if(H<295)family='ม่วง';else if(H<345)family='ชมพู';let tone;if(L>.88)tone='อ่อนมาก';else if(L>.74&&S<.55)tone='พาสเทล';else if(S<.28)tone='หม่น';else if(L<.3)tone='เข้ม';else if(S>.7)tone='สด';else tone='กลาง';return {family,tone,hue:Math.round(H),sat:Math.round(S*100),light:Math.round(L*100)}}
function saveProductToDraft(){collectProductFields();const p=window._editingProduct;if(!p.name.trim()){toast('กรุณาใส่ชื่อสินค้า','danger');return}if(['Bouquet','Arrangement','Event Set'].includes(p.type)&&!(p.flowers||[]).length){toast('สินค้าดอกไม้ควรมีดอกไม้อย่างน้อย 1 รายการ','danger');return}const noColor=(p.flowers||[]).find(f=>!f.color);if(noColor){toast('กรุณาเลือกสีให้ดอกไม้ทุกตัวในสินค้า','danger');return}const totalRatio=(p.flowers||[]).reduce((s,f)=>s+num(f.ratio),0);if((p.flowers||[]).length&&totalRatio&&Math.abs(totalRatio-100)>1)toast(`สัดส่วนรวม ${totalRatio}% (บันทึกได้ แต่แนะนำให้รวม 100%)`);const idx=draftOrder.products.findIndex(x=>x.id===p.id);if(idx>=0)draftOrder.products[idx]=structuredClone(p);else draftOrder.products.push(structuredClone(p));closeModal();render()}
function removeDraftProduct(id){if(confirm('ลบสินค้านี้ออกจากออเดอร์?')){draftOrder.products=draftOrder.products.filter(x=>x.id!==id);render()}}
function renderDeliveryEditor(o){return (o.deliveries||[]).map((d,i)=>`<div class="card entity-card" style="margin-bottom:10px;background:var(--canvas)"><div class="order-product-head"><div><div class="title">จุดส่ง ${i+1}</div><div class="sub">สินค้าในออเดอร์สามารถผูกกับจุดส่งนี้ได้จากหน้าแก้ไขสินค้า</div></div>${(o.deliveries||[]).length>1?`<button class="btn btn-danger btn-sm" type="button" onclick="removeDelivery('${d.id}')">ลบ</button>`:''}</div><div class="form-grid" style="margin-top:12px">${field('ผู้รับ',`<input class="input" value="${e(d.recipient)}" oninput="updateDelivery('${d.id}','recipient',this.value)">`)}${field('เบอร์โทร',`<input class="input" value="${e(d.phone)}" oninput="updateDelivery('${d.id}','phone',this.value)">`)}${field('วันที่ส่ง',`<input type="date" class="input" value="${e(d.date)}" onchange="updateDelivery('${d.id}','date',this.value)">`)}${field('เวลา',`<input type="time" class="input" value="${e(d.time)}" onchange="updateDelivery('${d.id}','time',this.value)">`)}${field('ที่อยู่',`<textarea class="textarea" oninput="updateDelivery('${d.id}','address',this.value)">${e(d.address)}</textarea>`,3)}${field('ค่าส่ง',`<input type="number" min="0" class="input" value="${num(d.fee)}" oninput="updateDelivery('${d.id}','fee',this.value)">`)}</div></div>`).join('')}
function updateDelivery(id,key,val){const d=draftOrder.deliveries.find(x=>x.id===id);if(!d)return;d[key]=key==='fee'?num(val):val;renderOrderSummaryOnly()}
function addDelivery(){draftOrder.deliveries=draftOrder.deliveries||[];draftOrder.deliveries.push({id:uid(),recipient:'',phone:'',address:'',date:'',time:'',fee:0});render()}
function removeDelivery(id){if(!confirm('ลบจุดส่งนี้? สินค้าที่ผูกไว้จะเปลี่ยนเป็นยังไม่กำหนดจุดส่ง'))return;draftOrder.deliveries=draftOrder.deliveries.filter(x=>x.id!==id);draftOrder.products.forEach(p=>{if(p.deliveryId===id)p.deliveryId=''});render()}
function renderEventCosts(o){return (o.eventCosts||[]).map(c=>`<div style="display:grid;grid-template-columns:1fr 160px auto;gap:8px;margin-bottom:8px"><input class="input" value="${e(c.label)}" oninput="cLabel('${c.id}',this.value)"><input class="input" type="number" value="${num(c.amount)}" oninput="cAmount('${c.id}',this.value)"><button class="btn btn-danger btn-sm" onclick="removeEventCost('${c.id}')">ลบ</button></div>`).join('')||'<div class="sub" style="margin-bottom:8px">ยังไม่มีต้นทุนพิเศษ</div>'}
function addEventCost(){draftOrder.eventCosts.push({id:uid(),label:'',amount:0});render()}function cLabel(id,v){draftOrder.eventCosts.find(x=>x.id===id).label=v}function cAmount(id,v){draftOrder.eventCosts.find(x=>x.id===id).amount=num(v)}function removeEventCost(id){draftOrder.eventCosts=draftOrder.eventCosts.filter(x=>x.id!==id);render()}
function renderPaymentSection(o){return `<div class="grid-2"><div><div class="list">${(o.payments||[]).map(p=>`<div class="list-row"><div><b>${fmtDate(p.date)} · ${e(p.method)}</b><div class="sub">${e(p.ref||p.note||'')}</div></div><div class="money">฿${money(p.amount)}</div></div>`).join('')||'<div class="empty">ยังไม่มีการชำระเงิน</div>'}</div><div style="margin-top:10px"><button class="btn btn-dark btn-sm" onclick="openPaymentModal()">+ บันทึกการชำระเงิน</button></div></div><div><div class="card entity-card"><h3>สถานะเอกสาร</h3><div class="list-row"><span>ใบเสนอราคา</span><b>${e(o.quoteNo||'—')}</b></div><div class="list-row"><span>ใบแจ้งหนี้</span><b>${e(o.invoiceNo||'—')}</b></div><div class="list-row"><span>ใบส่งของ</span><b>${e(o.deliveryNo||'—')}</b></div><div class="list-row"><span>ใบเสร็จ</span><b>${e(o.receiptNo||'—')}</b></div><div class="list-row"><span>ใบกำกับภาษี</span><b>${e(o.taxNo||'—')}</b></div></div></div></div>`}
function openPaymentModal(){document.getElementById('modal').className='modal small';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><h3>บันทึกการชำระเงิน</h3><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-grid">${field('วันที่',`<input id="payDate" type="date" class="input" value="${today()}">`,2)}${field('จำนวนเงิน',`<input id="payAmount" type="number" class="input" value="${Math.max(0,orderTotal(draftOrder).total-paid(draftOrder)).toFixed(2)}">`,2)}${field('ช่องทาง',`<select id="payMethod" class="select"><option>โอนเงิน</option><option>เงินสด</option><option>บัตร</option><option>อื่นๆ</option></select>`,2)}${field('เลขอ้างอิง / หมายเหตุ',`<input id="payRef" class="input">`,2)}</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-dark" onclick="savePayment()">บันทึก</button></div></div>`;openModal()}
function savePayment(){let a=num(document.getElementById('payAmount').value);if(a<=0){toast('จำนวนเงินต้องมากกว่า 0','danger');return}draftOrder.payments.push({id:uid(),date:document.getElementById('payDate').value,amount:a,method:document.getElementById('payMethod').value,ref:document.getElementById('payRef').value});draftOrder.paymentStatus=paid(draftOrder)>=orderTotal(draftOrder).total?'paid':'partial';closeModal();saveOrderDraft()}
function issueQuotation(){if(!editingOrderId){saveOrderDraft();return}if(!draftOrder.quoteNo){draftOrder.quoteNo=`${state.settings.quotePrefix}-${new Date().getFullYear()}-${String(++state.seq.quote).padStart(4,'0')}`;draftOrder.status='quoted';draftOrder.quoteStatus='sent';saveOrderDraft()}openDocument('quotation',draftOrder.id)}
function ensureDocNo(type){const map={invoice:['invoiceNo','invoice','invoicePrefix'],delivery:['deliveryNo','delivery','deliveryPrefix'],receipt:['receiptNo','receipt','receiptPrefix'],tax:['taxNo','tax','taxPrefix']};if(type==='quotation'){if(!draftOrder.quoteNo)issueQuotation();return draftOrder.quoteNo}let [field,seq,prefix]=map[type];if(!draftOrder[field]){draftOrder[field]=`${state.settings[prefix]}-${new Date().getFullYear()}-${String(++state.seq[seq]).padStart(4,'0')}`;saveOrderDraft()}return draftOrder[field]}
function openDocumentsMenu(){document.getElementById('modal').className='modal small';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><div><div class="mono">DOCUMENTS</div><h3>เอกสารของ ${e(draftOrder.orderNo)}</h3></div><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="grid-2"><button class="btn btn-primary" onclick="closeModal();issueQuotation()">ใบเสนอราคา</button><button class="btn btn-dark" onclick="closeModal();ensureDocNo('invoice');openDocument('invoice','${draftOrder.id}')">ใบแจ้งหนี้</button><button class="btn btn-outline" onclick="closeModal();ensureDocNo('delivery');openDocument('delivery','${draftOrder.id}')">ใบส่งของ</button><button class="btn btn-outline" onclick="closeModal();ensureDocNo('receipt');openDocument('receipt','${draftOrder.id}')">ใบเสร็จรับเงิน</button><button class="btn btn-outline" onclick="closeModal();ensureDocNo('tax');openDocument('tax','${draftOrder.id}')">ใบกำกับภาษี</button></div><p class="sub" style="margin-top:16px">เอกสารทั้งหมดใช้ข้อมูล Product Item เท่านั้น สูตรดอกไม้และสีเป็นข้อมูลภายในร้าน</p></div>`;openModal()}
function openModal(){document.getElementById('modalBackdrop').classList.add('open');document.body.classList.add('modal-open')}function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');document.body.classList.remove('modal-open')}
function renderCustomers(){return `<div class="page-head"><div><h2>ลูกค้า / CRM</h2><p>ข้อมูลผู้ซื้อเป็นหลัก ผู้รับดอกไม้เก็บในแต่ละออเดอร์ได้แยกกัน</p></div><div class="actions"><button class="btn btn-primary" onclick="openCustomerModal()">+ เพิ่มลูกค้า</button></div></div><div class="grid-3">${state.customers.map(c=>{let os=state.orders.filter(o=>o.customerId===c.id&&!['cancelled'].includes(o.status));let spend=os.filter(o=>['confirmed','active','completed'].includes(o.status)).reduce((s,o)=>s+orderTotal(o).total,0);let tier=spend>=50000?'VIP':os.length>=3?'Loyal':os.length>=1?'Active':'New';return `<div class="card entity-card"><h3>${e(c.name)}</h3><div class="meta"><span class="badge ${tier==='VIP'?'orange':''}">${tier}</span><span class="badge">${e(c.type)}</span><span class="badge">${e(c.channel||'-')}</span></div><div class="sub">${e(c.contactName||'')} · ${e(c.phone||'-')}</div><div class="sub">${e(c.email||'')}</div><div class="foot"><div><div class="money">฿${money(spend)}</div><div class="sub">${os.length} ออเดอร์</div></div><button class="btn btn-outline btn-sm" onclick="openCustomerModal(false,'${c.id}')">แก้ไข</button></div></div>`}).join('')||'<div class="empty">ยังไม่มีลูกค้า</div>'}</div>`}
function openCustomerModal(quick=false,id=''){const c=id?structuredClone(state.customers.find(x=>x.id===id)):{id:uid(),type:'บุคคล',name:'',contactName:'',phone:'',email:'',taxId:'',branch:'',address:'',channel:'Instagram',tags:[],notes:''};window._editingCustomer={c,quick};document.getElementById('modal').className='modal';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><h3>${id?'แก้ไขลูกค้า':'เพิ่มลูกค้า'}</h3><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-grid">${field('ประเภท',`<select id="cType" class="select"><option ${c.type==='บุคคล'?'selected':''}>บุคคล</option><option ${c.type==='บริษัท'?'selected':''}>บริษัท</option></select>`)}${field('ชื่อ / ชื่อบริษัท',`<input id="cName" class="input" value="${e(c.name)}">`,2)}${field('ผู้ติดต่อ',`<input id="cContact" class="input" value="${e(c.contactName)}">`)}${field('โทรศัพท์',`<input id="cPhone" class="input" value="${e(c.phone)}">`)}${field('อีเมล',`<input id="cEmail" class="input" value="${e(c.email)}">`)}${field('เลขผู้เสียภาษี',`<input id="cTax" class="input" value="${e(c.taxId)}">`)}${field('สาขา',`<input id="cBranch" class="input" value="${e(c.branch)}">`)}${field('ที่อยู่',`<textarea id="cAddress" class="textarea">${e(c.address)}</textarea>`,2)}${field('ช่องทางที่รู้จักร้าน',`<select id="cChannel" class="select">${['Instagram','LINE','โทรศัพท์ส่วนตัว','Referral','Walk-in','อื่นๆ'].map(x=>`<option ${c.channel===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('Tags (คั่นด้วย ,)',`<input id="cTags" class="input" value="${e((c.tags||[]).join(', '))}">`)}${field('โน้ต',`<textarea id="cNotes" class="textarea">${e(c.notes)}</textarea>`,2)}</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn btn-dark" onclick="saveCustomer()">บันทึก</button></div></div>`;openModal()}
function saveCustomer(){let w=window._editingCustomer,c=w.c;c.type=document.getElementById('cType').value;c.name=document.getElementById('cName').value.trim();if(!c.name){toast('กรุณาใส่ชื่อลูกค้า','danger');return}c.contactName=document.getElementById('cContact').value;c.phone=document.getElementById('cPhone').value;c.email=document.getElementById('cEmail').value;c.taxId=document.getElementById('cTax').value;c.branch=document.getElementById('cBranch').value;c.address=document.getElementById('cAddress').value;c.channel=document.getElementById('cChannel').value;c.tags=document.getElementById('cTags').value.split(',').map(x=>x.trim()).filter(Boolean);c.notes=document.getElementById('cNotes').value;let i=state.customers.findIndex(x=>x.id===c.id);if(i>=0)state.customers[i]=c;else state.customers.push(c);save();closeModal();if(w.quick&&draftOrder){draftOrder.customerId=c.id;prefillRecipient();}else render();toast('บันทึกลูกค้าแล้ว','success')}
function renderFlowers(){return `<div class="page-head"><div><h2>รายการดอกไม้</h2><p>Flower Master เก็บเฉพาะชนิดดอกไม้ หน่วย และโน้ต — ไม่มีสี สีจะถูกเลือกตอนเพิ่มดอกไม้เข้า “สินค้าในออเดอร์” เท่านั้น</p></div><div class="actions"><button class="btn btn-primary" onclick="openFlowerModal()">+ เพิ่มดอกไม้</button></div></div><div class="grid-3">${state.flowers.map(f=>`<div class="card entity-card"><div class="flower-row-head"><div class="flower-thumb">✿</div><div><h3>${e(f.name)}</h3><div class="sub">หน่วย: ${e(f.unit)}</div></div></div><p class="sub">${e(f.note||'ไม่มีหมายเหตุ')}</p><div class="foot"><span class="mono">FLOWER MASTER</span><button class="btn btn-outline btn-sm" onclick="openFlowerModal('${f.id}')">แก้ไข</button></div></div>`).join('')||'<div class="empty">ยังไม่มีรายการดอกไม้</div>'}</div>`}
function openFlowerModal(id=''){const f=id?structuredClone(state.flowers.find(x=>x.id===id)):{id:uid(),name:'',unit:'ดอก',note:''};window._editingFlower=f;document.getElementById('modal').className='modal small';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><h3>${id?'แก้ไขดอกไม้':'เพิ่มดอกไม้'}</h3><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body">${field('ชื่อดอกไม้',`<input id="fName" class="input" value="${e(f.name)}">`)}<br>${field('หน่วย',`<input id="fUnit" class="input" value="${e(f.unit)}">`)}<br>${field('หมายเหตุ',`<textarea id="fNote" class="textarea">${e(f.note)}</textarea>`)}<p class="sub">ไม่มีการตั้งสีที่หน้านี้ ตามหลัก Made-to-order สีเป็นข้อมูลของออเดอร์จริง</p><div class="actions" style="justify-content:flex-end"><button class="btn btn-dark" onclick="saveFlower()">บันทึก</button></div></div>`;openModal()}
function saveFlower(){let f=window._editingFlower;f.name=document.getElementById('fName').value.trim();f.unit=document.getElementById('fUnit').value.trim()||'ดอก';f.note=document.getElementById('fNote').value;if(!f.name){toast('กรุณาใส่ชื่อดอกไม้','danger');return}let i=state.flowers.findIndex(x=>x.id===f.id);if(i>=0)state.flowers[i]=f;else state.flowers.push(f);save();closeModal();render();toast('บันทึกดอกไม้แล้ว','success')}
function renderTemplates(){return `<div class="page-head"><div><h2>สินค้า / แบบช่อ</h2><p>Template ช่วยเรียกใช้สูตรดอกไม้เดิมเร็วขึ้น แต่ “สี” จะไม่ถูกบันทึกใน Template ต้องเลือกใหม่ในแต่ละออเดอร์</p></div><div class="actions"><button class="btn btn-primary" onclick="openTemplateModal()">+ สร้าง Template</button></div></div><div class="grid-3">${state.templates.map(t=>`<div class="card entity-card"><div class="mono">${e(t.type)}</div><h3>${e(t.name)}</h3><p class="sub">${e(t.description||'')}</p><div class="composition-chips">${(t.flowers||[]).map(f=>`<span class="flower-chip">${e(f.flowerName)} · ${num(f.qty)} ${e(f.unit)} · ${num(f.ratio)}%</span>`).join('')}</div><div class="foot"><div><div class="money">฿${money(t.defaultPrice)}</div><div class="sub">ราคาแนะนำ</div></div><button class="btn btn-outline btn-sm" onclick="openTemplateModal('${t.id}')">แก้ไข</button></div></div>`).join('')||'<div class="empty">ยังไม่มี Product Template<br><span class="sub">สามารถสร้างสูตรช่อที่ใช้บ่อย โดยไม่ผูกสี</span></div>'}</div>`}
function openTemplateModal(id=''){const t=id?structuredClone(state.templates.find(x=>x.id===id)):{id:uid(),name:'',type:'Bouquet',defaultPrice:0,description:'',flowers:[]};window._editingTemplate=t;document.getElementById('modal').className='modal';document.getElementById('modalContent').innerHTML=`<div class="modal-head"><h3>${id?'แก้ไข Product Template':'สร้าง Product Template'}</h3><button class="close-btn" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-grid">${field('ชื่อสินค้า',`<input id="tName" class="input" value="${e(t.name)}">`,2)}${field('ประเภท',`<select id="tType" class="select">${['Bouquet','Arrangement','Event Set','Service','Other'].map(x=>`<option ${t.type===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('ราคาแนะนำ',`<input id="tPrice" type="number" class="input" value="${num(t.defaultPrice)}">`)}${field('คำอธิบาย',`<textarea id="tDesc" class="textarea">${e(t.description)}</textarea>`,4)}</div><div class="section-title" style="font-size:17px;margin-top:20px">สูตรดอกไม้ (ไม่มีสี)</div><div id="templateFlowers">${renderTemplateFlowers(t)}</div><button class="btn btn-ghost btn-sm" onclick="addTemplateFlower()">+ เพิ่มดอกไม้</button><div class="actions" style="justify-content:flex-end;margin-top:20px"><button class="btn btn-dark" onclick="saveTemplate()">บันทึก Template</button></div></div>`;openModal()}
function renderTemplateFlowers(t){return (t.flowers||[]).map(f=>`<div style="display:grid;grid-template-columns:1.3fr .7fr .7fr auto;gap:8px;margin-bottom:8px"><select class="select" onchange="updateTemplateFlower('${f.id}','flowerId',this.value)">${state.flowers.map(x=>`<option value="${x.id}" ${x.id===f.flowerId?'selected':''}>${e(x.name)}</option>`).join('')}</select><input class="input" type="number" value="${num(f.qty)}" oninput="updateTemplateFlower('${f.id}','qty',this.value)" placeholder="จำนวน"><input class="input" type="number" value="${num(f.ratio)}" oninput="updateTemplateFlower('${f.id}','ratio',this.value)" placeholder="%"><button class="btn btn-danger btn-sm" onclick="removeTemplateFlower('${f.id}')">ลบ</button></div>`).join('')||'<div class="sub" style="margin-bottom:8px">ยังไม่มีดอกไม้</div>'}
function collectTemplate(){let t=window._editingTemplate;t.name=document.getElementById('tName')?.value||t.name;t.type=document.getElementById('tType')?.value||t.type;t.defaultPrice=num(document.getElementById('tPrice')?.value||t.defaultPrice);t.description=document.getElementById('tDesc')?.value||t.description}
function addTemplateFlower(){collectTemplate();let f=state.flowers[0];if(!f){toast('เพิ่ม Flower Master ก่อน','danger');return}window._editingTemplate.flowers.push({id:uid(),flowerId:f.id,flowerName:f.name,unit:f.unit,qty:1,ratio:0});document.getElementById('templateFlowers').innerHTML=renderTemplateFlowers(window._editingTemplate)}
function updateTemplateFlower(id,key,val){collectTemplate();let f=window._editingTemplate.flowers.find(x=>x.id===id);if(key==='flowerId'){let fm=state.flowers.find(x=>x.id===val);f.flowerId=val;f.flowerName=fm.name;f.unit=fm.unit}else f[key]=num(val)}
function removeTemplateFlower(id){collectTemplate();window._editingTemplate.flowers=window._editingTemplate.flowers.filter(x=>x.id!==id);document.getElementById('templateFlowers').innerHTML=renderTemplateFlowers(window._editingTemplate)}
function saveTemplate(){collectTemplate();let t=window._editingTemplate;if(!t.name.trim()){toast('กรุณาใส่ชื่อสินค้า','danger');return}let i=state.templates.findIndex(x=>x.id===t.id);if(i>=0)state.templates[i]=t;else state.templates.push(t);save();closeModal();render();toast('บันทึก Template แล้ว','success')}
function renderAnalytics(){const orders=confirmedOrders();let flowerMap={},colorMap={},channelMap={};orders.forEach(o=>{channelMap[o.source]=(channelMap[o.source]||0)+1;(o.products||[]).forEach(p=>(p.flowers||[]).forEach(f=>{flowerMap[f.flowerName]=(flowerMap[f.flowerName]||0)+num(f.qty);let k=(f.family||'ไม่ระบุ')+' / '+(f.tone||'');colorMap[k]=(colorMap[k]||0)+num(f.qty)}))});return `<div class="page-head"><div><h2>วิเคราะห์</h2><p>อ่านจากข้อมูลที่ใช้จริงในออเดอร์ที่ยืนยันแล้ว ไม่ใช่จาก Flower Master</p></div></div><div class="analytics-grid">${rankCard('ดอกไม้ที่ถูกใช้',flowerMap,'หน่วย')}${rankCard('โทนสีที่ถูกใช้',colorMap,'หน่วย')}${rankCard('ช่องทางออเดอร์',channelMap,'ออเดอร์')}</div><div class="card panel" style="margin-top:14px"><div class="panel-title"><h3>Insight ที่ระบบพร้อมต่อยอด</h3></div><div class="grid-3"><div class="entity-card"><b>Flower × Occasion</b><p class="sub">ดูว่างาน Anniversary / Birthday / Event นิยมดอกอะไร</p></div><div class="entity-card"><b>Color Affinity</b><p class="sub">วิเคราะห์ลูกค้าแต่ละคนชอบ Family/Tone สีแบบไหน</p></div><div class="entity-card"><b>Product Performance</b><p class="sub">ดูสินค้าชื่อไหนขายบ่อยและ Average Selling Price</p></div></div></div>`}
function rankCard(title,map,unit){let arr=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8),max=arr[0]?.[1]||1;return `<div class="card panel"><div class="panel-title"><h3>${title}</h3></div><div class="rank-list">${arr.map(x=>`<div class="rank"><div><b>${e(x[0])}</b><div class="rank-bar"><span style="width:${x[1]/max*100}%"></span></div></div><span class="sub">${money(x[1])} ${unit}</span></div>`).join('')||'<div class="empty">ยังไม่มีข้อมูล</div>'}</div></div>`}
function renderSettings(){const s=state.settings;return `<div class="page-head"><div><h2>ตั้งค่า</h2><p>ข้อมูลผู้ออกเอกสาร เลขรัน ภาษี และการสำรองข้อมูล</p></div><div class="actions"><button class="btn btn-dark" onclick="saveSettings()">บันทึกการตั้งค่า</button></div></div><div class="settings-grid"><div class="card settings-card"><h3>ข้อมูลร้าน / ผู้ออกเอกสาร</h3><div class="form-grid">${field('ชื่อร้าน',`<input id="sCompany" class="input" value="${e(s.company)}">`,2)}${field('ชื่อทางกฎหมาย',`<input id="sLegal" class="input" value="${e(s.legalName)}">`,2)}${field('เลขผู้เสียภาษี',`<input id="sTaxId" class="input" value="${e(s.taxId)}">`)}${field('สาขา',`<input id="sBranch" class="input" value="${e(s.branch)}">`)}${field('โทร',`<input id="sPhone" class="input" value="${e(s.phone)}">`)}${field('อีเมล',`<input id="sEmail" class="input" value="${e(s.email)}">`)}${field('Instagram',`<input id="sIg" class="input" value="${e(s.instagram)}">`)}${field('LINE',`<input id="sLine" class="input" value="${e(s.line)}">`)}${field('ที่อยู่',`<textarea id="sAddress" class="textarea">${e(s.address)}</textarea>`,4)}</div></div><div class="card settings-card"><h3>เอกสารและภาษี</h3><label class="checkbox-setting"><input id="sVatSwitch" type="checkbox" class="setting-checkbox ${s.vatEnabled?'on':''}" ${s.vatEnabled?'checked':''} onchange="this.classList.toggle('on',this.checked)"><span class="checkbox-mark" aria-hidden="true"></span><span><b>เปิด VAT เป็นค่าเริ่มต้น</b><span class="sub">ออเดอร์ใหม่จะใช้ค่านี้</span></span></label><div class="form-grid" style="margin-top:14px">${field('VAT (%)',`<input id="sVatRate" type="number" class="input" value="${num(s.vatRate)}">`)}${field('อายุใบเสนอราคา (วัน)',`<input id="sValid" type="number" class="input" value="${num(s.quoteValidDays)}">`)}${field('Prefix ใบเสนอราคา',`<input id="sQ" class="input" value="${e(s.quotePrefix)}">`)}${field('Prefix Invoice',`<input id="sI" class="input" value="${e(s.invoicePrefix)}">`)}${field('Prefix ใบส่งของ',`<input id="sD" class="input" value="${e(s.deliveryPrefix)}">`)}${field('Prefix Receipt',`<input id="sR" class="input" value="${e(s.receiptPrefix)}">`)}${field('Prefix Tax Invoice',`<input id="sT" class="input" value="${e(s.taxPrefix)}">`)}${field('เงื่อนไขใบเสนอราคา',`<textarea id="sTerms" class="textarea">${e(s.terms)}</textarea>`,4)}</div></div><div class="card settings-card"><h3>ข้อมูลรับชำระ</h3><div class="form-grid">${field('ธนาคาร',`<input id="sBank" class="input" value="${e(s.bankName)}">`)}${field('ชื่อบัญชี',`<input id="sBankAcc" class="input" value="${e(s.bankAccount)}">`)}${field('เลขบัญชี',`<input id="sBankNo" class="input" value="${e(s.bankNo)}">`,2)}</div></div><div class="card settings-card"><h3>สำรอง / ย้ายข้อมูล</h3><p class="sub">เวอร์ชันนี้เก็บข้อมูลใน Browser เครื่องนี้ จึงควร Export Backup เป็นระยะ</p><div class="actions"><button class="btn btn-dark" onclick="exportBackup()">Export Backup (.json)</button><label class="btn btn-outline">Import Backup<input type="file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])"></label></div><div style="margin-top:18px"><button class="btn btn-danger btn-sm" onclick="resetData()">ล้างข้อมูลทั้งหมด</button></div></div></div>`}
function saveSettings(){let s=state.settings;s.company=document.getElementById('sCompany').value;s.legalName=document.getElementById('sLegal').value;s.taxId=document.getElementById('sTaxId').value;s.branch=document.getElementById('sBranch').value;s.phone=document.getElementById('sPhone').value;s.email=document.getElementById('sEmail').value;s.instagram=document.getElementById('sIg').value;s.line=document.getElementById('sLine').value;s.address=document.getElementById('sAddress').value;s.vatEnabled=document.getElementById('sVatSwitch').classList.contains('on');s.vatRate=num(document.getElementById('sVatRate').value);s.quoteValidDays=num(document.getElementById('sValid').value);s.quotePrefix=document.getElementById('sQ').value;s.invoicePrefix=document.getElementById('sI').value;s.deliveryPrefix=document.getElementById('sD').value;s.receiptPrefix=document.getElementById('sR').value;s.taxPrefix=document.getElementById('sT').value;s.terms=document.getElementById('sTerms').value;s.bankName=document.getElementById('sBank').value;s.bankAccount=document.getElementById('sBankAcc').value;s.bankNo=document.getElementById('sBankNo').value;save();toast('บันทึกการตั้งค่าแล้ว','success')}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mademyday-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data.settings||!Array.isArray(data.orders))throw Error();state=data;save();render();toast('Import Backup สำเร็จ','success')}catch{toast('ไฟล์ Backup ไม่ถูกต้อง','danger')}};r.readAsText(file)}

function openDocument(type,id){const o=state.orders.find(x=>x.id===id)||draftOrder;if(!o)return;const c=state.customers.find(x=>x.id===o.customerId)||{};const typeInfo={quotation:['ใบเสนอราคา','QUOTATION',o.quoteNo||'DRAFT'],invoice:['ใบแจ้งหนี้','INVOICE',o.invoiceNo||'DRAFT'],delivery:['ใบส่งของ','DELIVERY NOTE',o.deliveryNo||'DRAFT'],receipt:['ใบเสร็จรับเงิน','RECEIPT',o.receiptNo||'DRAFT'],tax:['ใบกำกับภาษี','TAX INVOICE',o.taxNo||'DRAFT']}[type];const items=(o.products||[]);const chunks=[];for(let i=0;i<items.length;i+=6)chunks.push(items.slice(i,i+6));if(!chunks.length)chunks.push([]);document.getElementById('docPages').innerHTML=chunks.map((chunk,idx)=>renderDocPage(type,o,c,typeInfo,chunk,idx,chunks.length)).join('');document.getElementById('docOverlay').classList.add('open');setTimeout(scaleDocPages,30)}
